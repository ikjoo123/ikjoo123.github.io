<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>근무 데이터 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px 50px}h1{font-size:23px;margin:0 0 16px}.panel{background:#fff;border:1px solid #e4e7eb;border-radius:16px;padding:16px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.input,select,textarea{font:inherit;border:1px solid #d2d7de;border-radius:9px;background:#fff}.input,select{padding:9px}.btn{border:1px solid #d2d7de;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.primary{font-weight:700}textarea{width:100%;height:65vh;min-height:400px;margin-top:12px;padding:14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.5;tab-size:2}.status{margin-top:12px;padding:11px;border-radius:9px;background:#f7f7f8;line-height:1.6}.ok{color:#26743a}.bad{color:#a33}.help{font-size:13px;color:#666;line-height:1.7}.hidden{display:none!important}
</style></head><body><main class="wrap">
<h1>🗂️ 근무 데이터 관리</h1>
<div class="panel">
 <div class="row">
  <input id="month" class="input" value="2026-10" placeholder="2026-10">
  <select id="section"><option value="nurses">간호사 · nurses.json</option><option value="assistants">보조원 · assistants.json</option><option value="doctors">의사 · doctors.json</option><option value="pa">PA · pa.json</option><option value="emt">응급구조사 · emt.json</option></select>
  <button id="load" class="btn primary">📥 불러오기</button>
  <button id="check" class="btn" disabled>🔎 JSON 검사</button>
  <button id="save" class="btn primary" disabled>💾 R2 저장</button>
  <button id="back" class="btn">← 근무로</button>
 </div>
 <div class="help" style="margin-top:12px">
  관리자 전용입니다. 선택한 월/구역의 R2 JSON을 그대로 편집할 수 있습니다.<br>
  <b>저장 전 JSON 검사를 먼저 하고, 저장하면 해당 JSON 하나만 백업 후 교체합니다.</b>
 </div>
 <textarea id="editor" spellcheck="false" disabled></textarea>
 <div id="status" class="status">관리자 확인 중...</div>
</div>
</main>
<script>
const API="https://ikjoo123-github-io.zjaghkf0000.workers.dev";
const $=id=>document.getElementById(id);
let loaded=null;
function token(){return localStorage.getItem("ju_files_token")||""}
async function admin(){
 try{const r=await fetch(API+"/api/me",{headers:{Authorization:"Bearer "+token()}});return r.ok&&(await r.json()).role==="admin"}catch(_){return false}
}
function setStatus(html){$("status").innerHTML=html}
function pretty(v){return JSON.stringify(v,null,2)}
function validate(v,section){
 if(v===null||v===undefined)throw new Error("JSON 데이터가 비어 있습니다.");
 if(section==="nurses"||section==="assistants"){
  if(!Array.isArray(v))throw new Error("직원 데이터는 배열이어야 합니다.");
  const role=section==="nurses"?"n":"a";
  const names=new Set();
  for(const x of v){
   if(!Array.isArray(x)||x.length!==3||x[0]!==role||typeof x[1]!=="string"||!Array.isArray(x[2]))throw new Error("직원 데이터 형식이 잘못되었습니다: "+JSON.stringify(x));
   if(x[2].length!==31)throw new Error(x[1]+"의 근무일수가 "+x[2].length+"일입니다. 31일이어야 합니다.");
   if(names.has(x[1]))throw new Error("이름 중복: "+x[1]);names.add(x[1]);
  }
 }else if(section==="doctors"){
  if(typeof v!=="object"||Array.isArray(v))throw new Error("의사 데이터는 객체여야 합니다.");
 }else if(section==="pa"||section==="emt"){
  if(!Array.isArray(v))throw new Error(section+" 데이터는 배열이어야 합니다.");
 }
}
async function loadData(){
 if(!(await admin())){setStatus('<span class="bad">관리자 로그인이 필요합니다.</span>');return}
 const month=$("month").value.trim(),section=$("section").value;
 if(!/^\d{4}-\d{2}$/.test(month)){setStatus('<span class="bad">월 형식: 2026-10</span>');return}
 setStatus("불러오는 중...");
 try{
  const r=await fetch(API+"/api/duty/"+month+"/"+section,{cache:"no-store"});
  if(!r.ok)throw new Error("데이터 없음 또는 불러오기 실패 ("+r.status+")");
  const data=await r.json();validate(data,section);
  loaded={month,section};$("editor").value=pretty(data);$("editor").disabled=false;$("check").disabled=false;$("save").disabled=false;
  setStatus('<span class="ok">✅ '+month+' / '+section+'.json 불러옴</span>');
 }catch(e){loaded=null;$("editor").disabled=true;$("check").disabled=true;$("save").disabled=true;setStatus('<span class="bad">❌ '+e.message+'</span>')}
}
function checkData(){
 try{const v=JSON.parse($("editor").value);validate(v,loaded.section);setStatus('<span class="ok">✅ JSON 형식 및 기본 근무 데이터 검사를 통과했습니다.</span>');return v}catch(e){setStatus('<span class="bad">❌ '+e.message+'</span>');return null}
}
$("load").onclick=loadData;
$("check").onclick=checkData;
$("save").onclick=async()=>{
 if(!loaded)return;
 const v=checkData();if(v===null)return;
 if(!confirm(loaded.month+" / "+loaded.section+".json을 R2에 저장할까요?"))return;
 $("save").disabled=true;setStatus("백업 후 저장 중...");
 try{
  const r=await fetch(API+"/api/duty/"+loaded.month+"/"+loaded.section,{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token()},body:JSON.stringify(v)});
  if(!r.ok)throw new Error("저장 실패 ("+r.status+")");
  const vr=await fetch(API+"/api/duty/"+loaded.month+"/"+loaded.section,{cache:"no-store"});
  if(!vr.ok)throw new Error("저장 후 확인 실패");
  const saved=await vr.json();
  if(JSON.stringify(saved)!==JSON.stringify(v))throw new Error("저장 후 JSON이 입력 내용과 다릅니다.");
  setStatus('<span class="ok">✅ R2 저장 및 다시 읽기 확인 완료</span>');
 }catch(e){setStatus('<span class="bad">❌ '+e.message+'</span>')}finally{$("save").disabled=false}
};
$("back").onclick=()=>location.href="duty.html";
(async()=>{if(!(await admin()))setStatus('<span class="bad">관리자 로그인이 필요합니다.</span>');else setStatus("✅ 관리자 로그인 확인");})();
</script></body></html>
