<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>근무 데이터 관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px 50px}h1{font-size:23px;margin:0 0 16px}.panel{background:#fff;border:1px solid #e4e7eb;border-radius:16px;padding:16px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.input,select,textarea{font:inherit;border:1px solid #d2d7de;border-radius:9px;background:#fff}.input,select{padding:9px}.btn{border:1px solid #d2d7de;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.primary{font-weight:700}textarea{width:100%;height:65vh;min-height:400px;margin-top:12px;padding:14px;font-size:14px;line-height:1.65;tab-size:2}.status{margin-top:12px;padding:11px;border-radius:9px;background:#f7f7f8;line-height:1.6}.ok{color:#26743a}.bad{color:#a33}.help{font-size:13px;color:#666;line-height:1.7}.hidden{display:none!important}.count{margin-top:8px;font-size:13px;color:#666}.preview{margin-top:12px;padding:12px;background:#f7f7f8;border-radius:10px;white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:260px;overflow:auto}.hint{margin-top:8px;padding:10px;background:#f9fafb;border-radius:9px;font-size:12px;color:#666;white-space:pre-wrap}</style></head><body><main class="wrap"><h1>🗂️ 근무 데이터 관리</h1><div class="panel"><div class="row"><input id="month" class="input" value="2026-10" placeholder="2026-10"><select id="section"><option value="nurses">간호사 · nurses.json</option><option value="assistants">보조원 · assistants.json</option><option value="doctors">의사 · doctors.json</option><option value="pa">PA · pa.json</option><option value="emt">응급구조사 · emt.json</option></select><button id="load" class="btn primary">📥 불러오기</button><button id="check" class="btn" disabled>🔎 입력 검사</button><button id="save" class="btn primary" disabled>💾 R2 저장</button><button id="back" class="btn">← 근무로</button></div><div id="help" class="help" style="margin-top:12px"></div><div id="hint" class="hint"></div><textarea id="editor" spellcheck="false" disabled></textarea><div id="count" class="count"></div><div id="preview" class="preview hidden"></div><div id="status" class="status">관리자 확인 중...</div></div></main><script>
const API="https://ikjoo123-github-io.zjaghkf0000.workers.dev";const $=id=>document.getElementById(id);let loaded=null;
function token(){return localStorage.getItem("ju_files_token")||""}
async function admin(){try{const r=await fetch(API+"/api/me",{headers:{Authorization:"Bearer "+token()}});return r.ok&&(await r.json()).role==="admin"}catch(_){return false}}
function setStatus(html){$("status").innerHTML=html} function pretty(v){return JSON.stringify(v,null,2)}
function normalizeToken(x){const s=String(x??"").trim();if(!s)return "";const u=s.toUpperCase();if(["D","DAY"].includes(u))return"D";if(["E","EVE","EVENING"].includes(u))return"E";if(["N","NIGHT"].includes(u))return"N";if(/^M$/i.test(s))return"M";return""}
function splitCodes(s){return s.replace(/[,，、|]/g," ").split(/\s+|\/+/).map(x=>String(x).trim()).filter(Boolean)}
function cleanCodes(arr){return arr.map(normalizeToken)}
function parsePeopleText(text,section){const lines=text.split(/\r?\n/),people=[],errors=[];let currentRole=null;const roleMap={간호사:"n",nurses:"n",보조원:"a",assistant:"a",assistants:"a",PA:"pa",pa:"pa",응급구조사:"emt",emt:"emt",전문의:"specialist",전공의:"resident",인턴:"intern"};for(let i=0;i<lines.length;){const raw=lines[i].trim();if(!raw){i++;continue}const header=raw.match(/^\[?([^\] :]+)\]?$/);if(section==="doctors"&&header&&roleMap[header[1]]){currentRole=roleMap[header[1]];i++;continue}let name="",codeLine="";const inline=raw.match(/^(.+?)\s+(?:D|E|N|M|X|OFF|공란|Hx|연|차|휴무)(?:\s*[/,，、| ]\s*(?:D[1-4]?|E[1-4]?|N[1-4]?|M|eE[1-4]?|sD|X|OFF|공란|Hx|연|차|휴무))*$/i);if(inline){name=inline[1].trim();codeLine=raw.slice(inline[1].length).trim();i++}else{name=raw.replace(/^[-•·]\s*/,"").trim();codeLine=(lines[i+1]||"").trim();if(codeLine&&/^(?:D[1-4]?|E[1-4]?|N[1-4]?|M|eE[1-4]?|sD|X|OFF|공란|Hx|연|차|휴무)(?:\s*[/,，、| ]\s*(?:D[1-4]?|E[1-4]?|N[1-4]?|M|eE[1-4]?|sD|X|OFF|공란|Hx|연|차|휴무))*$/i.test(codeLine))i+=2;else{errors.push(name+"의 근무 코드 줄을 찾지 못했습니다.");i++;continue}}const codes=cleanCodes(splitCodes(codeLine));if(!name)errors.push("이름이 비어 있습니다.");if(codes.length!==31)errors.push((currentRole?currentRole+" ":"")+name+" : "+codes.length+"개 입력됨 → 31개 필요");people.push({role:currentRole,name,codes})}const seen=new Set();people.forEach(p=>{const key=(p.role||"")+"/"+p.name;if(seen.has(key))errors.push("이름 중복: "+key);seen.add(key)});if(errors.length)throw new Error(errors.join("\n"));return people}
function nursesToText(data){return data.map(x=>x[1]+"\n"+x[2].map(c=>c||"공란").join(" / ")).join("\n\n")}
function paToText(data){return data.map(x=>x[0]+"\n"+(x[1]||[]).map(c=>c||"공란").join(" / ")).join("\n\n")}
function emtToText(data){const names={};for(let day=0;day<31;day++){const rows=Array.isArray(data[day])?data[day]:[];["D","E","N"].forEach((code,i)=>{const cell=rows[i];const name=Array.isArray(cell)?String(cell[0]??"").trim():String(cell??"").trim();if(name){if(!names[name])names[name]=Array(31).fill("");names[name][day]=code}})}return Object.entries(names).map(([name,codes])=>name+"\n"+codes.map(c=>c||"공란").join(" / ")).join("\n\n")}
function doctorsToText(data){const order=[["specialist","전문의",["D","E","N"]],["resident","전공의",["D","M","N"]],["intern","인턴",["D","N"]]],blocks=[];for(const [key,label,codesForRole] of order){const rows=Array.isArray(data[key])?data[key]:[],names={};for(let day=0;day<31;day++){const a=Array.isArray(rows[day])?rows[day]:[];codesForRole.forEach((code,i)=>{const name=String(a[i]??"").trim();if(name){if(!names[name])names[name]=Array(31).fill("");names[name][day]=code}})}if(Object.keys(names).length)blocks.push("["+label+"]\n\n"+Object.entries(names).map(([name,codes])=>name+"\n"+codes.map(c=>c||"공란").join(" / ")).join("\n\n"))}return blocks.join("\n\n")}
function parseDoctorsText(text){const lines=text.split(/\r?\n/),byRole={specialist:[],resident:[],intern:[]},map={"전문의":"specialist","전공의":"resident","인턴":"intern","specialist":"specialist","resident":"resident","intern":"intern"};let role=null;for(let i=0;i<lines.length;){const raw=lines[i].trim();if(!raw){i++;continue}const h=raw.match(/^\[?([^\]]+)\]?$/);if(h&&map[h[1].trim()]){role=map[h[1].trim()];i++;continue}if(!role)throw new Error("의사는 [전문의] / [전공의] / [인턴] 구역을 먼저 적어주세요.");const name=raw.replace(/^[-•·]\s*/,"").trim(),next=(lines[i+1]||"").trim();if(!next)throw new Error(name+"의 근무 코드가 없습니다.");const codes=cleanCodes(splitCodes(next));if(codes.length!==31)throw new Error(name+" : "+codes.length+"개 입력됨 → 31개 필요");byRole[role].push({name,codes});i+=2}for(const k of Object.keys(byRole)){const seen=new Set();byRole[k].forEach(p=>{if(seen.has(p.name))throw new Error("이름 중복: "+p.name+" ("+k+")");seen.add(p.name)})}return byRole}
function peopleToEmployeeData(people,role){return people.map(p=>[role,p.name,p.codes])}
function buildDoctorsData(groups){const out={specialist:Array.from({length:31},()=>["","",""]),resident:Array.from({length:31},()=>["","",""]),intern:Array.from({length:31},()=>["",""])};for(const key of Object.keys(groups))for(const p of groups[key])for(let d=0;d<31;d++){const c=p.codes[d];if(key==="specialist"){if(c==="D")out.specialist[d][0]=p.name;else if(c==="E")out.specialist[d][1]=p.name;else if(c==="N")out.specialist[d][2]=p.name}else if(key==="resident"){if(c==="D")out.resident[d][0]=p.name;else if(c==="M")out.resident[d][1]=p.name;else if(c==="N")out.resident[d][2]=p.name}else if(key==="intern"){if(c==="D")out.intern[d][0]=p.name;else if(c==="N")out.intern[d][1]=p.name}}return out}
function validate(v,section){if(v===null||v===undefined)throw new Error("데이터가 비어 있습니다.");if(section==="nurses"||section==="assistants"){if(!Array.isArray(v))throw new Error("직원 데이터는 배열이어야 합니다.");const role=section==="nurses"?"n":"a";for(const x of v)if(!Array.isArray(x)||x.length!==3||x[0]!==role||typeof x[1]!=="string"||!Array.isArray(x[2])||x[2].length!==31)throw new Error("직원 데이터 형식 또는 근무일수가 잘못되었습니다.")}else if(section==="doctors"){if(typeof v!=="object"||Array.isArray(v))throw new Error("의사 데이터는 객체여야 합니다.")}else if(section==="pa"||section==="emt"){if(!Array.isArray(v))throw new Error(section+" 데이터는 배열이어야 합니다.")}}
function displayFor(section,data){if(section==="nurses"||section==="assistants")return nursesToText(data);if(section==="pa")return paToText(data);if(section==="emt")return emtToText(data);if(section==="doctors")return doctorsToText(data);return pretty(data)}
function parseEasy(section,text){if(section==="nurses")return peopleToEmployeeData(parsePeopleText(text,section),"n");if(section==="assistants")return peopleToEmployeeData(parsePeopleText(text,section),"a");if(section==="pa")return parsePeopleText(text,section).map(x=>[x.name,x.codes]);if(section==="emt"){const p=parsePeopleText(text,section),out=Array.from({length:31},()=>[[],[],[]]);for(const x of p)x.codes.forEach((c,d)=>{if(/^D[1-4]?$/i.test(c))out[d][0]=[x.name];if(/^(?:E|eE)[1-4]?$/i.test(c))out[d][1]=[x.name];if(/^N[1-4]?$/i.test(c))out[d][2]=[x.name]});return out}if(section==="doctors")return buildDoctorsData(parseDoctorsText(text))}
function checkData(){if(!loaded)return null;try{const v=parseEasy(loaded.section,$("editor").value);validate(v,loaded.section);const people=loaded.section==="doctors"?Object.values(parseDoctorsText($("editor").value)).flat():parsePeopleText($("editor").value,loaded.section);$("count").textContent="✅ "+people.length+"명 · 각 31일 확인 · 입력된 근무 "+people.reduce((n,p)=>n+p.codes.filter(Boolean).length,0)+"개";$("preview").classList.remove("hidden");$("preview").textContent=pretty(v);setStatus('<span class="ok">✅ 입력 검사 통과. 저장하면 기존 JSON 형식으로 자동 변환됩니다.</span>');return v}catch(e){$("preview").classList.add("hidden");setStatus('<span class="bad">❌ '+String(e.message).replace(/\n/g,"<br>")+"</span>");return null}}
async function loadData(){if(!(await admin())){setStatus('<span class="bad">관리자 로그인이 필요합니다.</span>');return}const month=$("month").value.trim(),section=$("section").value;if(!/^\d{4}-\d{2}$/.test(month)){setStatus('<span class="bad">월 형식: 2026-10</span>');return}setStatus("불러오는 중...");try{const r=await fetch(API+"/api/duty/"+month+"/"+section,{cache:"no-store"});if(!r.ok)throw new Error("데이터 없음 또는 불러오기 실패 ("+r.status+")");const data=await r.json();validate(data,section);loaded={month,section};$("editor").value=displayFor(section,data);$("editor").disabled=false;$("check").disabled=false;$("save").disabled=false;$("preview").classList.add("hidden");$("count").textContent="";updateHelp(section);setStatus('<span class="ok">✅ '+month+" / "+section+" 불러옴</span>")}catch(e){loaded=null;$("editor").disabled=true;$("check").disabled=true;$("save").disabled=true;setStatus('<span class="bad">❌ '+e.message+"</span>")}}
function updateHelp(section){const h={nurses:["간호사","이름 아래에 31일 근무코드를 순서대로 적습니다.","예: 홍길동\nD / D / E / 공란 / N / ..."],assistants:["보조원","이름 아래에 31일 근무코드를 순서대로 적습니다.","예: 김OO\nD / 공란 / E / N / ..."],pa:["PA","이름 아래에 31일 근무코드를 순서대로 적습니다.","예: 박OO\nD / D / E / 공란 / N / ..."],emt:["응급구조사","이름 아래에 31일 근무코드를 순서대로 적습니다.","D / E / N은 근무, 공란 / Hx / 연 / 차 / X / OFF는 휴무로 처리합니다."],doctors:["의사","전문의·전공의·인턴을 구역별로 나눠 적습니다.","[전문의]\n홍길동\nD / E / N / 공란 / ...\n\n[전공의]\n김OO\nD / M / N / ...\n\n[인턴]\n이OO\nD / N / ..."]}[section];$("help").innerHTML="<b>"+h[0]+"는 JSON을 직접 수정하지 않아도 됩니다.</b><br>"+h[1]+"<br>"+h[2].replace(/\n/g,"<br>")}
$("save").onclick=async()=>{if(!loaded)return;const v=checkData();if(v===null)return;if(!confirm(loaded.month+" / "+loaded.section+" 근무표를 R2에 저장할까요?"))return;$("save").disabled=true;setStatus("저장 중...");try{const r=await fetch(API+"/api/duty/"+loaded.month+"/"+loaded.section,{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token()},body:JSON.stringify(v)});if(!r.ok)throw new Error("저장 실패 ("+r.status+")");const vr=await fetch(API+"/api/duty/"+loaded.month+"/"+loaded.section,{cache:"no-store"});if(!vr.ok)throw new Error("저장 후 확인 실패");const saved=await vr.json();if(JSON.stringify(saved)!==JSON.stringify(v))throw new Error("저장 후 데이터가 입력 내용과 다릅니다.");setStatus('<span class="ok">✅ R2 저장 및 다시 읽기 확인 완료</span>')}catch(e){setStatus('<span class="bad">❌ '+e.message+"</span>")}finally{$("save").disabled=false}};
$("load").onclick=loadData;$("check").onclick=checkData;$("back").onclick=()=>location.href="duty.html";$("section").onchange=()=>{loaded=null;$("editor").value="";$("editor").disabled=true;$("check").disabled=true;$("save").disabled=true;$("count").textContent="";$("preview").classList.add("hidden");updateHelp($("section").value)};updateHelp("emt");(async()=>{if(!(await admin()))setStatus('<span class="bad">관리자 로그인이 필요합니다.</span>');else setStatus("✅ 관리자 로그인 확인")})();</script></body></html>
