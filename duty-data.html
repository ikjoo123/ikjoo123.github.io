<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>근무 데이터 관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px 50px}h1{font-size:23px;margin:0 0 16px}.panel{background:#fff;border:1px solid #e4e7eb;border-radius:16px;padding:16px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.input,select,textarea{font:inherit;border:1px solid #d2d7de;border-radius:9px;background:#fff}.input,select{padding:9px}.btn{border:1px solid #d2d7de;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.primary{font-weight:700}textarea{width:100%;height:65vh;min-height:400px;margin-top:12px;padding:14px;font-size:14px;line-height:1.65;tab-size:2}.status{margin-top:12px;padding:11px;border-radius:9px;background:#f7f7f8;line-height:1.6}.ok{color:#26743a}.bad{color:#a33}.help{font-size:13px;color:#666;line-height:1.7}.hidden{display:none!important}.count{margin-top:8px;font-size:13px;color:#666}.preview{margin-top:12px;padding:12px;background:#f7f7f8;border-radius:10px;white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:260px;overflow:auto}.hint{margin-top:8px;padding:10px;background:#f9fafb;border-radius:9px;font-size:12px;color:#666;white-space:pre-wrap}.gridWrap{margin-top:12px;border:1px solid #d2d7de;border-radius:9px;overflow:hidden}.gridTools{padding:10px;background:#f7f8fa;border-bottom:1px solid #e5e7eb;font-size:12px;color:#666}.gridScroll{overflow:auto;max-height:65vh}.gridTable{border-collapse:collapse;min-width:100%;font-size:12px}.gridTable th,.gridTable td{border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;padding:0;min-width:66px;height:34px}.gridTable th{position:sticky;top:0;background:#f1f3f5;font-weight:700;z-index:1}.gridTable th:first-child,.gridTable td:first-child{position:sticky;left:0;background:#fff;z-index:2;min-width:125px}.gridTable th:first-child{z-index:3;background:#f1f3f5}.gridCell{display:block;width:100%;min-height:33px;padding:8px 6px;outline:none;white-space:nowrap}.gridCell:focus{box-shadow:inset 0 0 0 2px #4688e8;background:#f8fbff}.gridName{font-weight:600}.gridHint{margin-left:8px}.modeTools{display:flex;gap:8px;margin-top:12px}.modeTools .active{background:#e8f1ff;border-color:#4688e8;color:#245ca8;font-weight:700}</style></head><body><main class="wrap"><h1>🗂️ 근무 데이터 관리</h1><div class="panel"><div class="row"><input id="month" class="input" value="2026-10" placeholder="2026-10"><select id="section"><option value="nurses">간호사 · nurses.json</option><option value="assistants">보조원 · assistants.json</option><option value="doctors">의사 · doctors.json</option><option value="pa">PA · pa.json</option><option value="emt">응급구조사 · emt.json</option></select><button id="load" class="btn primary">📥 불러오기</button><button id="new" class="btn">🆕 새로 만들기</button><button id="check" class="btn" disabled>🔎 입력 검사</button><button id="save" class="btn primary" disabled>💾 R2 저장</button><button id="back" class="btn">← 근무로</button></div><div id="help" class="help" style="margin-top:12px"></div><div id="hint" class="hint"></div><div id="staffMode" class="modeTools hidden"><button id="gridModeBtn" class="btn active" type="button">표 입력</button><button id="textModeBtn" class="btn" type="button">프리텍스트 입력</button></div><textarea id="editor" spellcheck="false" disabled></textarea><div id="gridWrap" class="gridWrap hidden"><div class="gridTools"><button id="addGridRow" class="btn" type="button">＋ 사람 추가</button><span class="gridHint">엑셀에서 이름·근무코드 영역을 복사한 뒤 표의 시작 셀을 클릭하고 Ctrl+V 하세요. 빈 셀은 공란으로 저장됩니다.</span></div><div class="gridScroll"><table id="gridTable" class="gridTable"></table></div></div><div id="count" class="count"></div><div id="preview" class="preview hidden"></div><div id="status" class="status">관리자 확인 중...</div></div></main><script>
const API="https://ikjoo123-github-io.zjaghkf0000.workers.dev";const $=id=>document.getElementById(id);let loaded=null,staffInputMode="grid";function daysInMonth(month){const [y,m]=month.split("-").map(Number);return new Date(y,m,0).getDate()}
function token(){return localStorage.getItem("ju_files_token")||""}
async function admin(){try{const r=await fetch(API+"/api/me",{headers:{Authorization:"Bearer "+token()}});return r.ok&&(await r.json()).role==="admin"}catch(_){return false}}
function setStatus(html){$("status").innerHTML=html} function pretty(v){return JSON.stringify(v,null,2)}
function normalizeToken(x){const s=String(x??"").trim();if(!s)return "";const u=s.toUpperCase();if(["D","DAY"].includes(u)||/^SD$/i.test(s)||/^D[1-4]$/i.test(s))return"D";if(["E","EVE","EVENING"].includes(u)||/^EE[1-4]$/i.test(s)||/^E[1-4]$/i.test(s))return"E";if(["N","NIGHT"].includes(u)||/^N[1-4]$/i.test(s))return"N";if(/^M$/i.test(s))return"M";return""}
function splitCodes(s){return s.replace(/[,，、|]/g," ").split(/\s+|\/+/).map(x=>String(x).trim()).filter(Boolean)}
function cleanCodes(arr){return arr.map(normalizeToken)}
function cleanStaffCodes(arr){return arr.map(x=>{const s=String(x??"").trim();return !s||/^공란$/i.test(s)?"":s})}
function parsePeopleText(text,section,days=31){const lines=text.split(/\r?\n/),people=[],errors=[];let currentRole=null;const roleMap={간호사:"n",nurses:"n",보조원:"a",assistant:"a",assistants:"a",PA:"pa",pa:"pa",응급구조사:"emt",emt:"emt",전문의:"specialist",전공의:"resident",인턴:"intern"};for(let i=0;i<lines.length;){const rawLine=lines[i];const raw=rawLine.trim();if(!raw){i++;continue}const header=raw.match(/^\[?([^\] :]+)\]?$/);if(section==="doctors"&&header&&roleMap[header[1]]){currentRole=roleMap[header[1]];i++;continue}let name="",codeLine="";const tabParts=rawLine.split(/\t/);if(tabParts.length>=days+1){name=String(tabParts[0]??"").trim();codeLine=tabParts.slice(1,days+1).map(x=>{const v=String(x??"").trim();return v||"공란"}).join(" / ");i++}else{const inline=raw.match(/^(.+?)\s+(?:D|E|N|M|X|OFF|공란|Hx|연|차|휴무)(?:\s*[/,，、| ]\s*(?:D[1-4]?|E[1-4]?|N[1-4]?|M|eE[1-4]?|sD|X|OFF|공란|Hx|연|차|휴무))*$/i);if(inline){name=inline[1].trim();codeLine=raw.slice(inline[1].length).trim();i++}else{name=raw.replace(/^[-•·]\s*/,"").trim();const nextLine=(lines[i+1]||"").trim();if(nextLine){codeLine=nextLine;i+=2}else{errors.push(name+"의 근무 코드 줄을 찾지 못했습니다.");i++;continue}}}const codes=(section==="nurses"||section==="assistants")?cleanStaffCodes(splitCodes(codeLine)):cleanCodes(splitCodes(codeLine));if(!name)errors.push("이름이 비어 있습니다.");if(codes.length!==days)errors.push((currentRole?currentRole+" ":"")+name+" : "+codes.length+"개 입력됨 → "+days+"개 필요");people.push({role:currentRole,name,codes})}const seen=new Set();people.forEach(p=>{const key=(p.role||"")+"/"+p.name;if(seen.has(key))errors.push("이름 중복: "+key);seen.add(key)});if(errors.length)throw new Error(errors.join("\n"));return people}
function nursesToText(data){return data.map(x=>x[1]+"\n"+x[2].map(c=>c||"공란").join(" / ")).join("\n\n")}
function paToText(data){return data.map(x=>x[0]+"\n"+(x[1]||[]).map(c=>c||"공란").join(" / ")).join("\n\n")}
function emtToText(data){const names={};for(let day=0;day<data.length;day++){const rows=Array.isArray(data[day])?data[day]:[];["D","E","N"].forEach((code,i)=>{const cell=rows[i];const name=Array.isArray(cell)?String(cell[0]??"").trim():String(cell??"").trim();if(name){if(!names[name])names[name]=Array(data.length).fill("");names[name][day]=code}})}return Object.entries(names).map(([name,codes])=>name+"\n"+codes.map(c=>c||"공란").join(" / ")).join("\n\n")}
function doctorsToText(data){const days=Math.max(...Object.values(data).map(a=>Array.isArray(a)?a.length:0));const order=[["specialist","전문의",["D","E","N"]],["resident","전공의",["D","M","N"]],["intern","인턴",["D","N"]]],blocks=[];for(const [key,label,codesForRole] of order){const rows=Array.isArray(data[key])?data[key]:[],names={};for(let day=0;day<days;day++){const a=Array.isArray(rows[day])?rows[day]:[];codesForRole.forEach((code,i)=>{const name=String(a[i]??"").trim();if(name){if(!names[name])names[name]=Array(days).fill("");names[name][day]=code}})}if(Object.keys(names).length)blocks.push("["+label+"]\n\n"+Object.entries(names).map(([name,codes])=>name+"\n"+codes.map(c=>c||"공란").join(" / ")).join("\n\n"))}return blocks.join("\n\n")}
function parseDoctorsText(text,days=31){const lines=text.split(/\r?\n/),byRole={specialist:[],resident:[],intern:[]},map={"전문의":"specialist","전공의":"resident","인턴":"intern","specialist":"specialist","resident":"resident","intern":"intern"};let role=null;for(let i=0;i<lines.length;){const raw=lines[i].trim();if(!raw){i++;continue}const h=raw.match(/^\[?([^\]]+)\]?$/);if(h&&map[h[1].trim()]){role=map[h[1].trim()];i++;continue}if(!role)throw new Error("의사는 [전문의] / [전공의] / [인턴] 구역을 먼저 적어주세요.");const name=raw.replace(/^[-•·]\s*/,"").trim(),next=(lines[i+1]||"").trim();if(!next)throw new Error(name+"의 근무 코드가 없습니다.");const codes=cleanCodes(splitCodes(next));if(codes.length!==days)throw new Error(name+" : "+codes.length+"개 입력됨 → "+days+"개 필요");byRole[role].push({name,codes});i+=2}for(const k of Object.keys(byRole)){const seen=new Set();byRole[k].forEach(p=>{if(seen.has(p.name))throw new Error("이름 중복: "+p.name+" ("+k+")");seen.add(p.name)})}return byRole}
function peopleToEmployeeData(people,role){return people.map(p=>[role,p.name,p.codes])}
function buildDoctorsData(groups,days=31){const out={specialist:Array.from({length:days},()=>["","",""]),resident:Array.from({length:days},()=>["","",""]),intern:Array.from({length:days},()=>["",""])};for(const key of Object.keys(groups))for(const p of groups[key])for(let d=0;d<days;d++){const c=p.codes[d];if(key==="specialist"){if(c==="D")out.specialist[d][0]=p.name;else if(c==="E")out.specialist[d][1]=p.name;else if(c==="N")out.specialist[d][2]=p.name}else if(key==="resident"){if(c==="D")out.resident[d][0]=p.name;else if(c==="M")out.resident[d][1]=p.name;else if(c==="N")out.resident[d][2]=p.name}else if(key==="intern"){if(c==="D")out.intern[d][0]=p.name;else if(c==="N")out.intern[d][1]=p.name}}return out}
function validate(v,section,days=31){if(v===null||v===undefined)throw new Error("데이터가 비어 있습니다.");if(section==="nurses"||section==="assistants"){if(!Array.isArray(v))throw new Error("직원 데이터는 배열이어야 합니다.");const role=section==="nurses"?"n":"a";for(const x of v)if(!Array.isArray(x)||x.length!==3||x[0]!==role||typeof x[1]!=="string"||!Array.isArray(x[2])||x[2].length!==days)throw new Error("직원 데이터 형식 또는 근무일수가 잘못되었습니다.")}else if(section==="doctors"){if(typeof v!=="object"||Array.isArray(v))throw new Error("의사 데이터는 객체여야 합니다.")}else if(section==="pa"||section==="emt"){if(!Array.isArray(v))throw new Error(section+" 데이터는 배열이어야 합니다.")}}
function displayFor(section,data){if(section==="nurses"||section==="assistants")return nursesToText(data);if(section==="pa")return paToText(data);if(section==="emt")return emtToText(data);if(section==="doctors")return doctorsToText(data);return pretty(data)}
function parseEasy(section,text,days=31){if(section==="nurses")return peopleToEmployeeData(parsePeopleText(text,section,days),"n");if(section==="assistants")return peopleToEmployeeData(parsePeopleText(text,section,days),"a");if(section==="pa")return parsePeopleText(text,section,days).map(x=>[x.name,x.codes]);if(section==="emt"){const p=parsePeopleText(text,section,days),out=Array.from({length:days},()=>[[],[],[]]);for(const x of p)x.codes.forEach((c,d)=>{if(/^D[1-4]?$/i.test(c))out[d][0].push(x.name);if(/^(?:E|eE)[1-4]?$/i.test(c))out[d][1].push(x.name);if(/^N[1-4]?$/i.test(c))out[d][2].push(x.name)});return out}if(section==="doctors")return buildDoctorsData(parseDoctorsText(text,days),days)}
function setStaffMode(mode){if(!loaded||!isStaffSection(loaded.section))return;if(mode==="text"&&staffInputMode!=="text"){const v=readStaffGrid(loaded.section,loaded.days);$("editor").value=nursesToText(v)}else if(mode==="grid"&&staffInputMode!=="grid"){const v=parseEasy(loaded.section,$("editor").value,loaded.days);validate(v,loaded.section,loaded.days);renderStaffGrid(v,loaded.section,loaded.days)}staffInputMode=mode;$("staffMode").classList.remove("hidden");$("gridModeBtn").classList.toggle("active",mode==="grid");$("textModeBtn").classList.toggle("active",mode==="text");$("gridWrap").classList.toggle("hidden",mode!=="grid");$("editor").classList.toggle("hidden",mode!=="text")}
function isStaffSection(section){return section==="nurses"||section==="assistants"}
function addGridRow(values,days){const tr=document.createElement("tr"),role=loaded.section==="nurses"?"n":"a";for(let col=0;col<=days;col++){const td=document.createElement("td"),cell=document.createElement("div");cell.className="gridCell"+(col===0?" gridName":"");cell.contentEditable="true";cell.dataset.row=String($('gridTable').tBodies[0]?.rows.length||0);cell.dataset.col=String(col);cell.textContent=String(values?.[col]??"");td.appendChild(cell);tr.appendChild(td)}$('gridTable').tBodies[0].appendChild(tr)}
function renderStaffGrid(data,section,days){$('editor').classList.add("hidden");$('gridWrap').classList.remove("hidden");const table=$('gridTable');table.innerHTML="";const thead=document.createElement("thead"),hr=document.createElement("tr"),nameTh=document.createElement("th");nameTh.textContent="이름";hr.appendChild(nameTh);for(let d=1;d<=days;d++){const th=document.createElement("th");th.textContent=d+"일";hr.appendChild(th)}thead.appendChild(hr);table.appendChild(thead);table.appendChild(document.createElement("tbody"));const rows=Array.isArray(data)&&data.length?data:[];rows.forEach(row=>addGridRow([row[1]||"",...(Array.isArray(row[2])?row[2]:[])],days));if(!rows.length)addGridRow([],days);$('addGridRow').onclick=()=>{addGridRow([],days);const last=table.tBodies[0].lastElementChild?.querySelector(".gridCell");last?.focus()}}
function readStaffGrid(section,days){const role=section==="nurses"?"n":"a",rows=[];for(const tr of $('gridTable').tBodies[0].rows){const cells=[...tr.querySelectorAll(".gridCell")].map(c=>{const v=c.textContent.trim();return /^공란$/i.test(v)?"":v}),name=cells[0]||"",codes=cells.slice(1,days+1);if(!name&&!codes.some(Boolean))continue;if(!name)throw new Error("이름이 비어 있는 행이 있습니다.");if(codes.length!==days)throw new Error(name+" : "+codes.length+"개 입력됨 → "+days+"개 필요");rows.push([role,name,codes])}return rows}
$('gridTable').addEventListener("paste",e=>{const cell=e.target.closest(".gridCell");if(!cell||!isStaffSection(loaded?.section))return;const text=e.clipboardData?.getData("text/plain");if(!text)return;e.preventDefault();const matrix=text.replace(/\r/g,"").split("\n");if(matrix[matrix.length-1]==="")matrix.pop();const header=matrix[0]?.split("\t").map(x=>x.trim());if(header?.length>=2&&/^(이름|성명|name)$/i.test(header[0])&&/^(1|1일)$/i.test(header[1]))matrix.shift();const startRow=Number(cell.dataset.row),startCol=Number(cell.dataset.col),days=loaded.days,tbody=$('gridTable').tBodies[0];while(tbody.rows.length<startRow+matrix.length)addGridRow([],days);matrix.forEach((line,r)=>{line.split("\t").forEach((value,c)=>{if(startCol+c<=days){const target=tbody.rows[startRow+r].querySelectorAll(".gridCell")[startCol+c];if(target)target.textContent=value.trim()}})});});
function checkData(){if(!loaded)return null;try{const v=isStaffSection(loaded.section)?(staffInputMode==="grid"?readStaffGrid(loaded.section,loaded.days):parseEasy(loaded.section,$("editor").value,loaded.days)):parseEasy(loaded.section,$("editor").value,loaded.days);validate(v,loaded.section,loaded.days);const people=isStaffSection(loaded.section)?v.map(x=>({name:x[1],codes:x[2]})):loaded.section==="doctors"?Object.values(parseDoctorsText($("editor").value,loaded.days)).flat():parsePeopleText($("editor").value,loaded.section,loaded.days);$("count").textContent="✅ "+people.length+"명 · 각 "+loaded.days+"일 확인 · 입력된 근무 "+people.reduce((n,p)=>n+p.codes.filter(Boolean).length,0)+"개";$("preview").classList.remove("hidden");$("preview").textContent=pretty(v);setStatus('<span class="ok">✅ 입력 검사 통과. 저장하면 원본 코드 그대로 변환됩니다.</span>');return v}catch(e){$("preview").classList.add("hidden");setStatus('<span class="bad">❌ '+String(e.message).replace(/\n/g,"<br>")+"</span>");return null}}
async function loadData(){if(!(await admin())){setStatus('<span class="bad">관리자 로그인이 필요합니다.</span>');return}const month=$("month").value.trim(),section=$("section").value,days=daysInMonth(month);if(!/^\d{4}-\d{2}$/.test(month)){setStatus('<span class="bad">월 형식: 2026-10</span>');return}setStatus("불러오는 중...");try{const r=await fetch(API+"/api/duty/"+month+"/"+section,{cache:"no-store"});if(!r.ok)throw new Error("데이터 없음 또는 불러오기 실패 ("+r.status+")");const data=await r.json();validate(data,section,days);loaded={month,section,days};if(isStaffSection(section)){staffInputMode="grid";renderStaffGrid(data,section,days);$("staffMode").classList.remove("hidden");$("gridModeBtn").classList.add("active");$("textModeBtn").classList.remove("active")}else{$("staffMode").classList.add("hidden");$("gridWrap").classList.add("hidden");$("editor").classList.remove("hidden");$("editor").value=displayFor(section,data)}$("editor").disabled=false;$("check").disabled=false;$("save").disabled=false;$("preview").classList.add("hidden");$("count").textContent="";updateHelp(section);setStatus(`<span class="ok">✅ ${month} / ${section} 불러옴</span>`)} catch(e){loaded=null;$("editor").disabled=true;$("check").disabled=true;$("save").disabled=true;setStatus(`<span class="bad">❌ ${e.message}</span>`)}}
function updateHelp(section){const h={nurses:["간호사","이름 아래에 31일 근무코드를 적습니다. D1, D2, E1, N3, sD, eE1 등 원본 코드를 그대로 보존합니다.","엑셀에서 한 행 전체를 복사해 그대로 붙여넣으세요:\n홍길동\tD1\tD2\tE1\t공란\tN3\t... (31일)"],assistants:["보조원","이름 아래에 31일 근무코드를 적습니다. 원본 특수 코드와 숫자를 그대로 보존합니다.","엑셀에서 한 행 전체를 복사해 그대로 붙여넣으세요:\n임대홍\tX\tD\tsD\teE1\t공란\t... (31일)"],pa:["PA","이름 아래에 31일 근무코드를 순서대로 적습니다.","예: 박OO\nD / D / E / 공란 / N / ..."],emt:["응급구조사","이름 아래에 31일 근무코드를 순서대로 적습니다.","D / E / N은 근무, 공란 / Hx / 연 / 차 / X / OFF는 휴무로 처리합니다."],doctors:["의사","전문의·전공의·인턴을 구역별로 나눠 적습니다.","[전문의]\n홍길동\nD / E / N / 공란 / ...\n\n[전공의]\n김OO\nD / M / N / ...\n\n[인턴]\n이OO\nD / N / ..."]}[section];$("help").innerHTML="<b>"+h[0]+"는 JSON을 직접 수정하지 않아도 됩니다.</b><br>"+h[1]+"<br>"+h[2].replace(/\n/g,"<br>")}
$("save").onclick=async()=>{if(!loaded)return;const v=checkData();if(v===null)return;if(!confirm(loaded.month+" / "+loaded.section+" 근무표를 R2에 저장할까요?"))return;$("save").disabled=true;setStatus("저장 중...");try{const r=await fetch(API+"/api/duty/"+loaded.month+"/"+loaded.section,{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token()},body:JSON.stringify(v)});if(!r.ok)throw new Error("저장 실패 ("+r.status+")");const vr=await fetch(API+"/api/duty/"+loaded.month+"/"+loaded.section,{cache:"no-store"});if(!vr.ok)throw new Error("저장 후 확인 실패");const saved=await vr.json();if(JSON.stringify(saved)!==JSON.stringify(v))throw new Error("저장 후 데이터가 입력 내용과 다릅니다.");setStatus('<span class="ok">✅ R2 저장 및 다시 읽기 확인 완료</span>')}catch(e){setStatus(`<span class="bad">❌ ${e.message}</span>`)}finally{$("save").disabled=false}};
$("new").onclick=()=>{const month=$("month").value.trim();if(!/^\d{4}-\d{2}$/.test(month)){setStatus('<span class="bad">월 형식: 2026-11</span>');return}const section=$("section").value,days=daysInMonth(month);loaded={month,section,days,isNew:true};if(isStaffSection(section)){staffInputMode="grid";renderStaffGrid([],section,days);$("staffMode").classList.remove("hidden");$("gridModeBtn").classList.add("active");$("textModeBtn").classList.remove("active")}else{$("staffMode").classList.add("hidden");$("gridWrap").classList.add("hidden");$("editor").classList.remove("hidden");$("editor").value=""}$("editor").disabled=false;$("check").disabled=false;$("save").disabled=false;$("preview").classList.add("hidden");$("count").textContent="새 근무표 · "+days+"일 입력";updateHelp(section);setStatus(`<span class="ok">🆕 ${month} / ${section} 새 근무표를 만들었습니다. 아래에 입력하세요.</span>`)};$("load").onclick=loadData;$("check").onclick=checkData;$("back").onclick=()=>location.href="duty.html";$("section").onchange=()=>{loaded=null;staffInputMode="grid";$("editor").value="";$("editor").disabled=true;$("staffMode").classList.add("hidden");$("editor").classList.remove("hidden");$("gridWrap").classList.add("hidden");$("check").disabled=true;$("save").disabled=true;$("count").textContent="";$("preview").classList.add("hidden");updateHelp($("section").value)};$("gridModeBtn").onclick=()=>{try{setStaffMode("grid")}catch(e){setStatus("❌ "+e.message)}};$("textModeBtn").onclick=()=>{try{setStaffMode("text")}catch(e){setStatus("❌ "+e.message)}};updateHelp("emt");(async()=>{if(!(await admin()))setStatus('<span class="bad">관리자 로그인이 필요합니다.</span>');else setStatus("✅ 관리자 로그인 확인")})();</script></body></html>
