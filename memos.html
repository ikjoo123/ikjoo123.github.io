<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메모 · 익주</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{height:64px;background:#fff;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;padding:0 24px;gap:18px;position:sticky;top:0;z-index:10}
.logo{font-size:21px;font-weight:700;cursor:pointer}
.headerTitle{font-weight:700;color:#555}
.back{border:0;background:transparent;color:#777}
main{max-width:1050px;margin:0 auto;padding:28px 20px 50px}
.composer{background:#fff;border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.07);padding:16px;margin:0 auto 24px;max-width:720px}
.composer input,.composer textarea{width:100%;border:0;outline:0;background:transparent}
.composer input{font-size:17px;font-weight:700;padding:4px 2px 10px}
.composer textarea{min-height:130px;resize:vertical;line-height:1.55;padding:4px 2px}
.composerBottom{display:flex;align-items:center;border-top:1px solid #f0f0f0;padding-top:10px}
.colors{display:flex;gap:7px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent}
.dot.selected{border-color:#333}
.yellow{background:#fff8b5}.green{background:#d8f5d0}.blue{background:#d5e9ff}.purple{background:#eadcff}.pink{background:#ffdce8}.gray{background:#e6e6e6}
.actions{margin-left:auto;display:flex;gap:7px}
.actions button{border:0;background:transparent;padding:7px 10px;border-radius:7px}
.actions .save{background:#333;color:#fff}
.toolbar{display:flex;gap:8px;align-items:center;margin:0 auto 16px;max-width:1050px}
.search{flex:1;max-width:400px;border:1px solid #ddd;border-radius:9px;padding:10px 12px;background:#fff;outline:0}
.count{color:#888;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{min-height:150px;border-radius:13px;padding:16px;position:relative;cursor:pointer;word-break:break-word}
.card:hover{box-shadow:0 5px 18px rgba(0,0,0,.08);transform:translateY(-1px)}
.cardTitle{font-weight:700;margin-bottom:9px;padding-right:25px}
.cardText{white-space:pre-wrap;color:#444;line-height:1.5}
.cardDate{font-size:11px;color:#777;margin-top:14px}
.menu{position:absolute;right:8px;top:8px}
.menuBtn{border:0;background:transparent;font-size:20px;padding:3px 7px}
.menuBox{position:absolute;right:0;top:30px;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 5px 18px rgba(0,0,0,.12);min-width:80px;z-index:5;overflow:hidden}
.menuBox button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:9px 12px;font-size:13px}
.empty{text-align:center;color:#999;padding:60px 10px}
@media(max-width:650px){header{padding:0 12px}.headerTitle{display:none}main{padding:18px 12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="location.href='index.html'">익주</div>
  <div class="headerTitle">📝 메모</div>
  <button class="back" onclick="location.href='index.html'">← 홈</button>
</header>
<main>
  <div class="composer" id="composer">
    <input id="title" placeholder="제목">
    <textarea id="text" placeholder="메모 작성..."></textarea>
    <div class="composerBottom">
      <div class="colors">
        <button class="dot yellow selected" data-color="yellow" aria-label="노랑"></button>
        <button class="dot green" data-color="green" aria-label="초록"></button>
        <button class="dot blue" data-color="blue" aria-label="파랑"></button>
        <button class="dot purple" data-color="purple" aria-label="보라"></button>
        <button class="dot pink" data-color="pink" aria-label="분홍"></button>
        <button class="dot gray" data-color="gray" aria-label="회색"></button>
      </div>
      <div class="actions">
        <button id="cancel">취소</button>
        <button id="save" class="save">저장</button>
      </div>
    </div>
  </div>
  <div class="toolbar">
    <input id="search" class="search" placeholder="메모 검색...">
    <div id="count" class="count"></div>
  </div>
  <div id="grid" class="grid"></div>
</main>
<script>
const TOKEN_KEY="ju_files_token";
if(!localStorage.getItem(TOKEN_KEY)){location.replace("index.html");}
const KEY="ikjoo_memos_test_v1";
let notes=[];
let editingId=null;
let color="yellow";

function load(){
  try{notes=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){notes=[]}
  render();
}
function persist(){localStorage.setItem(KEY,JSON.stringify(notes))}
function escapeDate(ts){
  return new Date(ts).toLocaleString("ko-KR",{year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
}
function reset(){
  editingId=null;
  title.value="";
  text.value="";
  color="yellow";
  document.querySelectorAll(".dot").forEach(x=>x.classList.toggle("selected",x.dataset.color==="yellow"));
}
function render(){
  const q=search.value.trim().toLowerCase();
  const filtered=notes.filter(n=>(n.title+" "+n.text).toLowerCase().includes(q));
  count.textContent=filtered.length+"개";
  grid.innerHTML="";
  if(!filtered.length){grid.innerHTML='<div class="empty">아직 메모가 없습니다.<br>위에서 첫 메모를 작성해보세요.</div>';return}
  filtered.sort((a,b)=>b.updated-a.updated).forEach(n=>{
    const card=document.createElement("div");
    card.className="card "+(n.color||"yellow");
    const t=document.createElement("div");t.className="cardTitle";t.textContent=n.title||"제목 없음";
    const tx=document.createElement("div");tx.className="cardText";tx.textContent=n.text||"";
    const d=document.createElement("div");d.className="cardDate";d.textContent=escapeDate(n.updated);
    const menu=document.createElement("div");menu.className="menu";
    const mb=document.createElement("button");mb.className="menuBtn";mb.textContent="⋮";
    const box=document.createElement("div");box.className="menuBox hidden";
    const edit=document.createElement("button");edit.textContent="수정";
    const del=document.createElement("button");del.textContent="삭제";
    edit.onclick=e=>{e.stopPropagation();box.classList.add("hidden");editNote(n)};
    del.onclick=e=>{e.stopPropagation();box.classList.add("hidden");if(confirm("이 메모를 삭제하시겠습니까?")){notes=notes.filter(x=>x.id!==n.id);persist();render()}};
    mb.onclick=e=>{e.stopPropagation();box.classList.toggle("hidden")};
    box.append(edit,del);menu.append(mb,box);
    card.append(t,tx,d,menu);
    card.onclick=()=>editNote(n);
    grid.append(card);
  });
}
function editNote(n){
  editingId=n.id;title.value=n.title||"";text.value=n.text||"";color=n.color||"yellow";
  document.querySelectorAll(".dot").forEach(x=>x.classList.toggle("selected",x.dataset.color===color));
  title.focus();
}
save.onclick=()=>{
  const t=title.value.trim(),x=text.value.trim();
  if(!t&&!x)return;
  const now=Date.now();
  if(editingId){
    const n=notes.find(x=>x.id===editingId);
    if(n)Object.assign(n,{title:t,text:x,color,updated:now});
  }else{
    notes.push({id:crypto.randomUUID(),title:t,text:x,color,created:now,updated:now});
  }
  persist();reset();render();
};
cancel.onclick=reset;
search.oninput=render;
document.querySelectorAll(".dot").forEach(dot=>dot.onclick=()=>{
  color=dot.dataset.color;
  document.querySelectorAll(".dot").forEach(x=>x.classList.toggle("selected",x===dot));
});
text.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")save.click()});
load();
</script>
</body>
</html>
