<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>익주 · 근무</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8f1,#eef7ff 55%,#f7efff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}.container{max-width:1000px;margin:auto;padding:24px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:25px;margin:0}.back{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 13px;text-decoration:none;color:#333}.datebar{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.date{text-align:center}.date strong{display:block;font-size:20px}.date span{font-size:13px;color:#777}.nav{border:1px solid #ddd;background:#fff;border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer}.sectionTitle{margin:22px 0 10px;font-size:18px}.viewPanel.hidden{display:none!important}.doctors{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.doctorCard{background:rgba(255,255,255,.94);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.07)}.doctorHead{padding:16px 15px;font-weight:800;font-size:18px}.doctorCard:nth-child(1) .doctorHead{background:#ffe7ed;color:#a33b55}.doctorCard:nth-child(2) .doctorHead{background:#e8f5e9;color:#32733a}.doctorCard:nth-child(3) .doctorHead{background:#fff4d6;color:#8a6500}.doctorCard:nth-child(4) .doctorHead{background:#eeeeee;color:#666}.doctorBody{padding:12px 15px}.doctorLine{padding:10px 0;border-bottom:1px solid #eee}.doctorLine:last-child{border-bottom:0}.doctorLabel{font-size:12px;color:#777;font-weight:700}.doctorNames{margin-top:3px;font-weight:650}.time{font-size:11px;color:#888;margin-left:4px}.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.shift{background:rgba(255,255,255,.92);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.07)}.shift:nth-child(1) .shiftHead{background:#fff0d8;color:#b45b00}.shift:nth-child(2) .shiftHead{background:#e9e4ff;color:#5b45a8}.shift:nth-child(3) .shiftHead{background:#dff4ff;color:#16718f}.shiftHead{padding:16px 15px;font-weight:800;font-size:18px}.shiftBody{padding:12px 15px}.group{margin-bottom:13px}.groupTitle{font-size:12px;color:#777;margin-bottom:6px;font-weight:700}.person{padding:9px 10px;background:#f7f7f8;border-radius:10px;margin-bottom:6px;font-weight:600;display:flex;justify-content:space-between;gap:8px}.code{font-size:12px;color:#777;font-weight:700}.empty{color:#aaa;text-align:center;padding:12px 0;font-size:13px}.notice{margin-top:14px;color:#777;font-size:12px;line-height:1.6}@media(max-width:700px){.shifts,.doctors{grid-template-columns:1fr}}</style></head><body><div class="container"><div class="top"><h1>🧑‍⚕️ 근무</h1><a class="back" href="index.html">← 익주 홈</a></div><div class="datebar"><button class="nav" onclick="moveDay(-1)">‹</button><div class="date"><strong id="dateTitle"></strong><span id="dateWeekday"></span></div><button class="nav" onclick="moveDay(1)">›</button></div><div id="staffView" class="viewPanel"><div id="shifts" class="shifts"></div></div><div id="doctorView" class="viewPanel"><h2 class="sectionTitle">🧑‍⚕️ 의사 근무</h2><div id="doctors" class="doctors"></div></div></div><script>
const API="https://ikjoo123-github-io.zjaghkf0000.workers.dev";const dutyCache={};let staff=[],doctorData={},schedules={};
async function loadMonth(month){
  if(!dutyCache[month]) dutyCache[month]=await fetch(API+"/api/duty/"+month).then(r=>{if(!r.ok)throw new Error("근무 데이터 로드 실패: "+month);return r.json()});
  const d=dutyCache[month]; staff=d.staff||[]; doctorData=d.doctorData||{}; schedules={};
  for(const [role,name,codes] of staff)for(let i=0;i<codes.length;i++){
    const code=String(codes[i]||"").trim();
    const m=code.match(/^([DEN])([1-4])?$/),ee=code.match(/^eE([1-4])?$/i);if(!m&&!ee)continue;
    const shift=ee?"EVE":{D:"DAY",E:"EVE",N:"NIGHT"}[m[1]],k=month+"-"+String(i+1).padStart(2,"0");
    schedules[k]??={DAY:{nurses:[],doctors:[],assistants:[]},EVE:{nurses:[],doctors:[],assistants:[]},NIGHT:{nurses:[],doctors:[],assistants:[]}};
    schedules[k][shift][role==="n"?"nurses":"assistants"].push({name,code,position:ee?(ee[1]||"eE"):(m[2]||"")})
  }
}
let currentDate=new Date();function localKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function fmt(d){return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일"}async function render(){const month=localKey(currentDate).slice(0,7);await loadMonth(month);const k=localKey(currentDate),data=schedules[k]||{DAY:{nurses:[],doctors:[],assistants:[]},EVE:{nurses:[],doctors:[],assistants:[]},NIGHT:{nurses:[],doctors:[],assistants:[]}};document.getElementById("dateTitle").textContent=fmt(currentDate);document.getElementById("dateWeekday").textContent=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"][currentDate.getDay()];document.getElementById("shifts").innerHTML=["DAY","EVE","NIGHT"].map(shift=>{const x=data[shift];const nurses=[...x.nurses].sort((a,b)=>(Number(a.position)||99)-(Number(b.position)||99));return '<div class="shift"><div class="shiftHead">'+shift+'</div><div class="shiftBody">'+group("간호사",nurses)+group("보조원",x.assistants)+'</div></div>'}).join("");renderDoctors(k)}function renderDoctors(k){const d=Number(k.slice(-2));const roles=[["전문의","specialist",[["D","07:00~15:00"],["E","15:00~22:00"],["N","22:00~익일 07:00"]]],["전공의","resident",[["D","07:00~19:00"],["M","13:00~22:00 / 10:00~19:00"],["N","19:00~익일 07:00"]]],["인턴","intern",[["D","07:00~19:00"],["N","19:00~익일 07:00"]]],["PA","pa",[["D","07:00~15:00"],["E","15:00~23:00"],["N","23:00~익일 07:00"]]]];document.getElementById("doctors").innerHTML=roles.map(r=>{const a=(doctorData[r[1]]||[])[d-1]||[];return '<div class="doctorCard"><div class="doctorHead">'+r[0]+'</div><div class="doctorBody">'+r[2].map((x,i)=>'<div class="doctorLine"><div class="doctorLabel">'+x[0]+' <span class="time">'+x[1]+'</span></div><div class="doctorNames">'+(a[i]?escapeHtml(a[i]):"데이터 없음")+'</div></div>').join("")+'</div></div>'}).join("")}
function group(title,arr){return '<div class="group"><div class="groupTitle">'+title+'</div>'+(arr.length?arr.map(n=>'<div class="person"><span>'+escapeHtml(n.name)+'</span><span class="code">'+escapeHtml(n.code)+(n.position?" · 포지션 "+n.position:"")+'</span></div>').join(""):'<div class="empty">근무자 없음</div>')+'</div>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function moveDay(n){currentDate.setDate(currentDate.getDate()+n);render();}render();
</script></body></html>
