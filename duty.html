<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>익주 · 근무</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8f1,#eef7ff 55%,#f7efff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}.container{max-width:900px;margin:auto;padding:24px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:25px;margin:0}.back{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 13px;text-decoration:none;color:#333}.datebar{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.date{text-align:center}.date strong{display:block;font-size:20px}.date span{font-size:13px;color:#777}.nav{border:1px solid #ddd;background:#fff;border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer}.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.shift{background:rgba(255,255,255,.92);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.07)}.shift:nth-child(1) .shiftHead{background:#fff0d8;color:#b45b00}.shift:nth-child(2) .shiftHead{background:#e9e4ff;color:#5b45a8}.shift:nth-child(3) .shiftHead{background:#dff4ff;color:#16718f}.shiftHead{padding:16px 15px;font-weight:800;font-size:18px}.shiftBody{padding:12px 15px}.group{margin-bottom:13px}.groupTitle{font-size:12px;color:#777;margin-bottom:6px;font-weight:700}.person{padding:9px 10px;background:#f7f7f8;border-radius:10px;margin-bottom:6px;font-weight:600;display:flex;justify-content:space-between;gap:8px}.code{font-size:12px;color:#777;font-weight:700}.empty{color:#aaa;text-align:center;padding:12px 0;font-size:13px}.notice{margin-top:14px;color:#777;font-size:12px;line-height:1.6}@media(max-width:700px){.shifts{grid-template-columns:1fr}}</style></head><body><div class="container"><div class="top"><h1>🩺 근무</h1><a class="back" href="index.html">← 익주 홈</a></div><div class="datebar"><button class="nav" onclick="moveDay(-1)">‹</button><div class="date"><strong id="dateTitle"></strong><span id="dateWeekday"></span></div><button class="nav" onclick="moveDay(1)">›</button></div><div id="shifts" class="shifts"></div><div class="notice">10월 근무표 원본 기준으로 반영했습니다. D1~D4=DAY 포지션, E1~E4=EVE 포지션, N1~N4=NIGHT 포지션입니다.</div></div><script>
const staff=[["n","전혜현",["X","H","X","Xa","X","D4","D3","E4","N1","X","X","D3","D2","D4","D1","ED","X","E1","E1","N4","N3","X","X","HX","X","E2","N3","N4","X","X","D4"]],["n","이보람",["D1","X","X","H","X","N4","N3","X","X","E2","E1","N4","N2","X","X","ED","E4","N3","N4","X","X","Xa","D3","D4","D1","D4","X","D1","D4","X","HX"]],["n","이주아",["E4","E2","E1","X","H","H","X","D1","D2","N4","N3","X","X","X","HX","X","D4","D1","OH","X","X","E2","E4","E2","N3","N4","X","X","X","N4","N3"]],["n","정다영",["N1","N4","X","X","D2","E4","E3","TR","X","X","D4","E1","X","E4","N3","N1","X","X","D4","D2","N4","N1","X","X","HX","H","X","X","E4","E3","E2"]],["n","한승훈",["X","D2","N4","X","X","H","D4","E3","E4","E1","X","E2","E4","N3","N1","X","X","D4","D3","E2","X","X","N4","N1","X","X","D4","E3","E2","H","X"]],["n","이지희",["N3","N1","X","X","H","X","X","X","HX","D3","D2","X","X","E3","E4","E2","E2","E4","X","D1","D2","D4","N3","N4","X","X","E4","E1","N3","N1","X"]],["n","이수진B",["X","D4","D1","E4","N2","N3","X","TR","X","E4","N1","N3","X","X","HX","X","D2","N4","N2","X","X","Xa","E1","E4","X","D3","D1","D4","D2","X","X"]],["n","조승철",["E1","X","D2","D4","E3","X","X","E1","E2","X","E4","E3","E1","X","D4","N4","N3","X","X","H","H","X","X","D2","E1","N2","N4","X","X","D4","N4"]],["n","양하영",["D4","D1","X","E2","E1","E2","N4","N1","X","X","HX","D4","D3","N1","N4","X","X","Xa","D2","E3","E4","E1","X","X","D4","D1","D2","X","X","X","X"]],["n","손준호",["X","E4","E3","N1","N4","X","X","D4","N3","N1","X","X","H","X","D2","D4","X","D3","E2","N2","N1","X","X","H","E4","E1","E2","X","X","E4","E1"]],["n","김지정",["X","HX","E4","N3","X","X","D1","D2","D4","X","E3","N1","N4","X","X","X","H","H","E2","E4","X","X","D4","D1","E2","N1","N2","X","X","E2","E4"]],["n","최준혁",["X","H","D4","D1","D4","D2","E4","X","E1","N3","N4","X","X","X","X","D2","E3","X","D1","D4","E1","N4","X","X","D2","E4","E3","N1","N4","X","X"]],["n","국윤주",["E2","E3","X","E3","E2","E1","X","N3","N4","X","X","Xa","D4","D2","X","E4","N4","N1","X","X","X","E4","E2","N3","N4","X","X","HX","X","D1","D2"]],["n","김지연",["N4","X","X","HX","E4","N2","N1","X","X","D4","D3","X","N1","N4","X","X","X","D2","E4","X","D4","D1","D2","X","H","H","H","E4","E3","X","D1"]],["n","박종윤",["D3","E1","N3","X","X","OH","E1","E2","E3","X","D1","D2","E3","E1","X","D3","D1","E2","N1","N1","X","X","X","X","X","D2","E1","N3","N1","X","X"]],["n","서은채",["D2","N3","N1","X","X","D1","D2","D3","X","X","X","D1","E2","X","E1","N3","N1","X","X","H","D3","D2","D1","E3","N1","X","X","E2","E1","HX","X"]],["n","장하서",["X","X","X","D2","D1","D3","E2","X","D1","D2","X","X","X","HX","E2","E1","H","X","X","E1","E2","N3","N1","X","X","H","H","D2","D1","N3","N1"]],["n","최지훈",["E3","X","X","E1","N3","N1","X","X","H","D1","X","X","D1","E2","E3","E3","E1","X","X","D3","D1","D3","X","E1","E3","N3","N1","X","X","D2","D3"]],["n","정수경",["X","D3","D3","D3","D3","E3","X","X","D3","E3","X","N3","N3","X","X","D1","D3","E3","N3","N3","X","X","HX","D3","D3","E3","X","X","X","E1","E3"]],["n","송송지",["D","D","X","X","X","D","D","D","X","X","X","","","","","","","","","","","","","","","","","","","",""]],["a","임대홍",["X","X","D","D","N","N","X","X","sD","D","D","eE1","X","H","D","E","E","X","eE1","eE1","eE1","X","N","N","X","X","E","E","X","X","N"]],["a","한준영",["E","E","E","X","D","D","N","N","X","X","X","D","E","X","X","H","N","N","X","X","D","E","H","X","X","D","D","D","E","X","sD"]],["a","윤경진",["D","sD","X","H","X","E","E","E","N","N","X","X","eE1","E","E","X","X","H","X","E","N","N","X","X","D","eE1","eE1","X","X","D","D"]],["a","나태성",["N","N","X","X","sD","eE1","eE1","X","X","E","E","X","D","D","N","N","X","X","D","D","E","X","X","sD","N","N","X","X","D","E","E"]],["a","안준선",["X","X","sD","E","E","X","X","D","D","sD","N","N","X","X","X","D","D","D","N","N","X","X","D","D","E","E","X","eE1","N","N","X"]],["a","차건",["sD","D","N","N","X","X","D","eE1","E","X","eE1","E","N","N","X","X","sD","E","E","X","X","D","E","E","X","OH","N","N","X","X","X"]],["n","백미희",["","","","","","","","","","","","","","D3","D3","","","","","","E3","E3","E3","","","","D3","D3","D3","D3",""]]];const schedules={};for(const [role,name,codes] of staff)for(let i=0;i<31;i++){const code=String(codes[i]||"").trim(),m=code.match(/^([DEN])([1-4])?$/);if(!m)continue;const shift={D:"DAY",E:"EVE",N:"NIGHT"}[m[1]],k="2026-10-"+String(i+1).padStart(2,"0");schedules[k]??={DAY:{nurses:[],doctors:[],assistants:[]},EVE:{nurses:[],doctors:[],assistants:[]},NIGHT:{nurses:[],doctors:[],assistants:[]}};schedules[k][shift][role==="n"?"nurses":"assistants"].push({name,code,position:m[2]||""})}
let currentDate=new Date();function localKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function fmt(d){return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일"}function render(){const k=localKey(currentDate),data=schedules[k]||{DAY:{nurses:[],doctors:[],assistants:[]},EVE:{nurses:[],doctors:[],assistants:[]},NIGHT:{nurses:[],doctors:[],assistants:[]}};document.getElementById("dateTitle").textContent=fmt(currentDate);document.getElementById("dateWeekday").textContent=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"][currentDate.getDay()];document.getElementById("shifts").innerHTML=["DAY","EVE","NIGHT"].map(shift=>{const x=data[shift];return '<div class="shift"><div class="shiftHead">'+shift+'</div><div class="shiftBody">'+group("간호사",x.nurses)+group("의사",x.doctors)+group("보조원",x.assistants)+'</div></div>'}).join("")}function group(title,arr){return '<div class="group"><div class="groupTitle">'+title+'</div>'+(arr.length?arr.map(n=>'<div class="person"><span>'+escapeHtml(n.name)+'</span><span class="code">'+escapeHtml(n.code)+(n.position?" · 포지션 "+n.position:"")+'</span></div>').join(""):'<div class="empty">근무자 없음</div>')+'</div>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function moveDay(n){currentDate.setDate(currentDate.getDate()+n);render()}render();
</script></body></html>
