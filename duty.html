<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ER 근무</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8f1,#eef7ff 55%,#f7efff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}.container{max-width:1000px;margin:auto;padding:24px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:25px;margin:0}.back{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 13px;text-decoration:none;color:#333}.datebar{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.date{text-align:center}.date strong{display:block;font-size:20px}.date span{font-size:13px;color:#777}.nav{border:1px solid #ddd;background:#fff;border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer}.sectionTitle{margin:22px 0 10px;font-size:18px}.viewPanel.hidden{display:none!important}.doctors{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.doctorCard{background:rgba(255,255,255,.94);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.07)}.doctorHead{padding:16px 15px;font-weight:800;font-size:18px}.doctorCard:nth-child(1) .doctorHead{background:#ffe7ed;color:#a33b55}.doctorCard:nth-child(2) .doctorHead{background:#e8f5e9;color:#32733a}.doctorCard:nth-child(3) .doctorHead{background:#fff4d6;color:#8a6500}.doctorCard:nth-child(4) .doctorHead{background:#eeeeee;color:#666}.doctorBody{padding:12px 15px}.doctorLine{padding:10px 0;border-bottom:1px solid #eee}.doctorLine:last-child{border-bottom:0}.doctorLabel{font-size:12px;color:#777;font-weight:700}.doctorNames{margin-top:3px;font-weight:650}.time{font-size:11px;color:#888;margin-left:4px}.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.shift{background:rgba(255,255,255,.92);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.07)}.shift:nth-child(1) .shiftHead{background:#fff0d8;color:#b45b00}.shift:nth-child(2) .shiftHead{background:#e9e4ff;color:#5b45a8}.shift:nth-child(3) .shiftHead{background:#dff4ff;color:#16718f}.shiftHead{padding:16px 15px;font-weight:800;font-size:18px}.shiftBody{padding:12px 15px}.group{margin-bottom:13px}.groupTitle{font-size:12px;color:#777;margin-bottom:6px;font-weight:700}.person{padding:9px 10px;background:#f7f7f8;border-radius:10px;margin-bottom:6px;font-weight:600;display:flex;justify-content:space-between;gap:8px}.code{font-size:12px;color:#777;font-weight:700}.empty{color:#aaa;text-align:center;padding:12px 0;font-size:13px}.notice{margin-top:14px;color:#777;font-size:12px;line-height:1.6}@media(max-width:700px){.shifts,.doctors{grid-template-columns:1fr}}.hidden{display:none!important}.editInput{width:100%;padding:7px 8px;border:1px solid #ccc;border-radius:7px;font:inherit}.editRow{display:grid;grid-template-columns:1fr 90px;gap:6px;margin-bottom:6px}.dayAdd,.dayRemove{border:1px solid #ddd;background:#fff;border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer}.dayAdd{margin-left:5px}.dayRemove{width:100%;color:#a33;margin-top:2px}</style></head><body><div class="container"><div class="top"><h1>🧑‍⚕️ 근무</h1><div><button id="editDutyBtn" class="back hidden" type="button">✏️ 근무 수정</button> <button id="saveDutyBtn" class="back hidden" type="button">💾 저장</button> <a class="back" href="index.html">← 익주 홈</a></div></div><div class="datebar"><button class="nav" onclick="moveDay(-1)">‹</button><div class="date"><strong id="dateTitle"></strong><span id="dateWeekday"></span></div><button class="nav" onclick="moveDay(1)">›</button></div><div id="staffView" class="viewPanel"><div id="shifts" class="shifts"></div></div><div id="doctorView" class="viewPanel"><h2 class="sectionTitle">🏥 응급의료센터근무</h2><div id="doctors" class="doctors"></div></div></div><script>
const API="https://ikjoo-home.zjaghkf0000.workers.dev";const dutyCache={};let staff=[],doctorData={},schedules={},editing=false,isAdmin=false;
async function checkAdmin(){const token=localStorage.getItem("ju_files_token");if(!token)return false;try{const r=await fetch(API+"/api/me",{headers:{Authorization:"Bearer "+token}});if(!r.ok)return false;const d=await r.json();return d.role==="admin"}catch(e){return false}}

async function loadMonth(month){
  if(!dutyCache[month]) dutyCache[month]=await fetch(API+"/api/duty/"+month).then(r=>{if(!r.ok)throw new Error("근무 데이터 로드 실패: "+month);return r.json()});
  const d=dutyCache[month]; staff=d.staff||[]; doctorData=d.doctorData||{}; schedules={};
  for(const [role,name,codes] of staff)for(let i=0;i<codes.length;i++){
    const code=String(codes[i]||"").trim();
    const m=code.match(/^([DEN])([1-4])?$/),ee=code.match(/^eE([1-4])?$/i);if(!m&&!ee)continue;
    const shift=ee?"EVE":{D:"DAY",E:"EVE",N:"NIGHT"}[m[1]],k=month+"-"+String(i+1).padStart(2,"0");
    schedules[k]??={DAY:{nurses:[],doctors:[],assistants:[]},EVE:{nurses:[],doctors:[],assistants:[]},NIGHT:{nurses:[],doctors:[],assistants:[]}};
    schedules[k][shift][role==="n"?"nurses":"assistants"].push({name,code,position:ee?(ee[1]||"eE"):(m[2]||""),staffIndex:staff.findIndex(s=>s[1]===name&&s[0]===role)})
  }
}
let currentDate=new Date();function localKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function fmt(d){return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일"}async function render(){const month=localKey(currentDate).slice(0,7);await loadMonth(month);const k=localKey(currentDate),data=schedules[k]||{DAY:{nurses:[],doctors:[],assistants:[]},EVE:{nurses:[],doctors:[],assistants:[]},NIGHT:{nurses:[],doctors:[],assistants:[]}};document.getElementById("dateTitle").textContent=fmt(currentDate);document.getElementById("dateWeekday").textContent=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"][currentDate.getDay()];document.getElementById("shifts").innerHTML=["DAY","EVE","NIGHT"].map(shift=>{const x=data[shift];const nurses=[...x.nurses].sort((a,b)=>(Number(a.position)||99)-(Number(b.position)||99));return '<div class="shift"><div class="shiftHead">'+({DAY:"DAY ☀️",EVE:"EVE 🌥️",NIGHT:"NIGHT 🌙"}[shift])+'</div><div class="shiftBody">'+group("간호사",nurses,shift)+group("보조원",x.assistants,shift)+'</div></div>'}).join("");renderDoctors(k)}function renderDoctors(k){const d=Number(k.slice(-2));const roles=[["전문의","specialist",[["D","07:00~15:00"],["E","15:00~22:00"],["N","22:00~익일 07:00"]]],["전공의","resident",[["D","07:00~19:00"],["M","13:00~22:00 / 10:00~19:00"],["N","19:00~익일 07:00"]]],["인턴","intern",[["D","07:00~19:00"],["N","19:00~익일 07:00"]]],["PA","pa",[["D","07:00~15:00"],["E","15:00~23:00"],["N","23:00~익일 07:00"]]],["응급구조사","emt",[["D","07:00~15:00"],["E","15:00~22:00"],["N","22:00~익일 07:00"]]]];document.getElementById("doctors").innerHTML=roles.map(r=>{const hasData=Array.isArray(doctorData[r[1]]); const a=hasData?(doctorData[r[1]][d-1]||[]):[];return '<div class="doctorCard"><div class="doctorHead">'+r[0]+'</div><div class="doctorBody">'+r[2].map((x,i)=>'<div class="doctorLine"><div class="doctorLabel">'+x[0]+' <span class="time">'+x[1]+'</span></div><div class="doctorNames">'+(a[i]?(editing?'<input class="editInput doctorInput" data-role="'+r[1]+'" data-day="'+d+'" data-shift="'+i+'" value="'+escapeAttr(a[i])+'">' : escapeHtml(a[i])):(editing&&hasData?'<input class="editInput doctorInput" data-role="'+r[1]+'" data-day="'+d+'" data-shift="'+i+'" value="">' :(hasData?"근무자 없음":"데이터 없음")))+'</div></div>').join("")+'</div></div>'}).join("")}
function group(title,arr,shift){const role=title==="간호사"?"n":"a";return '<div class="group"><div class="groupTitle">'+title+(editing?' <button type="button" class="dayAdd" onclick="addDayPerson(\''+role+'\',\''+shift+'\')">➕ 사람 추가</button>':'')+'</div>'+(arr.length?arr.map(n=>editing?'<div class="person editPerson"><div class="editRow"><input class="editInput staffName" data-idx="'+n.staffIndex+'" value="'+escapeAttr(n.name)+'"><input class="editInput staffCode" data-idx="'+n.staffIndex+'" value="'+escapeAttr(n.code)+'"></div><button type="button" class="dayRemove" onclick="removeDayPerson('+n.staffIndex+')">➖ 이 날만 제거</button></div>':'<div class="person"><span>'+escapeHtml(n.name)+'</span><span class="code">'+escapeHtml(n.code)+(n.position?" · 포지션 "+n.position:"")+'</span></div>').join(""):'<div class="empty">근무자 없음</div>')+'</div>'}
function shiftCode(shift){return {DAY:"D",EVE:"E",NIGHT:"N"}[shift]||"D"}function addDayPerson(role,shift){const month=localKey(currentDate).slice(0,7),day=Number(localKey(currentDate).slice(-2))-1,data=dutyCache[month];if(!data)return;const name=prompt("이 날 근무에 추가할 사람 이름을 입력하세요.");if(!name||!name.trim())return;const trimmed=name.trim();let idx=data.staff.findIndex(s=>s[0]===role&&String(s[1]).trim()===trimmed);if(idx<0){const code=prompt("근무 코드를 입력하세요. 예: D / D1 / E / N / eE1",shiftCode(shift));if(code===null||!code.trim())return;const codes=Array.isArray(data.staff[0]?.[2])?new Array(data.staff[0][2].length).fill(""):new Array(new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate()).fill("");codes[day]=code.trim();data.staff.push([role,trimmed,codes])}else{const code=prompt("이 날 근무 코드를 입력하세요. 예: D / D1 / E / N / eE1",shiftCode(shift));if(code===null||!code.trim())return;data.staff[idx][2][day]=code.trim()}render()}function removeDayPerson(staffIndex){const month=localKey(currentDate).slice(0,7),day=Number(localKey(currentDate).slice(-2))-1,data=dutyCache[month];if(!data?.staff?.[staffIndex])return;const name=data.staff[staffIndex][1];if(!confirm(name+" 님을 이 날 근무에서만 제거할까요?\n월 근무표의 사람 자체는 삭제되지 않습니다."))return;data.staff[staffIndex][2][day]="";render()}function escapeAttr(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}async function toggleEdit(){editing=!editing;document.getElementById("editDutyBtn").classList.toggle("hidden",editing);document.getElementById("saveDutyBtn").classList.toggle("hidden",!editing);await render()}
async function saveDuty(){const month=localKey(currentDate).slice(0,7),d=Number(localKey(currentDate).slice(-2));const data=dutyCache[month];document.querySelectorAll(".staffName").forEach(el=>{const i=Number(el.dataset.idx);if(data.staff[i])data.staff[i][1]=el.value.trim()});document.querySelectorAll(".staffCode").forEach(el=>{const i=Number(el.dataset.idx);if(data.staff[i]){const day=d-1;data.staff[i][2][day]=el.value.trim()}});document.querySelectorAll(".doctorInput").forEach(el=>{const role=el.dataset.role,day=Number(el.dataset.day)-1,shift=Number(el.dataset.shift);if(!Array.isArray(data.doctorData[role]))data.doctorData[role]=[];if(!Array.isArray(data.doctorData[role][day]))data.doctorData[role][day]=[];data.doctorData[role][day][shift]=el.value.trim()});const token=localStorage.getItem("ju_files_token");const headers={"Content-Type":"application/json",Authorization:"Bearer "+token};const requests=[["nurses",data.staff.filter(s=>s[0]==="n")],["assistants",data.staff.filter(s=>s[0]==="a")],["doctors",Object.fromEntries(Object.entries(data.doctorData||{}).filter(([k])=>k!=="pa"&&k!=="emt"))],["pa",Array.isArray(data.doctorData?.pa)?data.doctorData.pa:[]],["emt",Array.isArray(data.doctorData?.emt)?data.doctorData.emt:[]]];for(const [section,payload] of requests){const res=await fetch(API+"/api/duty/"+month+"/"+section,{method:"PUT",headers,body:JSON.stringify(payload)});if(!res.ok){alert(section+" 근무 저장에 실패했습니다.");return}}editing=false;document.getElementById("saveDutyBtn").classList.add("hidden");document.getElementById("editDutyBtn").classList.remove("hidden");await render()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function moveDay(n){currentDate.setDate(currentDate.getDate()+n);render();}render();
</script><script>(async()=>{isAdmin=await checkAdmin();if(isAdmin)document.getElementById("editDutyBtn").classList.remove("hidden");document.getElementById("editDutyBtn").onclick=toggleEdit;document.getElementById("saveDutyBtn").onclick=saveDuty;})();</script></body></html>
