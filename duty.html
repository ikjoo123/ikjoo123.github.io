<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>익주 · 근무</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8f1,#eef7ff 55%,#f7efff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}.container{max-width:1000px;margin:auto;padding:24px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:25px;margin:0}.back{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 13px;text-decoration:none;color:#333}.datebar{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.date{text-align:center}.date strong{display:block;font-size:20px}.date span{font-size:13px;color:#777}.nav{border:1px solid #ddd;background:#fff;border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer}.sectionTitle{margin:22px 0 10px;font-size:18px}.viewPanel.hidden{display:none!important}.doctors{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.doctorCard{background:rgba(255,255,255,.94);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.07)}.doctorHead{padding:16px 15px;font-weight:800;font-size:18px}.doctorCard:nth-child(1) .doctorHead{background:#ffe7ed;color:#a33b55}.doctorCard:nth-child(2) .doctorHead{background:#e8f5e9;color:#32733a}.doctorCard:nth-child(3) .doctorHead{background:#fff4d6;color:#8a6500}.doctorBody{padding:12px 15px}.doctorLine{padding:10px 0;border-bottom:1px solid #eee}.doctorLine:last-child{border-bottom:0}.doctorLabel{font-size:12px;color:#777;font-weight:700}.doctorNames{margin-top:3px;font-weight:650}.time{font-size:11px;color:#888;margin-left:4px}.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.shift{background:rgba(255,255,255,.92);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.07)}.shift:nth-child(1) .shiftHead{background:#fff0d8;color:#b45b00}.shift:nth-child(2) .shiftHead{background:#e9e4ff;color:#5b45a8}.shift:nth-child(3) .shiftHead{background:#dff4ff;color:#16718f}.shiftHead{padding:16px 15px;font-weight:800;font-size:18px}.shiftBody{padding:12px 15px}.group{margin-bottom:13px}.groupTitle{font-size:12px;color:#777;margin-bottom:6px;font-weight:700}.person{padding:9px 10px;background:#f7f7f8;border-radius:10px;margin-bottom:6px;font-weight:600;display:flex;justify-content:space-between;gap:8px}.code{font-size:12px;color:#777;font-weight:700}.empty{color:#aaa;text-align:center;padding:12px 0;font-size:13px}.notice{margin-top:14px;color:#777;font-size:12px;line-height:1.6}@media(max-width:700px){.shifts,.doctors{grid-template-columns:1fr}}.uploadPanel{margin-top:28px}.uploadBox{background:rgba(255,255,255,.94);border:1px dashed #d8d8d8;border-radius:16px;padding:18px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.04)}.uploadHint{font-size:13px;color:#777;line-height:1.7;margin-bottom:12px}.uploadBtn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.uploadStatus{margin-top:12px;font-size:13px;color:#666;min-height:20px}.uploadStatus.ok{color:#287a45}.uploadStatus.error{color:#c33}</style><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><div class="container"><div class="top"><h1>🧑‍⚕️ 근무</h1><a class="back" href="index.html">← 익주 홈</a></div><div class="datebar"><button class="nav" onclick="moveDay(-1)">‹</button><div class="date"><strong id="dateTitle"></strong><span id="dateWeekday"></span></div><button class="nav" onclick="moveDay(1)">›</button></div><div id="staffView" class="viewPanel"><div id="shifts" class="shifts"></div></div><div id="doctorView" class="viewPanel"><h2 class="sectionTitle">🧑‍⚕️ 의사 근무</h2><div id="doctors" class="doctors"></div></div><div class="uploadPanel" id="nextDutyUploadPanel">
<h2 class="sectionTitle">📤 다음달 근무표가 없나요?</h2>
<div class="uploadBox">
  <div class="uploadHint">근무표 사진이나 Excel 파일을 올려주세요.<br>AI가 다음달 근무표를 분석해서 자동으로 반영합니다.</div>
  <input id="nextDutyFile" type="file" accept=".xlsx,.xls,.csv,image/*" hidden>
  <button class="uploadBtn" onclick="document.getElementById('nextDutyFile').click()">근무표 업로드</button>
  <div id="nextDutyStatus" class="uploadStatus"></div>
</div>
</div></div><script>
const API="https://ikjoo123-github-io.zjaghkf0000.workers.dev";const dutyCache={};let staff=[],doctorData={},schedules={};
async function loadMonth(month){
  if(!dutyCache[month]) dutyCache[month]=await fetch(API+"/api/duty/"+month).then(r=>{if(!r.ok)throw new Error("근무 데이터 로드 실패: "+month);return r.json()});
  const d=dutyCache[month]; staff=d.staff||[]; doctorData=d.doctorData||{}; schedules={};
  for(const [role,name,codes] of staff)for(let i=0;i<codes.length;i++){
    const code=String(codes[i]||"").trim(),m=code.match(/^([DEN])([1-4])?$/);if(!m)continue;
    const shift={D:"DAY",E:"EVE",N:"NIGHT"}[m[1]],k=month+"-"+String(i+1).padStart(2,"0");
    schedules[k]??={DAY:{nurses:[],doctors:[],assistants:[]},EVE:{nurses:[],doctors:[],assistants:[]},NIGHT:{nurses:[],doctors:[],assistants:[]}};
    schedules[k][shift][role==="n"?"nurses":"assistants"].push({name,code,position:m[2]||""})
  }
}
let currentDate=new Date();function localKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function fmt(d){return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일"}async function render(){const month=localKey(currentDate).slice(0,7);await loadMonth(month);const k=localKey(currentDate),data=schedules[k]||{DAY:{nurses:[],doctors:[],assistants:[]},EVE:{nurses:[],doctors:[],assistants:[]},NIGHT:{nurses:[],doctors:[],assistants:[]}};document.getElementById("dateTitle").textContent=fmt(currentDate);document.getElementById("dateWeekday").textContent=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"][currentDate.getDay()];document.getElementById("shifts").innerHTML=["DAY","EVE","NIGHT"].map(shift=>{const x=data[shift];const nurses=[...x.nurses].sort((a,b)=>(Number(a.position)||99)-(Number(b.position)||99));return '<div class="shift"><div class="shiftHead">'+shift+'</div><div class="shiftBody">'+group("간호사",nurses)+group("보조원",x.assistants)+'</div></div>'}).join("");renderDoctors(k)}function renderDoctors(k){const d=Number(k.slice(-2));const roles=[["전문의","specialist",[["D","07:00~15:00"],["E","15:00~22:00"],["N","22:00~익일 07:00"]]],["전공의","resident",[["D","07:00~19:00"],["M","13:00~22:00 / 10:00~19:00"],["N","19:00~익일 07:00"]]],["인턴","intern",[["D","07:00~19:00"],["N","19:00~익일 07:00"]]]];document.getElementById("doctors").innerHTML=roles.map(r=>{const a=doctorData[r[1]][d-1]||[];return '<div class="doctorCard"><div class="doctorHead">'+r[0]+'</div><div class="doctorBody">'+r[2].map((x,i)=>'<div class="doctorLine"><div class="doctorLabel">'+x[0]+' <span class="time">'+x[1]+'</span></div><div class="doctorNames">'+(a[i]?escapeHtml(a[i]):"근무자 없음")+'</div></div>').join("")+'</div></div>'}).join("")}
function group(title,arr){return '<div class="group"><div class="groupTitle">'+title+'</div>'+(arr.length?arr.map(n=>'<div class="person"><span>'+escapeHtml(n.name)+'</span><span class="code">'+escapeHtml(n.code)+(n.position?" · 포지션 "+n.position:"")+'</span></div>').join(""):'<div class="empty">근무자 없음</div>')+'</div>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function moveDay(n){currentDate.setDate(currentDate.getDate()+n);render();}render();

const nextDutyFile=document.getElementById("nextDutyFile");
const nextDutyStatus=document.getElementById("nextDutyStatus");
const nextDutyUploadPanel=document.getElementById("nextDutyUploadPanel");
async function checkNextDutyAvailability(){
  try{
    const r=await fetch(API+"/api/duty/"+nextMonthKey());
    if(r.ok) nextDutyUploadPanel.style.display="none";
    else nextDutyUploadPanel.style.display="";
  }catch(e){
    nextDutyUploadPanel.style.display="";
  }
}
function nextMonthKey(){
  const d=new Date();
  d.setMonth(d.getMonth()+1,1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function setUploadStatus(msg,type){
  nextDutyStatus.textContent=msg;
  nextDutyStatus.className="uploadStatus "+(type||"");
}
async function imageToDataUrl(file){
  const dataUrl=await new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
  const img=await new Promise((resolve,reject)=>{
    const i=new Image();
    i.onload=()=>resolve(i);
    i.onerror=reject;
    i.src=dataUrl;
  });
  const max=2200, scale=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(img.width*scale));
  c.height=Math.max(1,Math.round(img.height*scale));
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.82);
}
async function excelToText(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  return wb.SheetNames.map(name=>{
    const ws=wb.Sheets[name];
    return "### SHEET: "+name+"\n"+XLSX.utils.sheet_to_csv(ws,{FS:"\t",RS:"\n"});
  }).join("\n\n").slice(0,180000);
}
nextDutyFile.addEventListener("change",async()=>{
  const file=nextDutyFile.files&&nextDutyFile.files[0];
  nextDutyFile.value="";
  if(!file)return;
  if(file.size>8*1024*1024){setUploadStatus("파일이 너무 큽니다. 8MB 이하로 올려주세요.","error");return;}
  const month=nextMonthKey();
  try{
    setUploadStatus(month.replace("-","년 ")+"월 근무표 분석 중…");
    let body={month};
    if(file.type.startsWith("image/")){
      body.kind="image";
      body.data=await imageToDataUrl(file);
    }else{
      body.kind="text";
      body.data=await excelToText(file);
    }
    const res=await fetch(API+"/api/duty/import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error||"분석에 실패했습니다.");
    setUploadStatus("✅ "+month+" 근무표 분석 및 반영이 완료됐습니다.","ok");
    nextDutyUploadPanel.style.display="none";
    dutyCache[month]=data.duty;
    currentDate=new Date(Number(month.slice(0,4)),Number(month.slice(5,7))-1,1);
    await render();
  }catch(e){
    setUploadStatus("⚠️ "+(e.message||"분석에 실패했습니다.")+" 기존 근무표는 변경하지 않았습니다.","error");
  }
});
checkNextDutyAvailability();
</script></body></html>
