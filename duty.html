<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ER 근무</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8f1,#eef7ff 55%,#f7efff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}.container{max-width:1000px;margin:auto;padding:24px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:25px;margin:0}.back{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 13px;text-decoration:none;color:#333}.back:disabled{opacity:.65;cursor:wait}.datebar{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.date{text-align:center}.date strong{display:block;font-size:20px}.date span{font-size:13px;color:#777}.nav{border:1px solid #ddd;background:#fff;border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer}.sectionTitle{margin:22px 0 10px;font-size:18px}.viewPanel.hidden{display:none!important}.doctors{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.doctorCard{background:rgba(255,255,255,.94);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.07)}.doctorHead{padding:16px 15px;font-weight:800;font-size:18px}.doctorCard:nth-child(1) .doctorHead{background:#ffe7ed;color:#a33b55}.doctorCard:nth-child(2) .doctorHead{background:#e8f5e9;color:#32733a}.doctorCard:nth-child(3) .doctorHead{background:#fff4d6;color:#8a6500}.doctorCard:nth-child(4) .doctorHead{background:#eeeeee;color:#666}.doctorBody{padding:12px 15px}.doctorLine{padding:10px 0;border-bottom:1px solid #eee}.doctorLine:last-child{border-bottom:0}.doctorLabel{font-size:12px;color:#777;font-weight:700}.doctorNames{margin-top:3px;font-weight:650}.time{font-size:11px;color:#888;margin-left:4px}.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.shift{background:rgba(255,255,255,.92);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.07)}.shift:nth-child(1) .shiftHead{background:#fff0d8;color:#b45b00}.shift:nth-child(2) .shiftHead{background:#e9e4ff;color:#5b45a8}.shift:nth-child(3) .shiftHead{background:#dff4ff;color:#16718f}.shiftHead{padding:16px 15px;font-weight:800;font-size:18px}.shiftBody{padding:12px 15px}.group{margin-bottom:13px}.groupTitle{font-size:12px;color:#777;margin-bottom:6px;font-weight:700}.lastUpdated{font-size:10px;color:#999;font-weight:500;margin-left:6px;white-space:nowrap}.person{padding:9px 10px;background:#f7f7f8;border-radius:10px;margin-bottom:6px;font-weight:600;display:flex;justify-content:space-between;gap:8px}.code{font-size:12px;color:#777;font-weight:700}.empty{color:#aaa;text-align:center;padding:12px 0;font-size:13px}.notice{margin-top:14px;color:#777;font-size:12px;line-height:1.6}@media(max-width:700px){.shifts,.doctors{grid-template-columns:1fr}}.hidden{display:none!important}.editInput{width:100%;padding:7px 8px;border:1px solid #ccc;border-radius:7px;font:inherit}.editRow{display:grid;grid-template-columns:1fr 90px;gap:6px;margin-bottom:6px}.dayAdd,.dayRemove{border:1px solid #ddd;background:#fff;border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer}.dayAdd{margin-left:5px}.dayRemove{width:100%;color:#a33;margin-top:2px}</style></head><body><div class="container"><div class="top"><h1>🧑‍⚕️ 근무</h1><div><button id="editDutyBtn" class="back hidden" type="button">✏️ 근무 수정</button><a id="dutyDataBtn" href="duty-data.html" class="back hidden" style="text-decoration:none;margin-left:8px">🗂️ 근무 데이터 관리</a> <button id="saveDutyBtn" class="back hidden" type="button">💾 저장</button>  <a class="back" href="index.html">← 익주 홈</a></div></div><div class="datebar"><button class="nav" onclick="moveDay(-1)">‹</button><div class="date"><strong id="dateTitle"></strong><span id="dateWeekday"></span></div><button class="nav" onclick="moveDay(1)">›</button></div><div id="staffView" class="viewPanel"><div id="shifts" class="shifts"></div></div><div id="doctorView" class="viewPanel"><h2 class="sectionTitle">🏥 응급의료센터근무</h2><div id="doctors" class="doctors"></div></div>
<section id="dutyBoard" style="margin-top:14px;background:#fff;border:1px solid #e4e7eb;border-radius:14px;padding:10px 12px">
 <button id="boardToggle" type="button" aria-expanded="false" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 2px;border:0;background:transparent;text-align:left;font:inherit;font-weight:800;font-size:16px;cursor:pointer"><span>📌 근무 업로드 · 자유게시판</span><span id="boardToggleIcon" style="color:#667085;font-size:13px">＋ 글쓰기</span></button>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0">
  <label for="boardMonth">조회 월</label><input id="boardMonth" type="month" style="padding:8px;border:1px solid #d5d9df;border-radius:8px">
  <button id="boardReload" type="button" style="padding:8px 12px;border:1px solid #d5d9df;border-radius:8px;background:#fff">새로고침</button>

 <div id="boardComposer" hidden>
  <form id="boardForm">
   <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="boardAuthor" maxlength="40" placeholder="작성자 (선택)" style="flex:1;min-width:140px;padding:10px;border:1px solid #d5d9df;border-radius:8px"><input id="boardFile" type="file" style="flex:2;min-width:200px;padding:7px;border:1px solid #d5d9df;border-radius:8px"></div>
   <textarea id="boardMessage" maxlength="5000" placeholder="근무 관련 글이나 댓글을 자유롭게 작성하세요. (파일만 올려도 됩니다)" style="width:100%;min-height:110px;margin-top:8px;padding:10px;border:1px solid #d5d9df;border-radius:8px;font:inherit;resize:vertical"></textarea>
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px"><button id="boardSubmit" type="submit" style="padding:10px 15px;border:1px solid #d5d9df;border-radius:8px;background:#f8fafc;font-weight:700">글·파일 업로드</button><span style="font-size:12px;color:#666">업로드 내용은 선택한 월에 저장됩니다.</span></div>
  </form>
 </div>
 <div id="boardStatus" role="status" style="margin:8px 0;color:#555;font-size:14px"></div>
 <div id="boardPosts"></div>
</section></div><script>
const API="https://ikjoo123-github-io.zjaghkf0000.workers.dev";const dutyCache={};let staff=[],doctorData={},schedules={},updatedAt={},dutyOriginal={},editing=false,isAdmin=false;
async function checkAdmin(){const token=localStorage.getItem("ju_files_token");if(!token)return false;try{const r=await fetch(API+"/api/me",{headers:{Authorization:"Bearer "+token}});if(!r.ok)return false;const d=await r.json();return d.role==="admin"}catch(e){return false}}

async function loadMonth(month){
  if(!dutyCache[month]){
    try{
      const res=await fetch(API+"/api/duty/"+month);
      dutyCache[month]=res.ok?await res.json():{staff:[],doctorData:{}};
      if(month==="2026-10"){
        try{
          const er=await fetch(API+"/api/duty/"+month+"/emt",{cache:"no-store"});
          if(er.ok){ dutyCache[month].doctorData??={}; dutyCache[month].doctorData.emt=await er.json(); }
        }catch(_){ }
      }
    }catch(e){
      dutyCache[month]={staff:[],doctorData:{}};
    }
  }
  const d=dutyCache[month]; staff=d.staff||[]; doctorData=d.doctorData||{}; updatedAt=d.updatedAt||{}; dutyOriginal=Object.fromEntries(Object.entries(dutySections(d)).map(([section,payload])=>[section,JSON.stringify(payload)])); schedules={};
  for(const [role,name,codes] of staff)for(let i=0;i<codes.length;i++){
    const code=String(codes[i]||"").trim();
    const m=code.match(/^([DEN])([1-4])?$/),ee=code.match(/^eE([1-4])?$/i);if(!m&&!ee)continue;
    const shift=ee?"EVE":{D:"DAY",E:"EVE",N:"NIGHT"}[m[1]],k=month+"-"+String(i+1).padStart(2,"0");
    schedules[k]??={DAY:{nurses:[],doctors:[],assistants:[]},EVE:{nurses:[],doctors:[],assistants:[]},NIGHT:{nurses:[],doctors:[],assistants:[]}};
    schedules[k][shift][role==="n"?"nurses":"assistants"].push({name,code,position:ee?(ee[1]||"eE"):(m[2]||""),staffIndex:staff.findIndex(s=>s[1]===name&&s[0]===role)})
  }
}
function formatUpdatedAt(value){if(!value)return "최종 수정: 기록 없음";const d=new Date(value);if(Number.isNaN(d.getTime()))return "최종 수정: 기록 없음";return "최종 수정: "+d.toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})}function updatedLabel(section){return '<span class="lastUpdated">'+formatUpdatedAt(updatedAt[section])+'</span>'}function dutySections(data){return {nurses:data.staff.filter(s=>s[0]==="n"),assistants:data.staff.filter(s=>s[0]==="a"),doctors:Object.fromEntries(Object.entries(data.doctorData||{}).filter(([k])=>k!=="pa"&&k!=="emt")),pa:Array.isArray(data.doctorData?.pa)?data.doctorData.pa:[],emt:Array.isArray(data.doctorData?.emt)?data.doctorData.emt:[]}}let currentDate=new Date();function localKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function fmt(d){return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일"}async function render(){const month=localKey(currentDate).slice(0,7);await loadMonth(month);const k=localKey(currentDate),data=schedules[k]||{DAY:{nurses:[],doctors:[],assistants:[]},EVE:{nurses:[],doctors:[],assistants:[]},NIGHT:{nurses:[],doctors:[],assistants:[]}};document.getElementById("dateTitle").textContent=fmt(currentDate);document.getElementById("dateWeekday").textContent=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"][currentDate.getDay()];document.getElementById("shifts").innerHTML=["DAY","EVE","NIGHT"].map(shift=>{const x=data[shift];const nurses=[...x.nurses].sort((a,b)=>(Number(a.position)||99)-(Number(b.position)||99));return '<div class="shift"><div class="shiftHead">'+({DAY:"DAY ☀️",EVE:"EVE 🌥️",NIGHT:"NIGHT 🌙"}[shift])+'</div><div class="shiftBody">'+group("간호사",nurses,shift)+group("보조원",x.assistants,shift)+'</div></div>'}).join("");renderDoctors(k)}function renderDoctors(k){const d=Number(k.slice(-2));const roles=[["전문의","specialist",[["D","07:00~15:00"],["E","15:00~22:00"],["N","22:00~익일 07:00"]]],["전공의","resident",[["D","07:00~19:00"],["M","13:00~22:00 / 10:00~19:00"],["N","19:00~익일 07:00"]]],["인턴","intern",[["D","07:00~19:00"],["N","19:00~익일 07:00"]]],["PA","pa",[["D","07:00~15:00"],["E","15:00~23:00"],["N","23:00~익일 07:00"]]],["응급구조사","emt",[["D","07:00~15:00"],["E","15:00~22:00"],["N","22:00~익일 07:00"]]]];document.getElementById("doctors").innerHTML=roles.map(r=>{if(r[1]==="pa"){const rows=Array.isArray(doctorData.pa)?doctorData.pa:[];const hasData=rows.some(row=>Array.isArray(row)?row.some(v=>String(v??"").trim()!==""):String(row??"").trim()!=="");return '<div class="doctorCard"><div class="doctorHead">PA '+updatedLabel("pa")+'</div><div class="doctorBody">'+r[2].map((x,i)=>{const people=rows.map((row,idx)=>({row,idx,code:String(row?.[1]?.[d-1]||"").trim()})).filter(v=>({D:0,E:1,N:2}[v.code])===i);return '<div class="doctorLine"><div class="doctorLabel">'+x[0]+' <span class="time">'+x[1]+'</span></div><div class="doctorNames">'+(people.length?people.map(v=>editing?'<div style="margin:4px 0"><span>'+escapeHtml(v.row[0])+'</span> <input class="editInput paCodeInput" style="width:90px;display:inline-block" data-idx="'+v.idx+'" value="'+escapeAttr(v.code)+'"></div>':'<div>'+escapeHtml(v.row[0])+' <span class="code">'+escapeHtml(v.code)+'</span></div>').join(""):(editing&&hasData?'<div class="empty">근무자 없음</div>':(hasData?"근무자 없음":"데이터 없음")))+'</div></div>'}).join("")+'</div></div>'}const rows=Array.isArray(doctorData[r[1]])?doctorData[r[1]]:[];const hasData=rows.some(row=>Array.isArray(row)?row.some(v=>String(v??"").trim()!==""):String(row??"").trim()!=="");const a=hasData?(rows[d-1]||[]):[];return '<div class="doctorCard"><div class="doctorHead">'+r[0]+' '+updatedLabel(r[1]==="emt"?"emt":"doctors")+'</div><div class="doctorBody">'+r[2].map((x,i)=>'<div class="doctorLine"><div class="doctorLabel">'+x[0]+' <span class="time">'+x[1]+'</span></div><div class="doctorNames">'+(a[i]?(editing?'<input class="editInput doctorInput" data-role="'+r[1]+'" data-day="'+d+'" data-shift="'+i+'" value="'+escapeAttr(a[i])+'">':escapeHtml(a[i])):(editing&&hasData?'<input class="editInput doctorInput" data-role="'+r[1]+'" data-day="'+d+'" data-shift="'+i+'" value="">':(hasData?"근무자 없음":"데이터 없음")))+'</div></div>').join("")+'</div></div>'}).join("")}function group(title,arr,shift){const role=title==="간호사"?"n":"a";return '<div class="group"><div class="groupTitle">'+title+' '+updatedLabel(role==="n"?"nurses":"assistants")+(editing?' <button type="button" class="dayAdd" onclick="addDayPerson(\''+role+'\',\''+shift+'\')">➕ 사람 추가</button>':'')+'</div>'+(arr.length?arr.map(n=>editing?'<div class="person editPerson"><div class="editRow"><input class="editInput staffName" data-idx="'+n.staffIndex+'" value="'+escapeAttr(n.name)+'"><input class="editInput staffCode" data-idx="'+n.staffIndex+'" value="'+escapeAttr(n.code)+'"></div><button type="button" class="dayRemove" onclick="removeDayPerson('+n.staffIndex+')">➖ 이 날만 제거</button></div>':'<div class="person"><span>'+escapeHtml(n.name)+'</span><span class="code">'+escapeHtml(n.code)+(n.position?" · 포지션 "+n.position:"")+'</span></div>').join(""):'<div class="empty">근무자 없음</div>')+'</div>'}
function shiftCode(shift){return {DAY:"D",EVE:"E",NIGHT:"N"}[shift]||"D"}function addDayPerson(role,shift){const month=localKey(currentDate).slice(0,7),day=Number(localKey(currentDate).slice(-2))-1,data=dutyCache[month];if(!data)return;const name=prompt("이 날 근무에 추가할 사람 이름을 입력하세요.");if(!name||!name.trim())return;const trimmed=name.trim();let idx=data.staff.findIndex(s=>s[0]===role&&String(s[1]).trim()===trimmed);if(idx<0){const code=prompt("근무 코드를 입력하세요. 예: D / D1 / E / N / eE1",shiftCode(shift));if(code===null||!code.trim())return;const codes=Array.isArray(data.staff[0]?.[2])?new Array(data.staff[0][2].length).fill(""):new Array(new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate()).fill("");codes[day]=code.trim();data.staff.push([role,trimmed,codes])}else{const code=prompt("이 날 근무 코드를 입력하세요. 예: D / D1 / E / N / eE1",shiftCode(shift));if(code===null||!code.trim())return;data.staff[idx][2][day]=code.trim()}render()}function removeDayPerson(staffIndex){const month=localKey(currentDate).slice(0,7),day=Number(localKey(currentDate).slice(-2))-1,data=dutyCache[month];if(!data?.staff?.[staffIndex])return;const name=data.staff[staffIndex][1];if(!confirm(name+" 님을 이 날 근무에서만 제거할까요?\n월 근무표의 사람 자체는 삭제되지 않습니다."))return;data.staff[staffIndex][2][day]="";render()}function escapeAttr(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}async function toggleEdit(){editing=!editing;document.getElementById("editDutyBtn").classList.toggle("hidden",editing);document.getElementById("saveDutyBtn").classList.toggle("hidden",!editing);await render()}
async function saveDuty(){const saveButton=document.getElementById("saveDutyBtn");if(saveButton.disabled)return;const originalLabel=saveButton.textContent;saveButton.disabled=true;saveButton.setAttribute("aria-busy","true");saveButton.textContent="💾 저장 중…";const month=localKey(currentDate).slice(0,7),d=Number(localKey(currentDate).slice(-2));const data=dutyCache[month];document.querySelectorAll(".staffName").forEach(el=>{const i=Number(el.dataset.idx);if(data.staff[i])data.staff[i][1]=el.value.trim()});document.querySelectorAll(".staffCode").forEach(el=>{const i=Number(el.dataset.idx);if(data.staff[i]){const day=d-1;data.staff[i][2][day]=el.value.trim()}});document.querySelectorAll(".doctorInput").forEach(el=>{const role=el.dataset.role,day=Number(el.dataset.day)-1,shift=Number(el.dataset.shift);if(!Array.isArray(data.doctorData[role]))data.doctorData[role]=[];if(!Array.isArray(data.doctorData[role][day]))data.doctorData[role][day]=[];data.doctorData[role][day][shift]=el.value.trim()});document.querySelectorAll(".paCodeInput").forEach(el=>{const i=Number(el.dataset.idx);if(data.doctorData.pa?.[i]?.[1])data.doctorData.pa[i][1][d-1]=el.value.trim()});const token=localStorage.getItem("ju_files_token");const headers={"Content-Type":"application/json",Authorization:"Bearer "+token};const allRequests=Object.entries(dutySections(data));const requests=allRequests.filter(([section,payload])=>JSON.stringify(payload)!==dutyOriginal[section]);try{for(const [section,payload] of requests){const res=await fetch(API+"/api/duty/"+month+"/"+section,{method:"PUT",headers,body:JSON.stringify(payload)});if(!res.ok)throw new Error(section+" 근무 저장에 실패했습니다.")}saveButton.textContent="✅ 저장 완료";editing=false;document.getElementById("saveDutyBtn").classList.add("hidden");document.getElementById("editDutyBtn").classList.remove("hidden");delete dutyCache[month];await render()}catch(error){saveButton.disabled=false;saveButton.removeAttribute("aria-busy");saveButton.textContent=originalLabel;alert(error.message||"근무 저장에 실패했습니다.")}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function moveDay(n){currentDate.setDate(currentDate.getDate()+n);render();}render();
</script><script>(async()=>{isAdmin=await checkAdmin();if(isAdmin){document.getElementById("editDutyBtn").classList.remove("hidden");document.getElementById("dutyDataBtn").classList.remove("hidden");}document.getElementById("editDutyBtn").onclick=toggleEdit;document.getElementById("saveDutyBtn").onclick=saveDuty;})();</script><script>
(function(){
 const api=API;
 let boardIsAdmin=false;
 const $b=id=>document.getElementById(id);
 const now=new Date();$b("boardMonth").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
 const escB=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 function say(t){$b("boardStatus").textContent=t}
 async function loadBoard(){
  const month=$b("boardMonth").value;
  if(!/^\d{4}-\d{2}$/.test(month)){say("월을 선택해주세요.");return}
  say("불러오는 중...");
  try{
   const r=await fetch(api+"/api/duty-board/"+month,{cache:"no-store"});
   if(!r.ok)throw new Error("게시글을 불러오지 못했습니다.");
   const data=await r.json(),posts=Array.isArray(data.posts)?data.posts:[];
   $b("boardPosts").innerHTML=posts.length?posts.map(p=>{
    const dt=p.createdAt?new Date(p.createdAt).toLocaleString("ko-KR"):"";
    let file="";
    if(p.attachment&&p.attachment.key){
      const id=p.attachment.key.split("/").pop();
      file='<div style="margin-top:8px"><a href="'+api+"/api/duty-board-file/"+encodeURIComponent(month)+"/"+encodeURIComponent(id)+'" target="_blank" rel="noopener" style="overflow-wrap:anywhere">📎 '+escB(p.attachment.name)+' ('+Math.ceil((p.attachment.size||0)/1024)+' KB)</a></div>';
    }
    const adminTools=boardIsAdmin?'<div style="display:flex;gap:6px;margin-top:9px"><button type="button" data-board-edit="'+escB(p.id)+'" style="padding:5px 10px;border:1px solid #d5d9df;border-radius:7px;background:#fff">✏️ 수정</button><button type="button" data-board-delete="'+escB(p.id)+'" style="padding:5px 10px;border:1px solid #f1c5c5;border-radius:7px;background:#fff7f7;color:#a33">🗑️ 삭제</button></div>':'';
    return '<article style="border-top:1px solid #e5e7eb;padding:13px 2px"><div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap"><strong>'+escB(p.author||"익명")+'</strong><time style="font-size:12px;color:#777">'+escB(dt)+'</time></div><div style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px">'+escB(p.message||"")+'</div>'+file+adminTools+'</article>';
   }).join(""):'<div style="padding:18px 4px;color:#777">이 달에는 등록된 글이나 파일이 없습니다.</div>';
   say(month+" 게시글 "+posts.length+"개");
  }catch(e){say(e.message||"불러오기 실패")}
 }
 $b("boardReload").addEventListener("click",loadBoard);
 $b("boardMonth").addEventListener("change",loadBoard);
 $b("boardForm").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const month=$b("boardMonth").value,file=$b("boardFile").files[0],message=$b("boardMessage").value.trim(),author=$b("boardAuthor").value.trim();
  if(!message&&!file){say("글을 입력하거나 파일을 선택해주세요.");return}
  const form=new FormData();form.append("author",author);form.append("message",message);if(file)form.append("file",file);
  $b("boardSubmit").disabled=true;say("업로드 중...");
  try{
   const r=await fetch(api+"/api/duty-board/"+month+"/posts",{method:"POST",body:form});
   const d=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(d.error||d.message||"업로드에 실패했습니다.");
   $b("boardMessage").value="";$b("boardFile").value="";say("업로드 완료");await loadBoard();
  }catch(e){say(e.message||"업로드 실패")}finally{$b("boardSubmit").disabled=false}
 });
 $b("boardPosts").addEventListener("click",async ev=>{
  const edit=ev.target.closest("[data-board-edit]"),del=ev.target.closest("[data-board-delete]"),save=ev.target.closest("[data-board-save]"),cancel=ev.target.closest("[data-board-cancel]");
  if(!edit&&!del&&!save&&!cancel)return;
  const month=$b("boardMonth").value;
  const token=localStorage.getItem("ju_files_token");
  if(cancel){await loadBoard();return}
  if(edit){
   const id=edit.dataset.boardEdit;
   const postList=await fetch(api+"/api/duty-board/"+month,{cache:"no-store"}).then(r=>r.json()).catch(()=>({posts:[]}));
   const post=(postList.posts||[]).find(p=>p.id===id);
   if(!post){say("게시글을 찾을 수 없습니다. 새로고침해 주세요.");return}
   const article=edit.closest("article");
   if(!article)return;
   const editor=document.createElement("div");editor.style.cssText="margin-top:10px;padding:12px;background:#f8fafc;border:1px solid #dbe2ea;border-radius:10px";
   const authorLabel=document.createElement("label");authorLabel.textContent="작성자";authorLabel.style.cssText="display:block;font-size:13px;margin-bottom:4px";
   const authorInput=document.createElement("input");authorInput.type="text";authorInput.maxLength=40;authorInput.value=post.author||"익명";authorInput.style.cssText="box-sizing:border-box;width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;margin-bottom:10px";
   const messageLabel=document.createElement("label");messageLabel.textContent="게시글 내용";messageLabel.style.cssText="display:block;font-size:13px;margin-bottom:4px";
   const messageInput=document.createElement("textarea");messageInput.maxLength=5000;messageInput.value=post.message||"";messageInput.rows=6;messageInput.style.cssText="box-sizing:border-box;width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;resize:vertical;font:inherit";
   const actions=document.createElement("div");actions.style.cssText="display:flex;gap:8px;margin-top:9px";
   const saveBtn=document.createElement("button");saveBtn.type="button";saveBtn.textContent="변경 저장";saveBtn.dataset.boardSave=id;saveBtn.style.cssText="padding:8px 13px;border:0;border-radius:7px;background:#2563eb;color:white";
   const cancelBtn=document.createElement("button");cancelBtn.type="button";cancelBtn.textContent="취소";cancelBtn.dataset.boardCancel="1";cancelBtn.style.cssText="padding:8px 13px;border:1px solid #cbd5e1;border-radius:7px;background:white";
   actions.append(saveBtn,cancelBtn);editor.append(authorLabel,authorInput,messageLabel,messageInput,actions);
   const old=article.querySelector("[data-board-editor]");if(old)old.remove();editor.dataset.boardEditor="1";article.appendChild(editor);messageInput.focus();return;
  }
  if(save){
   const id=save.dataset.boardSave,editor=save.closest("[data-board-editor]"),author=editor?.querySelector("input")?.value??"",message=editor?.querySelector("textarea")?.value??"";
   if(!message.trim()&&!editor?.closest("article")?.querySelector("a[href*='/api/duty-board-file/']")){say("글 내용 또는 첨부파일이 있어야 합니다.");return}
   save.disabled=true;say("수정 중...");
   try{const r=await fetch(api+"/api/duty-board/"+month+"/posts/"+encodeURIComponent(id),{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({author,message})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"수정에 실패했습니다.");say("수정 완료");await loadBoard()}catch(e){say(e.message||"수정에 실패했습니다.");save.disabled=false}return;
  }
  if(del){
   const id=del.dataset.boardDelete;
   if(!confirm("이 게시글을 삭제할까요? 첨부파일도 함께 삭제됩니다."))return;
   say("삭제 중...");
   try{const r=await fetch(api+"/api/duty-board/"+month+"/posts/"+encodeURIComponent(id),{method:"DELETE",headers:{Authorization:"Bearer "+token}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"삭제에 실패했습니다.");say("삭제 완료");await loadBoard()}catch(e){say(e.message||"삭제에 실패했습니다.")}
  }
 });
 (async()=>{boardIsAdmin=await checkAdmin();await loadBoard()})();
 $b("boardToggle").addEventListener("click",()=>{const content=$b("boardComposer"),open=content.hidden;content.hidden=!open;$b("boardToggle").setAttribute("aria-expanded",String(open));$b("boardToggleIcon").textContent=open?"－ 접기":"＋ 글쓰기";});
})();
</script></body></html>
