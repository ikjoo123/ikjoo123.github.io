<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>꿈 기록 - 익주</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: #f5f6f8;
    color: #222;
}

/* 상단 */

.header {
    height: 64px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
}

.logo {
    font-size: 21px;
    font-weight: 700;
    cursor: pointer;
}

.back {
    border: 0;
    background: #f1f3f5;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.back:hover {
    background: #e5e7eb;
}


/* 메인 */

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 20px;
}

.title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    margin-bottom: 28px;
}


/* 꿈 기록하기 버튼 */

.addButton {
    margin-bottom: 20px;
    border: 0;
    background: #222;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.addButton:hover {
    background: #444;
}


/* 입력창 */

.dreamForm {
    display: none;
    background: white;
    border: 1px solid #eee;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
}

.dreamInput {
    width: 100%;
    padding: 11px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
}

.dreamInput:focus {
    outline: none;
    border-color: #aaa;
}

.dreamTextarea {
    width: 100%;
    padding: 11px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    resize: vertical;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
}

.dreamTextarea:focus {
    outline: none;
    border-color: #aaa;
}

.imageLabel {
    font-size: 14px;
    color: #666;
    margin: 8px 0;
}

.imageInput {
    width: 100%;
    margin-bottom: 15px;
}

.formButtons {
    display: flex;
    gap: 6px;
}

.saveButton {
    border: 0;
    background: #222;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.cancelButton {
    border: 0;
    background: #f1f3f5;
    color: #333;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}


/* 꿈 목록 */

.dreamList {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );
    gap: 20px;
}


/* 꿈 카드 */

.dreamCard {
    background: white;
    border: 1px solid #eee;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
}

.dreamCard:hover {
    transform: translateY(-3px);
    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.08);
}


/* 이미지 */

.dreamImage {
    width: 100%;
    height: 190px;
    background: #eef0f3;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 14px;
    overflow: hidden;
}

.dreamImage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}


/* 내용 */

.dreamContent {
    padding: 20px;
}

.dreamDate {
    font-size: 13px;
    color: #999;
    margin-bottom: 7px;
}

.dreamTitle {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 10px;
}

.dreamPreview {
    color: #666;
    font-size: 14px;
    line-height: 1.6;

    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;

    overflow: hidden;
}


/* 기록 없음 */

.empty {
    background: white;
    border: 1px solid #eee;
    border-radius: 16px;
    padding: 60px 20px;
    text-align: center;
    color: #888;
}


/* 상세보기 */

.dreamModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

.dreamModalBox {
    background: white;
    border-radius: 18px;
    max-width: 800px;
    width: 100%;
    max-height: 90vh;
    overflow: auto;
    padding: 25px;
}

.modalDate {
    font-size: 13px;
    color: #999;
    margin-bottom: 8px;
}

.modalTitle {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 20px;
}

.modalImage {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    border-radius: 12px;
    margin-bottom: 20px;
    background: #f1f3f5;
}

.modalContent {
    font-size: 15px;
    line-height: 1.8;
    white-space: pre-wrap;
    color: #444;
    margin-bottom: 25px;
}

.modalButtons {
    text-align: right;
}

.editButton {
    border: 0;
    background: #eef5ff;
    color: #2563eb;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    margin-right: 6px;
}

.deleteButton {
    border: 0;
    background: #fff0f0;
    color: #d33;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    margin-right: 6px;
}

.closeButton {
    border: 0;
    background: #222;
    color: white;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
}


/* 모바일 */

@media (max-width: 600px) {

    .header {
        padding: 0 16px;
    }

    .container {
        padding: 25px 15px;
    }

    .title {
        font-size: 25px;
    }

    .dreamList {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="header">

    <div
        class="logo"
        onclick="location.href='index.html'"
    >
        꿈 기록
    </div>


    <button
        class="back"
        onclick="location.href='hobby.html'"
    >
        ← 취미
    </button>

</header>



<main class="container">


    <div class="title">
        🌙 꿈 기록
    </div>


    <div class="subtitle">
        기억하고 싶은 꿈을 기록하는 공간
    </div>


    <!-- 꿈 기록하기 -->

    <button
        id="addDreamButton"
        class="addButton"
        onclick="showDreamForm()"
    >
        + 꿈 기록하기
    </button>


    <!-- 입력창 -->

    <div
        id="dreamForm"
        class="dreamForm"
    >

        <input type="hidden" id="editingDreamId" value="">
        <input
            id="dreamDate"
            class="dreamInput"
            type="date"
        >


        <input
            id="dreamTitle"
            class="dreamInput"
            type="text"
            placeholder="꿈 제목"
        >


        <textarea
            id="dreamContent"
            class="dreamTextarea"
            placeholder="꿈 내용을 적어주세요."
            rows="8"
        ></textarea>


        <div class="imageLabel">
            🖼️ 꿈 사진
        </div>
        <div id="currentDreamImageBox" style="display:none;margin:8px 0;font-size:13px;color:#777">
            현재 사진이 있습니다.
            <label style="margin-left:10px">
                <input id="removeDreamImage" type="checkbox">
                사진 삭제
            </label>
        </div>


        <input
            id="dreamImage"
            class="imageInput"
            type="file"
            accept="image/*"
        >


        <div class="formButtons">

            <button
                class="saveButton"
                onclick="saveDream()"
            >
                저장
            </button>


            <button
                class="cancelButton"
                onclick="showDreamForm()"
            >
                취소
            </button>

        </div>

    </div>


    <!-- 꿈 목록 -->

    <div
        id="dreamList"
        class="dreamList"
    ></div>


</main>



<script>
const INACTIVITY_LIMIT=30*60*1000;
const INACTIVITY_TOKEN_KEY="ju_files_token";
const ROLE_KEY="ju_files_role";
let isAdmin=localStorage.getItem(ROLE_KEY)!=="guest";
let inactivityTimer=null;
function inactivityLogout(){
  localStorage.removeItem(INACTIVITY_TOKEN_KEY);
  if(inactivityTimer) clearTimeout(inactivityTimer);
  location.href="index.html";
}
function resetInactivityTimer(){
  if(!localStorage.getItem(INACTIVITY_TOKEN_KEY)) return;
  if(inactivityTimer) clearTimeout(inactivityTimer);
  inactivityTimer=setTimeout(inactivityLogout,INACTIVITY_LIMIT);
}
["click","keydown","touchstart","mousemove","scroll"].forEach(function(type){
  document.addEventListener(type,resetInactivityTimer,{passive:true});
});
resetInactivityTimer();



const API =
    "https://ikjoo123-github-io.zjaghkf0000.workers.dev";

const TOKEN_KEY = "ju_files_token";
let isAdmin = localStorage.getItem(ROLE_KEY) !== "guest";

function getToken() {
    return localStorage.getItem(TOKEN_KEY) || "";
}

function authHeaders() {
    const token = getToken();
    return token
        ? { Authorization: "Bearer " + token }
        : {};
}

async function apiFetch(path, options) {
    options = options || {};
    const headers = new Headers(options.headers || {});
    const auth = authHeaders();

    Object.keys(auth).forEach(function(key) {
        headers.set(key, auth[key]);
    });

    options.headers = headers;

    const response = await fetch(API + path, options);

    if (response.status === 401) {
        alert("로그인이 필요합니다.");
        location.href = "work.html";
        throw new Error("로그인이 필요합니다.");
    }

    return response;
}

let dreams = [];

const initialDreams = [
    {
        date: "2026.09.27",
        title: "영혼을 잃은 고대의 새",
        content: "의인화된 새들이 사는 세계였다. 새들은 각자 직장에 다니며 평범하게 살아가고 있었고, 큰 새와 작은 새가 섞여 있었다. 처음에는 땅이 약간 깃털 같은 모습으로 보였는데, 알고 보니 그 땅 자체가 영혼을 잃은 엄청나게 큰 고대의 새였다. 멀리서 보면 그 고대의 새가 하염없이 빙글빙글 돌고 있었고, 그 위에 새들이 모여 살아가고 있었다.",
        image: ""
    },
    {
        date: "2026.09.28",
        title: "거대한 파도와 수영장의 돌고래",
        content: "정승제 강사에게 수학을 배워 수능을 봤다. 수능을 마치고 돌아오는 길에 버스를 타고 평야를 지나가는데 멀리서 거대한 파도가 다가왔다. 튜브를 타고 파도를 향해 바로 가서 매우 높은 파도를 타고 수영장으로 들어갔다. 그 수영장에는 사람들이 키우는 돌고래들이 살고 있었고, 가끔 외부의 멍청하고 통제되지 않는 야생 돌고래가 들어오면 경비가 쫓아냈다.",
        image: ""
    },
    {
        date: "2026.09.30",
        title: "삼겹살집에서 정신없이 이어진 인계",
        content: "삼겹살집에서 신규 간호사에게 환자를 인계하는 상황이었다. 이름이 6글자인 일본인 환자가 있었는데, 요즘 들어 점점 피부가 까매지고 의욕도 없으며 힘도 잘 들어가지 않아 보호자에 의해 병원에 온 환자였다. 검사상 특별한 이상은 없었고 랩 수치도 괜찮았다. 처음에는 정신과적인 문제에 가까운 것 같았지만 신경과에 콜을 했고, 신경과에서는 중증근무력증 같다고 했다. 그래서 다음 날 검사를 진행한 후 입원시키려고 했다.\n\n그런데 내가 다른 환자들을 보느라 너무 바빠서 그 환자를 제대로 보지 못했다. 인계하기 전에 환자 정보를 찾아보려고 했는데 환자 이름이 길고 이상해서 이름을 제대로 입력하기도 어려웠다. 그때 환자가 갑자기 자기는 진료를 보지 않겠다고 하면서 거부했다. 겨우 설득해서 다시 자리로 데려갔는데, 내가 환자에게 말하는 방식이 조금 싸가지 없게 느껴졌는지 환자가 나를 싫어하는 것 같은 느낌도 들었다.\n\n그렇게 정신없이 상황을 정리한 뒤 다음 턴 신규 간호사에게 다시 인계를 하려고 했다. 그런데 이번에는 바코드가 제대로 되지 않아 바코드까지 고쳐야 했다. 정신없이 이것저것 처리하는 와중에 바로 앞에서는 누군가 아무렇지도 않게 삼겹살을 먹고 있었다. 전체적으로 환자를 보고, 다른 환자를 처리하고, 인계하고, 정보를 찾고, 바코드를 고치는 일이 계속 겹치면서 하루가 정신없이 흘러가는 꿈이었다.",
        image: "https://raw.githubusercontent.com/ikjoo123/ikjoo123.github.io/main/dream-2026-09-30.webp"
    }
];

async function loadDreams() {
    const response = await apiFetch("/api/dreams");

    if (!response.ok) {
        throw new Error("꿈 기록을 불러오지 못했습니다.");
    }

    const data = await response.json();
    dreams = Array.isArray(data.dreams) ? data.dreams : [];

    const missingInitialDreams = initialDreams.filter(function(initialDream) {
        return !dreams.some(function(dream) {
            return dream.date === initialDream.date &&
                   dream.title === initialDream.title;
        });
    });

    if (!isAdmin) {
        renderDreams();
        return;
    }

    for (let i = 0; i < missingInitialDreams.length; i++) {
        const initialDream = missingInitialDreams[i];

        const response = await apiFetch("/api/dreams", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(initialDream)
        });

        if (response.ok) {
            const data = await response.json();
            if (data.dream) dreams.push(data.dream);
        }
    }

    renderDreams();
}

function renderDreams() {
    const list = document.getElementById("dreamList");
    list.innerHTML = "";

    if (dreams.length === 0) {
        list.innerHTML =
            '<div class="empty">아직 기록된 꿈이 없습니다.<br><br>' +
            '기억하고 싶은 꿈이 생기면 기록해보세요 🌙</div>';
        return;
    }

    dreams.forEach(function(dream, index) {
        const card = document.createElement("div");
        card.className = "dreamCard";

        let imageHTML =
            '<div class="dreamImage">🌙 꿈 이미지</div>';

        if (dream.image) {
            imageHTML =
                '<div class="dreamImage">' +
                '<img src="' + escapeHTML(dream.image) + '" alt="꿈 이미지">' +
                '</div>';
        }

        card.innerHTML =
            imageHTML +
            '<div class="dreamContent">' +
            '<div class="dreamDate">' + escapeHTML(dream.date) + '</div>' +
            '<div class="dreamTitle">' + escapeHTML(dream.title) + '</div>' +
            '<div class="dreamPreview">' + escapeHTML(dream.content) + '</div>' +
            '</div>';

        card.onclick = function() {
            openDream(index);
        };

        list.appendChild(card);
    });
}

function showDreamForm() {
    if (!isAdmin) return;
    const form = document.getElementById("dreamForm");

    if (form.style.display === "none" || form.style.display === "") {
        form.style.display = "block";
    } else {
        form.style.display = "none";
    }
}

async function saveDream() {
    if (!isAdmin) return;

    const date = document.getElementById("dreamDate").value;
    const title = document.getElementById("dreamTitle").value.trim();
    const content = document.getElementById("dreamContent").value.trim();
    const imageInput = document.getElementById("dreamImage");
    const editingId = document.getElementById("editingDreamId").value;
    const removeImage = document.getElementById("removeDreamImage").checked;
    const existingDream = editingId
        ? dreams.find(function(d) { return d.id === editingId; })
        : null;

    if (!date) {
        alert("날짜를 입력해주세요.");
        return;
    }

    if (!title) {
        alert("꿈 제목을 입력해주세요.");
        return;
    }

    if (!content) {
        alert("꿈 내용을 입력해주세요.");
        return;
    }

    if (imageInput.files && imageInput.files[0]) {
        compressImage(imageInput.files[0], function(imageData) {
            saveDreamToR2(date, title, content, imageData, editingId);
        });
    } else {
        saveDreamToR2(
            date,
            title,
            content,
            removeImage ? "" : (existingDream ? existingDream.image || "" : ""),
            editingId
        );
    }
}
async function saveDreamToR2(date, title, content, image, editingId) {
    try {
        const response = await apiFetch("/api/dreams", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                id: editingId || "",
                date: date.replaceAll("-", "."),
                title: title,
                content: content,
                image: image
            })
        });

        if (!response.ok) {
            const data = await response.json().catch(function() { return {}; });
            throw new Error(data.error || "저장에 실패했습니다.");
        }

        const data = await response.json();

        if (data.dream) {
            const existingIndex = dreams.findIndex(function(d) {
                return d.id === data.dream.id;
            });
            if (existingIndex >= 0) {
                dreams[existingIndex] = data.dream;
            } else {
                dreams.unshift(data.dream);
            }
        }

        renderDreams();
        resetDreamForm();
        alert(editingId ? "꿈 기록이 수정되었습니다 🌙" : "꿈 기록이 R2에 저장되었습니다 🌙");
    } catch (error) {
        alert(error.message || "꿈 기록 저장에 실패했습니다.");
    }
}

function compressImage(file, callback) {
    const reader = new FileReader();

    reader.onload = function(event) {
        const img = new Image();

        img.onload = function() {
            const maxWidth = 1200;
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
                height = height * maxWidth / width;
                width = maxWidth;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            callback(canvas.toDataURL("image/jpeg", 0.8));
        };

        img.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

function resetDreamForm() {
    document.getElementById("editingDreamId").value = "";
    document.getElementById("dreamDate").value = "";
    document.getElementById("dreamTitle").value = "";
    document.getElementById("dreamContent").value = "";
    document.getElementById("dreamImage").value = "";
    document.getElementById("removeDreamImage").checked = false;
    document.getElementById("currentDreamImageBox").style.display = "none";
    document.querySelector("#dreamForm .saveButton").textContent = "저장";
    document.getElementById("dreamForm").style.display = "none";
}

function editDream(index) {
    if (!isAdmin) return;

    const dream = dreams[index];
    if (!dream) return;

    document.getElementById("editingDreamId").value = dream.id || "";
    document.getElementById("dreamDate").value = String(dream.date || "").replaceAll(".", "-");
    document.getElementById("dreamTitle").value = dream.title || "";
    document.getElementById("dreamContent").value = dream.content || "";
    document.getElementById("dreamImage").value = "";
    document.getElementById("removeDreamImage").checked = false;

    const imageBox = document.getElementById("currentDreamImageBox");
    imageBox.style.display = dream.image ? "block" : "none";

    document.querySelector("#dreamForm .saveButton").textContent = "수정 저장";
    document.getElementById("dreamForm").style.display = "block";
    document.getElementById("dreamForm").scrollIntoView({ behavior: "smooth", block: "center" });
}

function openDream(index) {
    const dream = dreams[index];
    const modal = document.createElement("div");
    modal.id = "dreamModal";
    modal.className = "dreamModal";

    let imageHTML = "";

    if (dream.image) {
        imageHTML =
            '<img src="' + escapeHTML(dream.image) + '" ' +
            'alt="꿈 이미지" class="modalImage">';
    }

    modal.innerHTML =
        '<div class="dreamModalBox">' +
        '<div class="modalDate">' + escapeHTML(dream.date) + '</div>' +
        '<div class="modalTitle">' + escapeHTML(dream.title) + '</div>' +
        imageHTML +
        '<div class="modalContent">' + escapeHTML(dream.content) + '</div>' +
        '<div class="modalButtons">' +
        (isAdmin ? '<button class="editButton" onclick="closeDream(); editDream(' + index + ')">수정</button>' : '') +
        (isAdmin ? '<button class="deleteButton" onclick="deleteDream(' + index + ')">삭제</button>' : '') +
        '<button class="closeButton" onclick="closeDream()">닫기</button>' +
        '</div>' +
        '</div>';

    modal.onclick = function(event) {
        if (event.target === modal) closeDream();
    };

    document.body.appendChild(modal);
}

function closeDream() {
    const modal = document.getElementById("dreamModal");
    if (modal) modal.remove();
}

async function deleteDream(index) {
    if (!isAdmin) return;
    if (!confirm("이 꿈 기록을 삭제할까요?")) return;

    const dream = dreams[index];

    if (!dream || !dream.id) {
        alert("삭제할 기록을 찾을 수 없습니다.");
        return;
    }

    try {
        const response = await apiFetch(
            "/api/dreams?id=" + encodeURIComponent(dream.id),
            { method: "DELETE" }
        );

        if (!response.ok) {
            const data = await response.json().catch(function() { return {}; });
            throw new Error(data.error || "삭제에 실패했습니다.");
        }

        dreams.splice(index, 1);
        closeDream();
        renderDreams();
    } catch (error) {
        alert(error.message || "삭제에 실패했습니다.");
    }
}

function escapeHTML(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function initializeDreamPage() {
    const response = await apiFetch("/api/me");
    if (!response.ok) throw new Error("인증 실패");
    const me = await response.json();
    isAdmin = me.role !== "guest";
    localStorage.setItem(ROLE_KEY, isAdmin ? "admin" : "guest");
    document.body.classList.toggle("guest", !isAdmin);
    const addButton = document.getElementById("addDreamButton");
    if (addButton) addButton.style.display = isAdmin ? "" : "none";
    const form = document.getElementById("dreamForm");
    if (form && !isAdmin) form.style.display = "none";
    await loadDreams();
}

initializeDreamPage().catch(function(error) {
    console.error(error);
    document.getElementById("dreamList").innerHTML =
        '<div class="empty">꿈 기록을 불러오지 못했습니다.<br><br>' +
        '업무 페이지에서 다시 로그인해주세요.</div>';
});

</script>
