
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>꿈 기록 - 익주</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f5f6f8;
    color: #222;
}

/* 상단 */

.header {

    height: 64px;

    background: white;

    border-bottom:
        1px solid #e5e7eb;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 24px;
}

.logo {

    font-size: 21px;

    font-weight: 700;

    cursor: pointer;
}

.back {

    border: 0;

    background: #f1f3f5;

    padding: 9px 14px;

    border-radius: 8px;

    cursor: pointer;
}

.back:hover {

    background: #e5e7eb;
}


/* 메인 */

.container {

    max-width: 1000px;

    margin: 0 auto;

    padding: 32px 20px;
}

.title {

    font-size: 28px;

    font-weight: 700;

    margin-bottom: 8px;
}

.subtitle {

    color: #777;

    margin-bottom: 28px;
}


/* 꿈 기록 */

.dreamList {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );

    gap: 20px;
}


.dreamCard {

    background: white;

    border:
        1px solid #eee;

    border-radius: 16px;

    overflow: hidden;

    cursor: pointer;

    transition: 0.2s;
}

.dreamCard:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.08);
}


/* 이미지 */

.dreamImage {

    width: 100%;

    height: 190px;

    background: #eef0f3;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #999;

    font-size: 14px;

    overflow: hidden;
}

.dreamImage img {

    width: 100%;

    height: 100%;

    object-fit: cover;
}


/* 내용 */

.dreamContent {

    padding: 20px;
}

.dreamDate {

    font-size: 13px;

    color: #999;

    margin-bottom: 7px;
}

.dreamTitle {

    font-size: 19px;

    font-weight: 700;

    margin-bottom: 10px;
}

.dreamPreview {

    color: #666;

    font-size: 14px;

    line-height: 1.6;

    display: -webkit-box;

    -webkit-line-clamp: 3;

    -webkit-box-orient: vertical;

    overflow: hidden;
}


/* 기록 없음 */

.empty {

    background: white;

    border:
        1px solid #eee;

    border-radius: 16px;

    padding: 60px 20px;

    text-align: center;

    color: #888;
}

</style>

</head>


<body>


<header class="header">

    <div
        class="logo"
        onclick="location.href='index.html'"
    >
        꿈 기록
    </div>


    <button
        class="back"
        onclick="location.href='hobby.html'"
    >
        ← 취미
    </button>

</header>



<main class="container">


    <div class="title">
        🌙 꿈 기록
    </div>


    <div class="subtitle">
        기억하고 싶은 꿈을 기록하는 공간
    </div>



    <div
        id="dreamList"
        class="dreamList"
    >

        <!--
        꿈 기록은
        나중에 여기에 자동으로 추가됩니다.
        -->

    </div>


</main>



<script>

/*
 * 꿈 기록 데이터
 *
 * 나중에 내가 홈페이지에
 * 꿈을 올릴 때 사용하는 구조
 */

const dreams = [

    /*
    예시:

    {
        date: "2026.09.28",

        title:
            "거대한 파도와 수영장",

        content:
            "정승제 강사에게 수학을 배우고 수능을 본 뒤 버스를 타고 평야를 지나가는데 거대한 파도가 다가왔다.",

        image:
            ""
    }

    */

];



function renderDreams() {

    const list =
        document.getElementById(
            "dreamList"
        );


    list.innerHTML = "";


    if (
        dreams.length === 0
    ) {

        list.innerHTML =

            '<div class="empty">' +

            '아직 기록된 꿈이 없습니다.<br><br>' +

            '기억하고 싶은 꿈이 생기면 기록해보세요 🌙' +

            '</div>';

        return;
    }



    dreams.forEach(
        function(dream) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "dreamCard";


            let imageHTML =

                '<div class="dreamImage">' +

                '🌙 꿈 이미지' +

                '</div>';


            if (
                dream.image
            ) {

                imageHTML =

                    '<div class="dreamImage">' +

                    '<img src="' +

                    dream.image +

                    '" alt="꿈 이미지">' +

                    '</div>';
            }



            card.innerHTML =

                imageHTML +

                '<div class="dreamContent">' +

                '<div class="dreamDate">' +

                dream.date +

                '</div>' +

                '<div class="dreamTitle">' +

                dream.title +

                '</div>' +

                '<div class="dreamPreview">' +

                dream.content +

                '</div>' +

                '</div>';


            list.appendChild(
                card
            );

        }
    );
}



renderDreams();

</script>


</body>
</html>
