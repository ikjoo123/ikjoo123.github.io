<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JUWAVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f5f6f8;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: white;
      border-radius: 18px;
      padding: 35px 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    .login-logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #777;
    }

    .login-button {
      width: 100%;
      border: 0;
      background: #222;
      color: white;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-button:hover {
      opacity: 0.9;
    }

    #loginMessage {
      text-align: center;
      color: #d33;
      font-size: 13px;
      min-height: 20px;
      margin-top: 12px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logout-button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .top-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .top-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .usage {
      color: #777;
      font-size: 14px;
    }

    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .toolbar button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #f3f3f3;
    }

    /* =========================
       BREADCRUMB
    ========================= */

    .breadcrumb {
      background: white;
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 15px;
      font-size: 14px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .breadcrumb span {
      cursor: pointer;
      color: #555;
    }

    .breadcrumb span:hover {
      text-decoration: underline;
    }

    /* =========================
       DROP AREA
    ========================= */

    .drop-area {
      background: white;
      border: 2px dashed #ccc;
      border-radius: 16px;
      padding: 35px 20px;
      text-align: center;
      margin-bottom: 20px;
      transition: 0.2s;
    }

    .drop-area.dragover {
      border-color: #222;
      background: #fafafa;
    }

    .drop-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .drop-text {
      color: #666;
      margin-bottom: 15px;
    }

    .select-button {
      display: inline-block;
      background: #222;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    #fileInput {
      display: none;
    }

    /* =========================
       FILE LIST
    ========================= */

    .file-list {
      background: white;
      border-radius: 16px;
      overflow: hidden;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 18px;
      border-bottom: 1px solid #eee;
    }

    .file-row:last-child {
      border-bottom: 0;
    }

    .file-icon {
      width: 35px;
      text-align: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      color: #999;
      font-size: 12px;
      margin-top: 4px;
    }

    .file-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .file-actions button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 7px;
      padding: 7px 10px;
      cursor: pointer;
    }

    .file-actions button:hover {
      background: #f3f3f3;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 50px 20px;
    }

    /* =========================
       PAGINATION
    ========================= */

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
    }

    .pagination button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      padding: 8px 13px;
      cursor: pointer;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #pageInfo {
      font-size: 14px;
      color: #666;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.75);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .file-row {
        padding: 13px;
      }

      .file-actions button {
        padding: 6px 8px;
      }

      .file-actions .download-text,
      .file-actions .delete-text {
        display: none;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

  <div class="login-box">

    <div class="login-logo">
      JUWAVE
    </div>

    <div class="login-subtitle">
      Private File Storage
    </div>

    <input
      id="username"
      type="text"
      placeholder="아이디"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="비밀번호"
      autocomplete="current-password"
    >

    <button
      class="login-button"
      onclick="login()"
    >
      로그인
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

  <header>

    <div class="logo">
      JUWAVE
    </div>

    <button
      class="logout-button"
      onclick="logout()"
    >
      로그아웃
    </button>

  </header>


  <div class="container">

    <div class="top-card">

      <div class="top-title">
        📁 파일 보관함
      </div>

      <div class="usage">
        저장공간 한도: 9GB
      </div>

    </div>


    <!-- BREADCRUMB -->

    <div
      id="breadcrumb"
      class="breadcrumb"
    ></div>


    <!-- TOOLBAR -->

    <div class="toolbar">

      <button onclick="goUp()">
        ⬅️ 상위 폴더
      </button>

      <button onclick="createFolder()">
        📁 새 폴더
      </button>

    </div>


    <!-- DROP -->

    <div
      id="dropArea"
      class="drop-area"
    >

      <div class="drop-icon">
        📤
      </div>

      <div class="drop-text">
        파일을 이곳에 끌어놓거나 선택하세요
      </div>

      <label
        class="select-button"
        for="fileInput"
      >
        파일 선택
      </label>

      <input
        id="fileInput"
        type="file"
        multiple
      >

    </div>


    <!-- FILE LIST -->

    <div
      id="fileList"
      class="file-list"
    ></div>


    <!-- PAGINATION -->

    <div class="pagination">

      <button
        id="prevButton"
        onclick="previousPage()"
      >
        ← 이전
      </button>

      <span id="pageInfo">
        1 / 1
      </span>

      <button
        id="nextButton"
        onclick="nextPage()"
      >
        다음 →
      </button>

    </div>

  </div>

</div>


<!-- LOADING -->

<div id="loading">
  처리 중...
</div>


<script>

const API =
  "https://ikjoo123-github-io.zjaghkf0000.workers.dev";

const PAGE_SIZE = 30;

let currentPrefix = "";
let currentFolders = [];
let currentFiles = [];
let currentPage = 1;


/* =========================
   공통 fetch
========================= */

async function apiFetch(path, options = {}) {

  options.credentials = "include";

  const response =
    await fetch(API + path, options);

  if (response.status === 401) {

    showLogin();

    throw new Error("로그인이 필요합니다.");

  }

  return response;

}


/* =========================
   로딩
========================= */

function showLoading(show) {

  document.getElementById("loading").style.display =
    show ? "flex" : "none";

}


/* =========================
   LOGIN CHECK
========================= */

async function checkLogin() {

  try {

    const response =
      await fetch(
        API + "/api/me",
        {
          credentials: "include"
        }
      );

    if (response.ok) {

      showApp();

      loadFiles();

    } else {

      showLogin();

    }

  } catch {

    showLogin();

  }

}


/* =========================
   LOGIN
========================= */

async function login() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "";

  if (!username || !password) {

    message.textContent =
      "아이디와 비밀번호를 입력하세요.";

    return;

  }

  showLoading(true);

  try {

    const response =
      await fetch(
        API + "/api/login",
        {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username,
            password
          })
        }
      );

    if (!response.ok) {

      const data =
        await response.json().catch(() => ({}));

      message.textContent =
        data.error ||
        "로그인에 실패했습니다.";

      return;

    }

    document.getElementById("password").value = "";

    showApp();

    await loadFiles();

  } catch (error) {

    message.textContent =
      "서버에 연결할 수 없습니다.";

  } finally {

    showLoading(false);

  }

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  if (!confirm("로그아웃하시겠습니까?")) {
    return;
  }

  try {

    await fetch(
      API + "/api/logout",
      {
        method: "POST",
        credentials: "include"
      }
    );

  } finally {

    showLogin();

  }

}


/* =========================
   화면 전환
========================= */

function showLogin() {

  document.getElementById("loginScreen").style.display =
    "flex";

  document.getElementById("app").style.display =
    "none";

}


function showApp() {

  document.getElementById("loginScreen").style.display =
    "none";

  document.getElementById("app").style.display =
    "block";

}


/* =========================
   FILE LOAD
========================= */

async function loadFiles() {

  showLoading(true);

  try {

    const response =
      await apiFetch(
        "/api/files?prefix=" +
        encodeURIComponent(currentPrefix)
      );

    const data =
      await response.json();

    currentFolders =
      data.folders || [];

    currentFiles =
      data.files || [];

    currentPage = 1;

    renderBreadcrumb();

    renderFiles();

  } catch (error) {

    if (error.message !== "로그인이 필요합니다.") {

      alert(
        "파일 목록을 불러오지 못했습니다."
      );

    }

  } finally {

    showLoading(false);

  }

}


/* =========================
   BREADCRUMB
========================= */

function renderBreadcrumb() {

  const breadcrumb =
    document.getElementById("breadcrumb");

  breadcrumb.innerHTML = "";

  const home =
    document.createElement("span");

  home.textContent = "🏠 홈";

  home.onclick = () => {

    currentPrefix = "";

    loadFiles();

  };

  breadcrumb.appendChild(home);


  if (!currentPrefix) {
    return;
  }


  const parts =
    currentPrefix
      .split("/")
      .filter(Boolean);

  let prefix = "";

  parts.forEach((part) => {

    prefix += part + "/";

    const separator =
      document.createTextNode("  /  ");

    breadcrumb.appendChild(separator);

    const span =
      document.createElement("span");

    span.textContent = "📁 " + part;

    const targetPrefix = prefix;

    span.onclick = () => {

      currentPrefix = targetPrefix;

      loadFiles();

    };

    breadcrumb.appendChild(span);

  });

}


/* =========================
   FILE RENDER
========================= */

function renderFiles() {

  const list =
    document.getElementById("fileList");

  list.innerHTML = "";


  /* 폴더 */

  currentFolders.forEach((folder) => {

    const row =
      document.createElement("div");

    row.className = "file-row";

    row.innerHTML = `
      <div class="file-icon">📁</div>

      <div class="file-info">
        <div class="file-name"></div>
      </div>

      <div class="file-actions">

        <button class="open-folder">
          열기
        </button>

        <button class="delete-folder">
          삭제
        </button>

      </div>
    `;

    row.querySelector(".file-name").textContent =
      folder.name;

    row.querySelector(".open-folder").onclick =
      () => {

        currentPrefix =
          folder.prefix;

        loadFiles();

      };


    row.querySelector(".delete-folder").onclick =
      () => {

        deleteFolder(folder.prefix);

      };


    list.appendChild(row);

  });


  /* 파일 */

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        currentFiles.length / PAGE_SIZE
      )
    );

  if (currentPage > totalPages) {
    currentPage = totalPages;
  }

  const start =
    (currentPage - 1) * PAGE_SIZE;

  const end =
    start + PAGE_SIZE;

  const visibleFiles =
    currentFiles.slice(start, end);


  visibleFiles.forEach((file) => {

    const row =
      document.createElement("div");

    row.className = "file-row";

    row.innerHTML = `
      <div class="file-icon">📄</div>

      <div class="file-info">

        <div class="file-name"></div>

        <div class="file-size"></div>

      </div>

      <div class="file-actions">

        <button class="download-button">
          <span class="download-text">
            다운로드
          </span>
          ↓
        </button>

        <button class="delete-button">
          <span class="delete-text">
            삭제
          </span>
          🗑️
        </button>

      </div>
    `;

    row.querySelector(".file-name").textContent =
      file.name;

    row.querySelector(".file-size").textContent =
      formatSize(file.size);


    row.querySelector(".download-button").onclick =
      () => downloadFile(file);


    row.querySelector(".delete-button").onclick =
      () => deleteFile(file.key);


    list.appendChild(row);

  });


  if (
    currentFolders.length === 0 &&
    currentFiles.length === 0
  ) {

    list.innerHTML = `
      <div class="empty">
        저장된 파일이 없습니다.
      </div>
    `;

  }


  document.getElementById("pageInfo").textContent =
    `${currentPage} / ${totalPages}`;

  document.getElementById("prevButton").disabled =
    currentPage <= 1;

  document.getElementById("nextButton").disabled =
    currentPage >= totalPages;

}


/* =========================
   PAGINATION
========================= */

function previousPage() {

  if (currentPage > 1) {

    currentPage--;

    renderFiles();

  }

}


function nextPage() {

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        currentFiles.length / PAGE_SIZE
      )
    );

  if (currentPage < totalPages) {

    currentPage++;

    renderFiles();

  }

}


/* =========================
   FORMAT SIZE
========================= */

function formatSize(bytes) {

  if (!bytes) {
    return "0 B";
  }

  const units =
    ["B", "KB", "MB", "GB"];

  let size = bytes;
  let index = 0;

  while (
    size >= 1024 &&
    index < units.length - 1
  ) {

    size /= 1024;
    index++;

  }

  return (
    size < 10 && index > 0
      ? size.toFixed(1)
      : Math.round(size)
  ) + " " + units[index];

}


/* =========================
   GO UP
========================= */

function goUp() {

  if (!currentPrefix) {
    return;
  }

  const parts =
    currentPrefix
      .split("/")
      .filter(Boolean);

  parts.pop();

  currentPrefix =
    parts.length
      ? parts.join("/") + "/"
      : "";

  loadFiles();

}


/* =========================
   CREATE FOLDER
========================= */

async function createFolder() {

  const name =
    prompt("새 폴더 이름을 입력하세요.");

  if (!name) {
    return;
  }

  showLoading(true);

  try {

    const response =
      await apiFetch(
        "/api/folder",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            parent: currentPrefix,
            name
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      alert(
        data.error ||
        "폴더 생성에 실패했습니다."
      );

      return;

    }

    await loadFiles();

  } catch (error) {

    if (error.message !== "로그인이 필요합니다.") {
      alert("폴더 생성에 실패했습니다.");
    }

  } finally {

    showLoading(false);

  }

}


/* =========================
   DELETE FILE
========================= */

async function deleteFile(key) {

  if (
    !confirm(
      "이 파일을 삭제하시겠습니까?\n\n삭제 후 복구할 수 없습니다."
    )
  ) {
    return;
  }

  showLoading(true);

  try {

    const response =
      await apiFetch(
        "/api/file?key=" +
        encodeURIComponent(key),
        {
          method: "DELETE"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      alert(
        data.error ||
        "파일 삭제에 실패했습니다."
      );

      return;

    }

    await loadFiles();

  } catch (error) {

    if (error.message !== "로그인이 필요합니다.") {
      alert("파일 삭제에 실패했습니다.");
    }

  } finally {

    showLoading(false);

  }

}


/* =========================
   DELETE FOLDER
========================= */

async function deleteFolder(prefix) {

  if (
    !confirm(
      "이 폴더와 안에 있는 모든 파일을 삭제하시겠습니까?\n\n삭제 후 복구할 수 없습니다."
    )
  ) {
    return;
  }

  showLoading(true);

  try {

    const response =
      await apiFetch(
        "/api/folder?prefix=" +
        encodeURIComponent(prefix),
        {
          method: "DELETE"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      alert(
        data.error ||
        "폴더 삭제에 실패했습니다."
      );

      return;

    }

    await loadFiles();

  } catch (error) {

    if (error.message !== "로그인이 필요합니다.") {
      alert("폴더 삭제에 실패했습니다.");
    }

  } finally {

    showLoading(false);

  }

}


/* =========================
   DOWNLOAD
========================= */

async function downloadFile(file) {

  showLoading(true);

  try {

    const response =
      await apiFetch(
        "/api/download?key=" +
        encodeURIComponent(file.key)
      );

    if (!response.ok) {

      const data =
        await response.json().catch(() => ({}));

      alert(
        data.error ||
        "다운로드에 실패했습니다."
      );

      return;

    }

    const blob =
      await response.blob();

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;

    a.download = file.name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

  } catch (error) {

    if (error.message !== "로그인이 필요합니다.") {
      alert("다운로드에 실패했습니다.");
    }

  } finally {

    showLoading(false);

  }

}


/* =========================
   UPLOAD
========================= */

async function uploadFiles(files) {

  for (const file of files) {

    /*
      100MB 이상이면 사용자 확인
    */

    let confirmedLarge = false;

    if (
      file.size >=
      100 * 1024 * 1024
    ) {

      const sizeText =
        formatSize(file.size);

      confirmedLarge =
        confirm(
          `${file.name}\n\n` +
          `파일 크기: ${sizeText}\n\n` +
          `100MB 이상 파일입니다.\n` +
          `정말 업로드하시겠습니까?`
        );

      if (!confirmedLarge) {
        continue;
      }

    }


    const formData =
      new FormData();

    formData.append(
      "file",
      file
    );

    formData.append(
      "folder",
      currentPrefix
    );

    formData.append(
      "confirmedLarge",
      confirmedLarge
        ? "true"
        : "false"
    );


    showLoading(true);

    try {

      const response =
        await apiFetch(
          "/api/upload",
          {
            method: "POST",
            body: formData
          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        alert(
          `${file.name}\n\n` +
          (
            data.error ||
            "업로드에 실패했습니다."
          )
        );

        continue;

      }

    } catch (error) {

      if (
        error.message !==
        "로그인이 필요합니다."
      ) {

        alert(
          `${file.name}\n\n업로드에 실패했습니다.`
        );

      }

    } finally {

      showLoading(false);

    }

  }

  await loadFiles();

}


/* =========================
   FILE INPUT
========================= */

document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    function() {

      if (this.files.length) {

        uploadFiles(
          Array.from(this.files)
        );

      }

      this.value = "";

    }
  );


/* =========================
   DRAG & DROP
========================= */

const dropArea =
  document.getElementById("dropArea");


dropArea.addEventListener(
  "dragover",
  (event) => {

    event.preventDefault();

    dropArea.classList.add(
      "dragover"
    );

  }
);


dropArea.addEventListener(
  "dragleave",
  () => {

    dropArea.classList.remove(
      "dragover"
    );

  }
);


dropArea.addEventListener(
  "drop",
  (event) => {

    event.preventDefault();

    dropArea.classList.remove(
      "dragover"
    );

    const files =
      Array.from(
        event.dataTransfer.files
      );

    if (files.length) {

      uploadFiles(files);

    }

  }
);


/* =========================
   ENTER LOGIN
========================= */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    (event) => {

      if (event.key === "Enter") {

        login();

      }

    }
  );


/* =========================
   START
========================= */

checkLogin();
