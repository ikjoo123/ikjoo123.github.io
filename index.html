<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익주의 공간</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         sans-serif;
            background: #f7f7f5;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 50px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .card p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>👋 익주의 공간</h1>

    <p class="subtitle">
        나만의 개인 홈페이지
    </p>

    <div class="cards">

        <a class="card" href="#">
            <div class="icon">📁</div>
            <h2>파일 보관함</h2>
            <p>Excel · PowerPoint · PDF</p>
        </a>

        <a class="card" href="#">
            <div class="icon">📝</div>
            <h2>Notes</h2>
            <p>메모와 기록</p>
        </a>

        <a class="card" href="#">
            <div class="icon">🔗</div>
            <h2>Links</h2>
            <p>자주 사용하는 사이트</p>
        </a>

        <a class="card" href="#">
            <div class="icon">📌</div>
            <h2>Projects</h2>
            <p>진행 중인 프로젝트</p>
        </a>

    </div>

</div>

</body>
</html>
