<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>익주</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

      background: #f4f5f7;

      color: #222;
    }


    button,
    input,
    textarea {
      font: inherit;
    }


    /* =========================
       로그인
    ========================= */

    #loginScreen {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;
    }


    .loginBox {

      width: 100%;

      max-width: 360px;

      background: white;

      padding: 30px;

      border-radius: 14px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,0.08);
    }


    .loginBox h1 {

      text-align: center;

      margin-top: 0;

      margin-bottom: 25px;
    }


    .loginBox input {

      width: 100%;

      padding: 13px;

      border:
        1px solid #ddd;

      border-radius: 8px;

      margin-bottom: 10px;
    }


    .loginBox button {

      width: 100%;

      padding: 13px;

      border: 0;

      border-radius: 8px;

      background: #222;

      color: white;

      cursor: pointer;
    }


    #loginMessage {

      margin-top: 12px;

      text-align: center;

      color: #d33;

      font-size: 14px;
    }


    /* =========================
       앱
    ========================= */

    #app {
      display: none;

      min-height: 100vh;
    }


    .header {

      height: 60px;

      background: white;

      border-bottom:
        1px solid #ddd;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        0 20px;
    }


    .headerTitle {

      font-weight: bold;

      font-size: 18px;
    }


    .headerRight {

      display: flex;

      align-items: center;

      gap: 10px;
    }


    .headerRight button {

      border:
        1px solid #ddd;

      background: white;

      padding:
        7px 12px;

      border-radius: 7px;

      cursor: pointer;
    }


    .container {

      max-width: 1100px;

      margin: 0 auto;

      padding: 20px;
    }


    /* =========================
       탭
    ========================= */

    .tabs {

      display: flex;

      gap: 5px;

      margin-bottom: 15px;
    }


    .tabButton {

      border: 0;

      background: #ddd;

      padding:
        11px 22px;

      border-radius:
        9px 9px 0 0;

      cursor: pointer;

      font-weight: bold;

      color: #555;
    }


    .tabButton.active {

      background: white;

      color: #222;

      box-shadow:
        0 -1px 5px
        rgba(0,0,0,0.04);
    }


    .tabContent {

      display: none;
    }


    .tabContent.active {

      display: block;
    }


    /* =========================
       파일 영역
    ========================= */

    .toolbar {

      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      margin-bottom: 15px;
    }


    .toolbar button {

      border:
        1px solid #ddd;

      background: white;

      padding:
        9px 13px;

      border-radius: 8px;

      cursor: pointer;
    }


    .breadcrumb {

      background: white;

      border:
        1px solid #ddd;

      border-radius: 8px;

      padding: 12px;

      margin-bottom: 15px;

      white-space: nowrap;

      overflow-x: auto;
    }


    .breadcrumb span {

      cursor: pointer;
    }


    .dropZone {

      border:
        2px dashed #bbb;

      border-radius: 10px;

      padding: 25px;

      text-align: center;

      background: white;

      margin-bottom: 15px;

      cursor: pointer;
    }


    .dropZone.dragover {

      background: #f0f4ff;

      border-color: #557;
    }


    #fileInput {

      display: none;
    }


    .fileList {

      background: white;

      border:
        1px solid #ddd;

      border-radius: 10px;

      overflow: hidden;
    }


    .fileRow {

      display: grid;

      grid-template-columns:
        1fr auto auto;

      gap: 10px;

      align-items: center;

      padding:
        12px 15px;

      border-bottom:
        1px solid #eee;
    }


    .fileRow:last-child {

      border-bottom: 0;
    }


    .fileName {

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    .folderRow {

      cursor: pointer;

      transition:
        background 0.15s;
    }


    .folderRow:hover {

      background: #f8f8f8;
    }


    .folderRow.dragTarget {

      background: #eaf0ff;

      outline:
        2px dashed #557;

      outline-offset: -2px;
    }


    .fileRow.dragging {

      opacity: 0.45;
    }


    .fileButtons {

      display: flex;

      gap: 5px;
    }


    .fileButtons button {

      border:
        1px solid #ddd;

      background: white;

      border-radius: 6px;

      padding:
        5px 9px;

      cursor: pointer;
    }


    .deleteBtn {

      color: #d22;
    }


    .moveBtn {

      color: #2455aa;
    }


    .empty {

      padding: 40px;

      text-align: center;

      color: #888;
    }


    .pagination {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      margin-top: 20px;
    }


    .pagination button {

      border:
        1px solid #ddd;

      background: white;

      border-radius: 6px;

      padding:
        7px 12px;

      cursor: pointer;
    }


    .pagination button:disabled {

      opacity: 0.4;
    }


    .storage {

      margin-top: 12px;

      color: #777;

      font-size: 13px;
    }


    /* =========================
       메모
    ========================= */

    .memoBox {

      background: white;

      border:
        1px solid #ddd;

      border-radius: 12px;

      padding: 18px;

      margin-bottom: 18px;
    }


    .memoTitle {

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 12px;
    }


    .memoInput {

      width: 100%;

      min-height: 140px;

      resize: vertical;

      border:
        1px solid #ddd;

      border-radius: 9px;

      padding: 13px;

      line-height: 1.6;

      outline: none;
    }


    .memoInput:focus {

      border-color: #999;
    }


    .memoAddArea {

      display: flex;

      justify-content:
        flex-end;

      margin-top: 10px;
    }


    .memoAddButton {

      border: 0;

      background: #222;

      color: white;

      padding:
        9px 18px;

      border-radius: 8px;

      cursor: pointer;
    }


    .memoList {

      display: flex;

      flex-direction: column;

      gap: 12px;
    }


    .memoCard {

      position: relative;

      background: #fffde7;

      border:
        1px solid #eee4a8;

      border-radius: 10px;

      padding: 18px 45px 18px 18px;

      box-shadow:
        0 3px 8px
        rgba(0,0,0,0.04);

      white-space: pre-wrap;

      word-break: break-word;

      line-height: 1.65;
    }


    .memoDate {

      color: #999;

      font-size: 12px;

      margin-bottom: 8px;
    }


    .memoText {

      font-size: 15px;
    }


    .memoDelete {

      position: absolute;

      right: 10px;

      top: 10px;

      border: 0;

      background: transparent;

      color: #999;

      font-size: 18px;

      cursor: pointer;
    }


    .memoDelete:hover {

      color: #d33;
    }


    .memoEmpty {

      background: white;

      border:
        1px solid #ddd;

      border-radius: 10px;

      padding: 45px;

      text-align: center;

      color: #999;
    }


    @media (
      max-width: 600px
    ) {

      .fileRow {

        grid-template-columns:
          1fr;
      }

      .fileButtons {

        justify-content:
          flex-end;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     로그인
========================= -->

<div id="loginScreen">

  <div class="loginBox">

    <h1>익주</h1>

    <input
      id="username"
      type="text"
      placeholder="아이디"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="비밀번호"
      autocomplete="current-password"
    >

    <button id="loginButton">
      로그인
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- =========================
     앱
========================= -->

<div id="app">


  <div class="header">

    <div class="headerTitle">
      익주
    </div>

    <div class="headerRight">

      <span
        id="usernameDisplay"
      ></span>

      <button
        onclick="logout()"
      >
        로그아웃
      </button>

    </div>

  </div>


  <div class="container">


    <!-- =====================
         탭
    ====================== -->

    <div class="tabs">

      <button
        id="fileTabButton"
        class="tabButton active"
        onclick="showTab('files')"
      >
        📁 파일
      </button>

      <button
        id="memoTabButton"
        class="tabButton"
        onclick="showTab('memos')"
      >
        📝 메모
      </button>

    </div>


    <!-- =====================
         파일 탭
    ====================== -->

    <div
      id="filesTab"
      class="tabContent active"
    >


      <div class="toolbar">

        <button
          onclick="createFolder()"
        >
          + 폴더 만들기
        </button>

        <button
          onclick="
            document
              .getElementById('fileInput')
              .click()
          "
        >
          + 파일 업로드
        </button>

      </div>


      <div
        id="breadcrumb"
        class="breadcrumb"
      ></div>


      <div
        id="dropZone"
        class="dropZone"
      >
        파일을 여기에 끌어다 놓으세요
        <br>
        또는 클릭해서 파일 선택
      </div>


      <input
        id="fileInput"
        type="file"
        multiple
      >


      <div
        id="fileList"
        class="fileList"
      ></div>


      <div
        id="pagination"
        class="pagination"
      ></div>


      <div
        id="storage"
        class="storage"
      ></div>


    </div>


    <!-- =====================
         메모 탭
    ====================== -->

    <div
      id="memosTab"
      class="tabContent"
    >


      <div class="memoBox">

        <div class="memoTitle">
          📝 새 메모
        </div>


        <textarea
          id="memoInput"
          class="memoInput"
          placeholder="인수인계 받은 내용이나 기억해둘 내용을 자유롭게 적어주세요."
        ></textarea>


        <div class="memoAddArea">

          <button
            class="memoAddButton"
            onclick="addMemo()"
          >
            메모 추가
          </button>

        </div>

      </div>


      <div
        id="memoList"
        class="memoList"
      ></div>


    </div>


  </div>

</div>


<script>


/* =========================
   기본 설정
========================= */

const API =
  "https://ikjoo123-github-io.zjaghkf0000.workers.dev";

const TOKEN_KEY =
  "ju_files_token";

const PAGE_SIZE =
  30;


let currentFolder = "";

let currentPage = 1;

let allFiles = [];

let allFolders = [];

let draggedFileKey =
  null;


/* =========================
   인증
========================= */

function getToken() {

  return localStorage.getItem(
    TOKEN_KEY
  );

}


function authHeaders() {

  const token =
    getToken();

  return token
    ? {
        Authorization:
          "Bearer " + token
      }
    : {};
}


async function apiFetch(
  url,
  options = {}
) {

  options.headers = {

    ...(options.headers || {}),

    ...authHeaders()

  };


  const response =
    await fetch(
      url,
      options
    );


  if (
    response.status === 401
  ) {

    localStorage.removeItem(
      TOKEN_KEY
    );

    showLogin();

    throw new Error(
      "로그인이 필요합니다."
    );

  }


  return response;

}


/* =========================
   로그인
========================= */

document
  .getElementById(
    "loginButton"
  )
  .addEventListener(
    "click",
    login
  );


document
  .getElementById(
    "password"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        login();

      }

    }
  );


async function login() {

  const username =
    document
      .getElementById(
        "username"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "password"
      )
      .value;


  const message =
    document
      .getElementById(
        "loginMessage"
      );


  if (
    !username ||
    !password
  ) {

    message.textContent =
      "아이디와 비밀번호를 입력해주세요.";

    return;

  }


  try {

    const response =
      await fetch(
        `${API}/api/login`,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              username,
              password
            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok
    ) {

      message.textContent =
        data.error ||
        "로그인에 실패했습니다.";

      return;

    }


    localStorage.setItem(
      TOKEN_KEY,
      data.token
    );


    document
      .getElementById(
        "usernameDisplay"
      )
      .textContent =
        data.username;


    showApp();


    await loadFiles();


  } catch {

    message.textContent =
      "서버에 연결할 수 없습니다.";

  }

}


/* =========================
   화면
========================= */

function showLogin() {

  document
    .getElementById(
      "loginScreen"
    )
    .style.display =
      "flex";


  document
    .getElementById(
      "app"
    )
    .style.display =
      "none";

}


function showApp() {

  document
    .getElementById(
      "loginScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "app"
    )
    .style.display =
      "block";

}


/* =========================
   탭
========================= */

function showTab(
  tab
) {

  const filesTab =
    document.getElementById(
      "filesTab"
    );

  const memosTab =
    document.getElementById(
      "memosTab"
    );

  const fileButton =
    document.getElementById(
      "fileTabButton"
    );

  const memoButton =
    document.getElementById(
      "memoTabButton"
    );


  filesTab.classList.remove(
    "active"
  );

  memosTab.classList.remove(
    "active"
  );

  fileButton.classList.remove(
    "active"
  );

  memoButton.classList.remove(
    "active"
  );


  if (
    tab === "memos"
  ) {

    memosTab.classList.add(
      "active"
    );

    memoButton.classList.add(
      "active"
    );


    loadMemos();

  } else {

    filesTab.classList.add(
      "active"
    );

    fileButton.classList.add(
      "active"
    );

  }

}


/* =========================
   로그인 확인
========================= */

async function checkLogin() {

  const token =
    getToken();


  if (!token) {

    showLogin();

    return;

  }


  try {

    const response =
      await apiFetch(
        `${API}/api/me`
      );


    if (
      !response.ok
    ) {

      showLogin();

      return;

    }


    const data =
      await response.json();


    document
      .getElementById(
        "usernameDisplay"
      )
      .textContent =
        data.user;


    showApp();


    await loadFiles();


  } catch {

    showLogin();

  }

}


/* =========================
   로그아웃
========================= */

function logout() {

  localStorage.removeItem(
    TOKEN_KEY
  );

  currentFolder = "";

  currentPage = 1;

  showLogin();

}


/* =========================
   파일 목록
========================= */

async function loadFiles() {

  try {

    const response =
      await apiFetch(
        `${API}/api/files?prefix=${encodeURIComponent(
          currentFolder
        )}`
      );


    const data =
      await response.json();


    if (
      !response.ok
    ) {

      alert(
        data.error ||
        "파일 목록을 불러오지 못했습니다."
      );

      return;

    }


    allFiles =
      data.files || [];

    allFolders =
      data.folders || [];

    currentPage = 1;


    renderBreadcrumb();

    renderFiles();

    loadUsage();


  } catch (error) {

    console.error(error);

  }

}


/* =========================
   경로
========================= */

function renderBreadcrumb() {

  const element =
    document.getElementById(
      "breadcrumb"
    );


  element.innerHTML = "";


  const home =
    document.createElement(
      "span"
    );


  home.textContent =
    "홈";


  home.onclick =
    () => openFolder("");


  element.appendChild(
    home
  );


  if (
    !currentFolder
  ) {
    return;
  }


  const parts =
    currentFolder
      .replace(
        /\/$/,
        ""
      )
      .split("/");


  let path = "";


  parts.forEach(
    part => {

      element.appendChild(
        document.createTextNode(
          " / "
        )
      );


      path +=
        part + "/";


      const item =
        document.createElement(
          "span"
        );


      item.textContent =
        part;


      const target =
        path;


      item.onclick =
        () =>
          openFolder(
            target
          );


      element.appendChild(
        item
      );

    }
  );

}


function openFolder(
  folder
) {

  currentFolder =
    folder;

  currentPage = 1;

  loadFiles();

}


/* =========================
   파일 표시
========================= */

function renderFiles() {

  const list =
    document.getElementById(
      "fileList"
    );


  list.innerHTML = "";


  /*
   * 폴더
   */

  allFolders.forEach(
    folder => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "fileRow folderRow";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "fileName";


      name.textContent =
        "📁 " +
        folder.name;


      const empty =
        document.createElement(
          "div"
        );


      const buttons =
        document.createElement(
          "div"
        );


      buttons.className =
        "fileButtons";


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.textContent =
        "삭제";


      deleteButton.className =
        "deleteBtn";


      deleteButton.onclick =
        event => {

          event.stopPropagation();

          deleteFolder(
            folder.prefix
          );

        };


      buttons.appendChild(
        deleteButton
      );


      row.appendChild(
        name
      );

      row.appendChild(
        empty
      );

      row.appendChild(
        buttons
      );


      row.onclick =
        () =>
          openFolder(
            folder.prefix
          );


      /*
       * 파일을 폴더로 드래그
       */

      row.addEventListener(
        "dragover",
        event => {

          if (
            !draggedFileKey
          ) {
            return;
          }

          event.preventDefault();

          event.stopPropagation();

          row.classList.add(
            "dragTarget"
          );

          event.dataTransfer.dropEffect =
            "move";

        }
      );


      row.addEventListener(
        "dragleave",
        event => {

          if (
            !row.contains(
              event.relatedTarget
            )
          ) {

            row.classList.remove(
              "dragTarget"
            );

          }

        }
      );


      row.addEventListener(
        "drop",
        async event => {

          event.preventDefault();

          event.stopPropagation();


          row.classList.remove(
            "dragTarget"
          );


          if (
            !draggedFileKey
          ) {
            return;
          }


          const key =
            draggedFileKey;


          draggedFileKey =
            null;


          await moveFileToFolder(
            key,
            folder.prefix
          );

        }
      );


      list.appendChild(
        row
      );

    }
  );


  /*
   * 파일
   */

  const start =
    (currentPage - 1) *
    PAGE_SIZE;


  const pageFiles =
    allFiles.slice(
      start,
      start +
        PAGE_SIZE
    );


  pageFiles.forEach(
    file => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "fileRow";


      row.draggable =
        true;


      row.addEventListener(
        "dragstart",
        event => {

          draggedFileKey =
            file.key;


          row.classList.add(
            "dragging"
          );


          event.dataTransfer.effectAllowed =
            "move";


          event.dataTransfer.setData(
            "text/plain",
            file.key
          );

        }
      );


      row.addEventListener(
        "dragend",
        () => {

          draggedFileKey =
            null;


          row.classList.remove(
            "dragging"
          );


          document
            .querySelectorAll(
              ".dragTarget"
            )
            .forEach(
              element =>
                element.classList.remove(
                  "dragTarget"
                )
            );

        }
      );


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "fileName";


      name.textContent =
        "📄 " +
        file.name;


      const size =
        document.createElement(
          "div"
        );


      size.textContent =
        formatSize(
          file.size
        );


      const buttons =
        document.createElement(
          "div"
        );


      buttons.className =
        "fileButtons";


      /*
       * 다운로드
       */

      const downloadButton =
        document.createElement(
          "button"
        );


      downloadButton.textContent =
        "다운로드";


      downloadButton.onclick =
        () =>
          downloadFile(
            file.key
          );


      /*
       * 이동
       */

      const moveButton =
        document.createElement(
          "button"
        );


      moveButton.textContent =
        "이동";


      moveButton.className =
        "moveBtn";


      moveButton.onclick =
        () =>
          moveFileByPrompt(
            file.key,
            file.name
          );


      /*
       * 삭제
       */

      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.textContent =
        "삭제";


      deleteButton.className =
        "deleteBtn";


      deleteButton.onclick =
        () =>
          deleteFile(
            file.key,
            file.name
          );


      buttons.appendChild(
        downloadButton
      );

      buttons.appendChild(
        moveButton
      );

      buttons.appendChild(
        deleteButton
      );


      row.appendChild(
        name
      );

      row.appendChild(
        size
      );

      row.appendChild(
        buttons
      );


      list.appendChild(
        row
      );

    }
  );


  if (
    allFiles.length === 0 &&
    allFolders.length === 0
  ) {

    list.innerHTML =
      `<div class="empty">
        저장된 파일이 없습니다.
      </div>`;

  }


  renderPagination();

}


/* =========================
   페이지
========================= */

function renderPagination() {

  const pagination =
    document.getElementById(
      "pagination"
    );


  pagination.innerHTML =
    "";


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        allFiles.length /
        PAGE_SIZE
      )
    );


  const prev =
    document.createElement(
      "button"
    );


  prev.textContent =
    "이전";


  prev.disabled =
    currentPage <= 1;


  prev.onclick =
    () => {

      currentPage--;

      renderFiles();

    };


  const page =
    document.createElement(
      "span"
    );


  page.textContent =
    `${currentPage} / ${totalPages}`;


  const next =
    document.createElement(
      "button"
    );


  next.textContent =
    "다음";


  next.disabled =
    currentPage >=
    totalPages;


  next.onclick =
    () => {

      currentPage++;

      renderFiles();

    };


  pagination.appendChild(
    prev
  );

  pagination.appendChild(
    page
  );

  pagination.appendChild(
    next
  );

}


/* =========================
   파일 다운로드
========================= */

async function downloadFile(
  key
) {

  try {

    const response =
      await apiFetch(
        `${API}/api/download?key=${encodeURIComponent(
          key
        )}`
      );


    if (
      !response.ok
    ) {

      const data =
        await response.json();

      alert(
        data.error ||
        "다운로드에 실패했습니다."
      );

      return;

    }


    const blob =
      await response.blob();


    const disposition =
      response.headers.get(
        "Content-Disposition"
      );


    let filename =
      key
        .split("/")
        .pop();


    if (
      disposition
    ) {

      const match =
        disposition.match(
          /filename\*=UTF-8''([^;]+)/i
        );


      if (
        match
      ) {

        filename =
          decodeURIComponent(
            match[1]
          );

      }

    }


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href =
      url;

    a.download =
      filename;


    document.body.appendChild(
      a
    );


    a.click();

    a.remove();


    URL.revokeObjectURL(
      url
    );


  } catch {

    alert(
      "다운로드에 실패했습니다."
    );

  }

}


/* =========================
   파일 이동
========================= */

async function moveFileByPrompt(
  key,
  filename
) {

  const destination =
    prompt(
      `"${filename}" 파일을 어느 폴더로 이동할까요?\n\n예: 문서 또는 문서/간호\n\n루트로 이동하려면 / 입력`,
      currentFolder || ""
    );


  if (
    destination === null
  ) {
    return;
  }


  const destinationFolder =
    destination
      .trim()
      .replace(
        /^\/+|\/+$/g,
        ""
      );


  await moveFileToFolder(
    key,
    destinationFolder
  );

}

  try {

    const response =

          key

        {

/* =========================
   업로드
========================= */

document
  .getElementById(
    "fileInput"
  )
  .addEventListener(
    "change",
    event => {

      uploadFiles(
        event.target.files
      );

      event.target.value =
        "";

    }
  );


async function uploadFiles(
  files
) {

  if (
    !files ||
    !files.length
  ) {
    return;
  }


  for (
    const file of files
  ) {

    let confirmedLarge =
      false;


    if (
      file.size >=
      100 * 1024 * 1024
    ) {

      confirmedLarge =
        confirm(
          `"${file.name}"은 100MB 이상입니다.\n\n업로드하시겠습니까?`
        );


      if (
        !confirmedLarge
      ) {
        continue;
      }

    }


    const formData =
      new FormData();


    formData.append(
      "file",
      file
    );


    formData.append(
      "folder",
      currentFolder
    );


    formData.append(
      "confirmedLarge",
      confirmedLarge
        ? "true"
        : "false"
    );


    try {

      const response =
        await apiFetch(
          `${API}/api/upload`,
          {
            method: "POST",

            body:
              formData
          }
        );


      const data =
        await response.json();


      if (
        !response.ok
      ) {

        alert(
          data.error ||
          `"${file.name}" 업로드 실패`
        );

      }

    } catch {

      alert(
        `"${file.name}" 업로드 중 오류가 발생했습니다.`
      );

    }

  }


  await loadFiles();

}

      draggedFileKey
    ) {
      return;
    }

    event.preventDefault();

    dropZone.classList.add(
      "dragover"
    );

  }
);


dropZone.addEventListener(
  "dragleave",
  () => {

    dropZone.classList.remove(
      "dragover"
    );

  }
);


dropZone.addEventListener(
  "drop",
  event => {

    if (
      draggedFileKey
    ) {

      draggedFileKey =
        null;

      return;

    }


    event.preventDefault();


    dropZone.classList.remove(
      "dragover"
    );


    uploadFiles(
      event.dataTransfer.files
    );

  }
);

async function loadMemos() {

  const list =
    document.getElementById(
      "memoList"
    );


  list.innerHTML =
    `<div class="memoEmpty">
      메모를 불러오는 중...
    </div>`;


  try {

    const response =
      await apiFetch(
        `${API}/api/notes`
      );


    const data =
      await response.json();


    if (
      !response.ok
    ) {

      list.innerHTML =
        `<div class="memoEmpty">
          메모를 불러오지 못했습니다.
        </div>`;

      return;

    }


    const notes =
      data.notes || [];


    list.innerHTML =
      "";


    if (
      notes.length === 0
    ) {

      list.innerHTML =
        `<div class="memoEmpty">
          아직 작성한 메모가 없습니다.
        </div>`;

      return;

    }


    notes.forEach(
      note => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "memoCard";


        const date =
          document.createElement(
            "div"
          );


        date.className =
          "memoDate";


        date.textContent =
          formatDate(
            note.createdAt
          );


        const text =
          document.createElement(
            "div"
          );


        text.className =
          "memoText";


        text.textContent =
          note.text;


        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.className =
          "memoDelete";


        deleteButton.textContent =
          "×";


        deleteButton.title =
          "메모 삭제";


        deleteButton.onclick =
          () =>
            deleteMemo(
              note.id
            );


        card.appendChild(
          date
        );


        card.appendChild(
          text
        );


        card.appendChild(
          deleteButton
        );


        list.appendChild(
          card
        );

      }
    );


  } catch {

    list.innerHTML =
      `<div class="memoEmpty">
        메모를 불러오지 못했습니다.
      </div>`;

  }

}

/* =========================
   메모 날짜
========================= */

function formatDate(
  value
) {

  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleString(
    "ko-KR",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
    }
  );

}


/* =========================
   용량
========================= */

function formatSize(
  bytes
) {

  if (!bytes) {
    return "0 B";
  }


  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  let size =
    bytes;

  let index =
    0;


  while (
    size >= 1024 &&
    index <
      units.length - 1
  ) {

    size /=
      1024;

    index++;

  }


  return (
    size.toFixed(
      index === 0
        ? 0
        : 2
    ) +
    " " +
    units[index]
  );

}
