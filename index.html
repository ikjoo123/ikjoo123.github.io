<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익주의 공간</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         sans-serif;
            background: #f7f7f5;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 50px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
            transition: 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .card p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        /* 파일 보관함 */
        #fileSection {
            display: none;
            margin-top: 35px;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        #fileSection h2 {
            margin-top: 0;
        }

        .upload-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 25px;
        }

        input[type="file"] {
            flex: 1;
            min-width: 220px;
        }

        button {
            border: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.8;
        }

        #status {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .download-btn {
            flex-shrink: 0;
            padding: 7px 12px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>👋 익주의 공간</h1>

    <p class="subtitle">
        나만의 개인 홈페이지
    </p>

    <div class="cards">

        <div class="card" onclick="toggleFiles()">
            <div class="icon">📁</div>
            <h2>파일 보관함</h2>
            <p>Excel · PowerPoint · PDF</p>
        </div>

        <a class="card" href="#">
            <div class="icon">📝</div>
            <h2>Notes</h2>
            <p>메모와 기록</p>
        </a>

        <a class="card" href="#">
            <div class="icon">🔗</div>
            <h2>Links</h2>
            <p>자주 사용하는 사이트</p>
        </a>

        <a class="card" href="#">
            <div class="icon">📌</div>
            <h2>Projects</h2>
            <p>진행 중인 프로젝트</p>
        </a>

    </div>


    <!-- 파일 보관함 -->
    <div id="fileSection">

        <h2>📁 파일 보관함</h2>

        <div class="upload-box">
            <input type="file" id="fileInput">
            <button onclick="uploadFile()">업로드</button>
        </div>

        <div id="status"></div>

        <div id="fileList"></div>

    </div>

</div>


<script>

const API = "https://ikjoo123-github-io.zjaghkf0000.workers.dev";


function toggleFiles() {

    const section = document.getElementById("fileSection");

    if (section.style.display === "none" || section.style.display === "") {

        section.style.display = "block";

        loadFiles();

        section.scrollIntoView({
            behavior: "smooth"
        });

    } else {

        section.style.display = "none";

    }
}


async function uploadFile() {

    const input = document.getElementById("fileInput");
    const status = document.getElementById("status");

    if (!input.files.length) {
        alert("파일을 선택해주세요.");
        return;
    }

    const file = input.files[0];

    status.textContent = "업로드 중...";

    const formData = new FormData();
    formData.append("file", file);

    try {

        const response = await fetch(
            API + "/api/upload",
            {
                method: "POST",
                body: formData
            }
        );

        if (!response.ok) {
            throw new Error("업로드 실패");
        }

        status.textContent = "업로드 완료!";

        input.value = "";

        loadFiles();

    } catch (error) {

        console.error(error);

        status.textContent = "업로드에 실패했습니다.";

    }
}


async function loadFiles() {

    const list = document.getElementById("fileList");

    list.innerHTML = "파일 목록 불러오는 중...";

    try {

        const response = await fetch(
            API + "/api/files"
        );

        const data = await response.json();

        if (!data.files.length) {

            list.innerHTML = `
                <p style="color:#777;">
                    저장된 파일이 없습니다.
                </p>
            `;

            return;
        }


        list.innerHTML = "";

        data.files.forEach(file => {

            const item = document.createElement("div");

            item.className = "file-item";

            const name = document.createElement("div");

            name.className = "file-name";

            name.textContent = file.key;


            const button = document.createElement("button");

            button.className = "download-btn";

            button.textContent = "다운로드";

            button.onclick = function() {

                window.open(
                    API + "/api/download?key=" +
                    encodeURIComponent(file.key),
                    "_blank"
                );

            };


            item.appendChild(name);

            item.appendChild(button);

            list.appendChild(item);

        });


    } catch (error) {

        console.error(error);

        list.innerHTML =
            "파일 목록을 불러오지 못했습니다.";

    }
}

</script>

</body>
</html>
