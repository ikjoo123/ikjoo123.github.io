function getToken() {
  return localStorage.getItem(TOKEN_KEY);
}

function authHeaders() {
  const token = getToken();

  return token
    ? {
        Authorization: "Bearer " + token
      }
    : {};
}


async function apiFetch(url, options = {}) {

  options.headers = {
    ...(options.headers || {}),
    ...authHeaders()
  };

  const response =
    await fetch(url, options);

  if (response.status === 401) {

    localStorage.removeItem(TOKEN_KEY);

    showLogin();

    throw new Error(
      "로그인이 필요합니다."
    );
  }

  return response;
}

    "이전";

    currentPage <= 1;

  prev.onclick =
    () => {

      renderFiles();

    };


  const page =
    document.createElement(
      "span"
    );

  page.textContent =
    `${currentPage} / ${totalPages}`;


  const next =
    document.createElement(
      "button"

  next.disabled =

    () => {

  pagination.appendChild(

  );

  pagination.appendChild(

async function downloadFile(key) {

  try {

    const response =
      await apiFetch(
        `${API}/api/download?key=${encodeURIComponent(
          key
        )}`
      );

    if (!response.ok) {

      const data =
        await response.json();

      alert(
        data.error ||
        "다운로드에 실패했습니다."
      );

      return;
    }


    const blob =
      await response.blob();


    const contentDisposition =
      response.headers.get(
        "Content-Disposition"
      );


    let filename =
      key.split("/").pop();


    if (
      contentDisposition
    ) {

      const match =
        contentDisposition.match(
          /filename\*=UTF-8''([^;]+)/i
        );

      if (match) {

        filename =
          decodeURIComponent(
            match[1]
          );

      }

    }


    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement(
        "a"
      );

    a.href = url;

    a.download =
      filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

  } catch (error) {

    console.error(error);

    alert(
      "다운로드에 실패했습니다."
    );

  }
}

    );

    return;
  }


  try {

    const response =
      await apiFetch(
        `${API}/api/file?key=${encodeURIComponent(
          key
        )}&password=${encodeURIComponent(
          password
        )}`,
        {
          method: "DELETE"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      if (
        data.error ===
        "DELETE_PASSWORD_INVALID"
      ) {

        alert(
          "삭제 비밀번호가 틀렸습니다."
        );

      } else {

        );

    await loadFiles();

  } catch (error) {

    console.error(error);

    alert(
      "삭제 중 오류가 발생했습니다."
    );

  }
}

      "새 폴더 이름을 입력하세요."
    );


  if (
    name === null ||
    !name.trim()
  ) {
    return;
  }


  try {

    const response =
      await apiFetch(
        `${API}/api/folder`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            parent:
              currentFolder,
            name:
              name.trim()
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(
        data.error ||
        "폴더 생성에 실패했습니다."
      );

      return;
    }


    await loadFiles();

  } catch (error) {

    );

async function uploadFiles(
  files
) {

  if (!files || !files.length) {
    return;
  }


  for (
    const file of files
  ) {

    let confirmedLarge =
      false;


    if (
      file.size >=
      100 * 1024 * 1024
    ) {

      confirmedLarge =
        confirm(
          `"${file.name}"은 100MB 이상입니다.\n\n업로드하시겠습니까?`
        );


      if (!confirmedLarge) {
        continue;
      }

    }


    const formData =
      new FormData();

    formData.append(
      "file",
      file
    );

    formData.append(
      "folder",
      currentFolder
    );

    formData.append(
      "confirmedLarge",
      confirmedLarge
        ? "true"
        : "false"
    );


    try {

      const response =
        await apiFetch(
          `${API}/api/upload`,
          {
            method: "POST",
            body: formData
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        if (
          data.error ===
          "LARGE_FILE_CONFIRM_REQUIRED"
        ) {

          alert(
            "100MB 이상 파일은 확인 후 업로드할 수 있습니다."
          );

        } else {

          alert(
            data.error ||
            `"${file.name}" 업로드 실패`
          );

        }

        continue;
      }

    } catch (error) {

      console.error(error);

      alert(
        `"${file.name}" 업로드 중 오류가 발생했습니다.`
      );

    }

  }


  await loadFiles();

}

async function loadUsage() {

  try {

    const response =
      await apiFetch(
        `${API}/api/usage`
      );

    if (!response.ok) {
      return;
    }

    const data =
      await response.json();


    const used =
      formatSize(
        data.used
      );

    const max =
      formatSize(
        data.max
      );


    document
      .getElementById(
        "storage"
      )
      .textContent =
        `저장공간: ${used} / ${max}`;

  } catch (error) {

    console.error(error);

  }
}


// ============================
// 용량 표시
// ============================

function formatSize(
  bytes
) {

  if (!bytes) {
    return "0 B";
  }


  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  let size =
    bytes;

  let index =
    0;


  while (
    size >= 1024 &&
    index <
      units.length - 1
  ) {

    size /= 1024;

    index++;

  }


  return (
    size.toFixed(
      index === 0
        ? 0
        : 2
    ) +
    " " +
    units[index]
  );

}
