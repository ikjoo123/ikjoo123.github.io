<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>익주</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}
.container{width:100%;max-width:700px;padding:30px;text-align:center}
.logo{font-size:36px;font-weight:700;margin-bottom:10px}
.subtitle{color:#777;margin-bottom:32px}
.loginBox{max-width:360px;margin:0 auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.loginBox input{width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:9px;font:inherit}
.loginBox button{width:100%;padding:13px;border:0;border-radius:9px;background:#202124;color:white;font:inherit;cursor:pointer}
.loginError{color:#d93025;font-size:13px;margin-bottom:10px}
.hidden{display:none!important}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:45px 20px;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.icon{font-size:45px;margin-bottom:15px}.title{font-size:21px;font-weight:700}.description{margin-top:8px;color:#888;font-size:14px}
.logout{margin-top:24px;border:0;background:transparent;color:#777;cursor:pointer}
@media(max-width:600px){.menu{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <div class="logo">익주</div>
  <div class="subtitle">나만의 공간</div>

  <div id="loginScreen" class="loginBox">
    <div id="loginError" class="loginError hidden"></div>
    <input id="username" placeholder="아이디" autocomplete="username">
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="loginButton">로그인</button>
  </div>

  <div id="app" class="hidden">
    <div class="menu">
      <div class="card" onclick="location.href='work.html'">
        <div class="icon">📁</div><div class="title">업무</div>
        <div class="description">업무 자료 · 메모 · 달력</div>
      </div>
      <div class="card" onclick="location.href='hobby.html'">
        <div class="icon">🎨</div><div class="title">취미</div>
        <div class="description">음악 · 여행 · 사진 · 꿈</div>
      </div>
    </div>
    <button id="logoutButton" class="logout">로그아웃</button>
  </div>
</div>

<script>
const API="https://ikjoo123-github-io.zjaghkf0000.workers.dev";
const TOKEN_KEY="ju_files_token";
const INACTIVITY_LIMIT=30*60*1000;
let inactivityTimer=null;

function showLogin(){
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
}
function showApp(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  startInactivityTimer();
}
function logout(){
  localStorage.removeItem(TOKEN_KEY);
  if(inactivityTimer) clearTimeout(inactivityTimer);
  showLogin();
}
function resetInactivityTimer(){
  if(!localStorage.getItem(TOKEN_KEY)) return;
  if(inactivityTimer) clearTimeout(inactivityTimer);
  inactivityTimer=setTimeout(logout,INACTIVITY_LIMIT);
}
function startInactivityTimer(){
  ["click","keydown","touchstart","mousemove","scroll"].forEach(function(type){
    document.addEventListener(type,resetInactivityTimer,{passive:true});
  });
  resetInactivityTimer();
}
async function checkLogin(){
  const token=localStorage.getItem(TOKEN_KEY);
  if(!token){showLogin();return;}
  try{
    const response=await fetch(API+"/api/me",{headers:{Authorization:"Bearer "+token}});
    if(!response.ok) throw new Error("인증 실패");
    showApp();
  }catch(error){
    localStorage.removeItem(TOKEN_KEY);
    showLogin();
  }
}
document.getElementById("loginButton").onclick=async function(){
  const button=this;
  const errorBox=document.getElementById("loginError");
  const id=document.getElementById("username").value.trim();
  const pw=document.getElementById("password").value;
  errorBox.classList.add("hidden");
  if(!id||!pw){errorBox.textContent="아이디와 비밀번호를 입력하세요.";errorBox.classList.remove("hidden");return}
  button.disabled=true;
  try{
    const response=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:id,password:pw})});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||"로그인 실패");
    localStorage.setItem(TOKEN_KEY,data.token);
    showApp();
  }catch(error){
    errorBox.textContent=error.message||"로그인에 실패했습니다.";
    errorBox.classList.remove("hidden");
  }finally{button.disabled=false}
};
document.getElementById("password").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("loginButton").click()});
document.getElementById("logoutButton").onclick=logout;
checkLogin();
</script>
</body>
</html>
