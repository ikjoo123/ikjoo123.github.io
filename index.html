<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JU FILES</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    button,
    input {
      font: inherit;
    }

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .loginBox {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .loginBox h1 {
      margin-top: 0;
      margin-bottom: 25px;
      text-align: center;
    }

    .loginBox input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    .loginBox button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #loginMessage {
      margin-top: 12px;
      color: #d33;
      text-align: center;
      font-size: 14px;
    }

    #app {
      display: none;
      min-height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .headerRight {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logoutBtn {
      border: 1px solid #ddd;
      background: white;
      border-radius: 7px;
      padding: 7px 12px;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 25px 20px 50px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .toolbar button {
      padding: 9px 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    .storageInfo {
      font-size: 13px;
      color: #777;
      margin-bottom: 15px;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .breadcrumb button {
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      color: #555;
    }

    .dropZone {
      border: 2px dashed #ccc;
      background: white;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .dropZone.dragover {
      border-color: #333;
      background: #f1f1f1;
    }

    .dropZone p {
      margin: 5px 0;
    }

    #fileInput {
      display: none;
    }

    .fileList {
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .itemIcon {
      width: 30px;
      text-align: center;
      font-size: 20px;
    }

    .itemName {
      flex: 1;
      min-width: 0;
      word-break: break-all;
    }

    .itemInfo {
      color: #888;
      font-size: 12px;
      white-space: nowrap;
    }

    .item button {
      border: 1px solid #ddd;
      background: white;
      padding: 6px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: #888;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .pagination button {
      border: 1px solid #ddd;
      background: white;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .pagination button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modalBox {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 14px;
      padding: 25px;
    }

    .modalBox h3 {
      margin-top: 0;
    }

    .modalBox input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 7px;
      margin-bottom: 12px;
    }

    .modalButtons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modalButtons button {
      padding: 8px 13px;
      border: 1px solid #ddd;
      border-radius: 7px;
      background: white;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .item {
        flex-wrap: wrap;
      }

      .itemName {
        flex-basis: calc(100% - 45px);
      }

      .itemInfo {
        margin-left: 42px;
      }
    }
  </style>
</head>

<body>

<!-- 로그인 -->
<div id="loginScreen">

  <div class="loginBox">

    <h1>JU FILES</h1>

    <form id="loginForm">

      <input
        id="username"
        type="text"
        placeholder="아이디"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="비밀번호"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        로그인
      </button>

    </form>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- 파일 관리자 -->
<div id="app">

  <header>

    <h1>JU FILES</h1>

    <div class="headerRight">

      <span id="userName"></span>

      <button
        class="logoutBtn"
        onclick="logout()"
      >
        로그아웃
      </button>

    </div>

  </header>


  <main>

    <div class="toolbar">

      <button onclick="createFolder()">
        📁 새 폴더
      </button>

      <button onclick="document.getElementById('fileInput').click()">
        ⬆ 파일 업로드
      </button>

      <input
        id="fileInput"
        type="file"
        multiple
      >

    </div>


    <div class="storageInfo">
      저장공간 한도: 9GB
    </div>


    <div id="breadcrumb" class="breadcrumb"></div>


    <div
      id="dropZone"
      class="dropZone"
    >
      <p>파일을 이곳에 끌어다 놓으세요.</p>
      <p>또는 클릭하여 파일을 선택하세요.</p>
    </div>


    <div
      id="fileList"
      class="fileList"
    ></div>


    <div
      id="pagination"
      class="pagination"
    ></div>

  </main>

</div>


<!-- 폴더 생성 모달 -->
<div
  id="folderModal"
  class="modal"
>

  <div class="modalBox">

    <h3>새 폴더 만들기</h3>

    <input
      id="folderName"
      type="text"
      placeholder="폴더 이름"
    >

    <div class="modalButtons">

      <button onclick="closeFolderModal()">
        취소
      </button>

      <button onclick="submitFolder()">
        만들기
      </button>

    </div>

  </div>

</div>


<script>

const API =
  "https://ikjoo123-github-io.zjaghkf0000.workers.dev";

const TOKEN_KEY =
  "ju_files_token";

let currentPrefix = "";

let currentItems = [];

let currentPage = 1;

const PAGE_SIZE = 30;


/*
 * 인증 헤더
 */
function authHeaders(extra = {}) {

  const token =
    localStorage.getItem(TOKEN_KEY);

  return {
    ...extra,

    ...(token
      ? {
          Authorization:
            `Bearer ${token}`
        }
      : {})
  };
}


/*
 * 공통 fetch
 */
async function apiFetch(
  url,
  options = {}
) {

  options.headers =
    authHeaders(
      options.headers || {}
    );

  const response =
    await fetch(
      url,
      options
    );

  if (response.status === 401) {

    localStorage.removeItem(
      TOKEN_KEY
    );

    showLogin();

    throw new Error(
      "로그인이 필요합니다."
    );
  }

  return response;
}


/*
 * 로그인
 */
document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();

      const username =
        document
          .getElementById("username")
          .value;

      const password =
        document
          .getElementById("password")
          .value;

      const message =
        document
          .getElementById("loginMessage");

      message.textContent =
        "로그인 중...";

      try {

        const response =
          await fetch(
            `${API}/api/login`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                username,
                password
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "로그인에 실패했습니다."
          );
        }

        localStorage.setItem(
          TOKEN_KEY,
          data.token
        );

        message.textContent = "";

        showApp();

        await loadFiles();

      } catch (error) {

        message.textContent =
          error.message ||
          "로그인에 실패했습니다.";
      }
    }
  );


/*
 * 로그인 화면 표시
 */
function showLogin() {

  document
    .getElementById("loginScreen")
    .style.display = "flex";

  document
    .getElementById("app")
    .style.display = "none";
}


/*
 * 앱 표시
 */
function showApp() {

  document
    .getElementById("loginScreen")
    .style.display = "none";

  document
    .getElementById("app")
    .style.display = "block";
}


/*
 * 로그인 상태 확인
 */
async function checkLogin() {

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );

  if (!token) {
    showLogin();
    return false;
  }

  try {

    const response =
      await apiFetch(
        `${API}/api/me`
      );

    if (!response.ok) {
      showLogin();
      return false;
    }

    const data =
      await response.json();

    document
      .getElementById("userName")
      .textContent =
      data.user || "";

    showApp();

    return true;

  } catch {

    showLogin();

    return false;
  }
}


/*
 * 로그아웃
 */
async function logout() {

  localStorage.removeItem(
    TOKEN_KEY
  );

  showLogin();

  document
    .getElementById("username")
    .value = "";

  document
    .getElementById("password")
    .value = "";
}


/*
 * 파일 목록 불러오기
 */
async function loadFiles() {

  try {

    const response =
      await apiFetch(
        `${API}/api/files?prefix=${encodeURIComponent(
          currentPrefix
        )}`
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "파일 목록을 불러오지 못했습니다."
      );
    }

    currentItems = [
      ...(data.folders || []),
      ...(data.files || [])
    ];

    currentPage = 1;

    renderBreadcrumb();

    renderFiles();

  } catch (error) {

    if (
      error.message !==
      "로그인이 필요합니다."
    ) {
      alert(error.message);
    }
  }
}


/*
 * Breadcrumb
 */
function renderBreadcrumb() {

  const el =
    document.getElementById(
      "breadcrumb"
    );

  el.innerHTML = "";

  const root =
    document.createElement(
      "button"
    );

  root.textContent = "홈";

  root.onclick = () => {

    currentPrefix = "";

    loadFiles();
  };

  el.appendChild(root);

  if (!currentPrefix) {
    return;
  }

  const parts =
    currentPrefix
      .split("/")
      .filter(Boolean);

  let prefix = "";

  parts.forEach(
    (part, index) => {

      const separator =
        document.createElement(
          "span"
        );

      separator.textContent =
        " / ";

      el.appendChild(
        separator
      );

      prefix +=
        part + "/";

      const button =
        document.createElement(
          "button"
        );

      button.textContent =
        part;

      const targetPrefix =
        prefix;

      button.onclick = () => {

        currentPrefix =
          targetPrefix;

        loadFiles();
      };

      el.appendChild(
        button
      );
    }
  );
}


/*
 * 파일 목록 표시
 */
function renderFiles() {

  const list =
    document.getElementById(
      "fileList"
    );

  const pagination =
    document.getElementById(
      "pagination"
    );

  list.innerHTML = "";

  pagination.innerHTML = "";

  if (
    currentItems.length === 0
  ) {

    list.innerHTML =
      `<div class="empty">
        저장된 파일이 없습니다.
      </div>`;

    return;
  }

  /*
   * 폴더 먼저
   */
  currentItems.sort(
    (a, b) => {

      if (
        a.type === "folder" &&
        b.type !== "folder"
      ) {
        return -1;
      }

      if (
        a.type !== "folder" &&
        b.type === "folder"
      ) {
        return 1;
      }

      return a.name.localeCompare(
        b.name,
        "ko"
      );
    }
  );

  const totalPages =
    Math.ceil(
      currentItems.length /
      PAGE_SIZE
    );

  if (
    currentPage > totalPages
  ) {
    currentPage = totalPages;
  }

  const start =
    (currentPage - 1) *
    PAGE_SIZE;

  const end =
    start + PAGE_SIZE;

  const items =
    currentItems.slice(
      start,
      end
    );

  items.forEach(
    (item) => {

      const row =
        document.createElement(
          "div"
        );

      row.className = "item";

      const icon =
        document.createElement(
          "div"
        );

      icon.className =
        "itemIcon";

      icon.textContent =
        item.type === "folder"
          ? "📁"
          : "📄";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "itemName";

      name.textContent =
        item.name;


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "itemInfo";


      if (
        item.type === "file"
      ) {

        info.textContent =
          formatSize(item.size);
      }


      const action =
        document.createElement(
          "button"
        );


      if (
        item.type === "folder"
      ) {

        action.textContent =
          "열기";

        action.onclick = () => {

          currentPrefix =
            item.prefix;

          loadFiles();
        };

      } else {

        action.textContent =
          "다운로드";

        action.onclick = () => {

          downloadFile(
            item.key
          );
        };
      }


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.textContent =
        "삭제";


      deleteButton.onclick =
        async () => {

          if (
            item.type === "folder"
          ) {

            const ok =
              confirm(
                `"${item.name}" 폴더와 안의 모든 파일을 삭제할까요?`
              );

            if (!ok) {
              return;
            }

            await deleteFolder(
              item.prefix
            );

          } else {

            const ok =
              confirm(
                `"${item.name}" 파일을 삭제할까요?`
              );

            if (!ok) {
              return;
            }

            await deleteFile(
              item.key
            );
          }
        };


      row.appendChild(icon);
      row.appendChild(name);
      row.appendChild(info);
      row.appendChild(action);
      row.appendChild(deleteButton);

      list.appendChild(row);
    }
  );


  /*
   * 페이지 버튼
   */
  for (
    let i = 1;
    i <= totalPages;
    i++
  ) {

    const button =
      document.createElement(
        "button"
      );

    button.textContent = i;

    if (
      i === currentPage
    ) {
      button.classList.add(
        "active"
      );
    }

    button.onclick = () => {

      currentPage = i;

      renderFiles();
    };

    pagination.appendChild(
      button
    );
  }
}


/*
 * 파일 업로드
 */
async function uploadFiles(
  files
) {

  for (const file of files) {

    let confirmedLarge =
      false;

    if (
      file.size >=
      100 * 1024 * 1024
    ) {

      confirmedLarge =
        confirm(
          `"${file.name}"은 100MB 이상 파일입니다.\n\n업로드하시겠습니까?`
        );

      if (!confirmedLarge) {
        continue;
      }
    }


    const formData =
      new FormData();

    formData.append(
      "file",
      file
    );

    formData.append(
      "folder",
      currentPrefix
    );

    formData.append(
      "confirmedLarge",
      confirmedLarge
    );


    try {

      const response =
        await apiFetch(
          `${API}/api/upload`,
          {
            method: "POST",
            body: formData
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          "업로드에 실패했습니다."
        );
      }

    } catch (error) {

      alert(
        `${file.name}\n${error.message}`
      );
    }
  }

  await loadFiles();
}


/*
 * 파일 선택
 */
document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    function() {

      if (
        this.files.length > 0
      ) {

        uploadFiles(
          Array.from(
            this.files
          )
        );
      }

      this.value = "";
    }
  );


/*
 * 드래그앤드롭
 */
const dropZone =
  document.getElementById(
    "dropZone"
  );


dropZone.addEventListener(
  "click",
  () => {

    document
      .getElementById(
        "fileInput"
      )
      .click();
  }
);


dropZone.addEventListener(
  "dragover",
  (e) => {

    e.preventDefault();

    dropZone.classList.add(
      "dragover"
    );
  }
);


dropZone.addEventListener(
  "dragleave",
  () => {

    dropZone.classList.remove(
      "dragover"
    );
  }
);


dropZone.addEventListener(
  "drop",
  (e) => {

    e.preventDefault();

    dropZone.classList.remove(
      "dragover"
    );

    const files =
      Array.from(
        e.dataTransfer.files
      );

    if (files.length > 0) {
      uploadFiles(files);
    }
  }
);


/*
 * 다운로드
 */
async function downloadFile(
  key
) {

  try {

    const response =
      await apiFetch(
        `${API}/api/download?key=${encodeURIComponent(
          key
        )}`
      );

    if (!response.ok) {

      const data =
        await response.json();

      throw new Error(
        data.error ||
        "다운로드에 실패했습니다."
      );
    }


    const blob =
      await response.blob();

    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement(
        "a"
      );

    a.href = url;

    /*
     * Worker에서
     * Content-Disposition으로
     * 원래 파일명을 내려주므로
     * 브라우저 기본 다운로드를 사용
     */
    a.download =
      key
        .split("/")
        .pop()
        .replace(
          /^\d+-/,
          ""
        );

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(
      url
    );

  } catch (error) {

    alert(error.message);
  }
}


/*
 * 파일 삭제
 */
async function deleteFile(
  key
) {

  try {

    const response =
      await apiFetch(
        `${API}/api/file?key=${encodeURIComponent(
          key
        )}`,
        {
          method: "DELETE"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "삭제에 실패했습니다."
      );
    }

    await loadFiles();

  } catch (error) {

    alert(error.message);
  }
}


/*
 * 폴더 삭제
 */
async function deleteFolder(
  prefix
) {

  try {

    const response =
      await apiFetch(
        `${API}/api/folder?prefix=${encodeURIComponent(
          prefix
        )}`,
        {
          method: "DELETE"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "폴더 삭제에 실패했습니다."
      );
    }

    await loadFiles();

  } catch (error) {

    alert(error.message);
  }
}


/*
 * 새 폴더 모달
 */
function createFolder() {

  document
    .getElementById(
      "folderModal"
    )
    .style.display = "flex";

  document
    .getElementById(
      "folderName"
    )
    .value = "";

  document
    .getElementById(
      "folderName"
    )
    .focus();
}


function closeFolderModal() {

  document
    .getElementById(
      "folderModal"
    )
    .style.display = "none";
}


async function submitFolder() {

  const name =
    document
      .getElementById(
        "folderName"
      )
      .value
      .trim();

  if (!name) {

    alert(
      "폴더 이름을 입력하세요."
    );

    return;
  }

  try {

    const response =
      await apiFetch(
        `${API}/api/folder`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            parent:
              currentPrefix,
            name
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "폴더 생성에 실패했습니다."
      );
    }

    closeFolderModal();

    await loadFiles();

  } catch (error) {

    alert(error.message);
  }
}


/*
 * 용량 표시
 */
function formatSize(
  bytes
) {

  if (!bytes) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];

  let size = bytes;
  let index = 0;

  while (
    size >= 1024 &&
    index <
      units.length - 1
  ) {

    size /= 1024;
    index++;
  }

  return `${size.toFixed(
    index === 0 ? 0 : 1
  )} ${units[index]}`;
}


/*
 * 페이지 최초 실행
 */
(async function() {

  const loggedIn =
    await checkLogin();

  if (loggedIn) {
    await loadFiles();
  }

})();
