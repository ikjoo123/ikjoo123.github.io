<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>익주</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #f5f6f8;
  color: #202124;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* LOGIN */

#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.loginBox {
  width: 360px;
  max-width: 100%;
  background: white;
  padding: 32px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.loginBox h1 {
  margin: 0 0 24px;
  text-align: center;
}

.loginBox input {
  width: 100%;
  padding: 13px;
  margin-bottom: 10px;
  border: 1px solid #ddd;
  border-radius: 9px;
}

.loginBox button {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 9px;
  background: #202124;
  color: white;
}

.loginError {
  color: #d93025;
  font-size: 13px;
  margin-bottom: 10px;
}

/* APP */

#app {
  min-height: 100vh;
}

header {
  height: 64px;
  background: white;
  border-bottom: 1px solid #e5e5e5;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 24px;
}

.logo {
  font-size: 21px;
  font-weight: 700;
}

.tabs {
  display: flex;
  gap: 4px;
}

.tab {
  border: 0;
  background: transparent;
  padding: 10px 14px;
  border-radius: 9px;
}

.tab.active {
  background: #f0f0f0;
  font-weight: 700;
}

.logout {
  margin-left: auto;
  border: 0;
  background: transparent;
  color: #777;
}

main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

/* FILES */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.toolbar button {
  border: 1px solid #ddd;
  background: white;
  padding: 9px 13px;
  border-radius: 8px;
}

.breadcrumb {
  margin-bottom: 16px;
  color: #666;
  font-size: 14px;
}

.breadcrumb button {
  border: 0;
  background: transparent;
  padding: 2px;
}

.dropzone {
  border: 2px dashed #d5d5d5;
  background: white;
  border-radius: 14px;
  padding: 25px;
  text-align: center;
  color: #777;
  margin-bottom: 20px;
}

.dropzone.dragover {
  border-color: #555;
  background: #fafafa;
}

.storage {
  background: white;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 16px;
  font-size: 13px;
  color: #666;
}

.storageBar {
  height: 7px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 8px;
}

.storageFill {
  height: 100%;
  background: #555;
  width: 0;
}

.fileList {
  background: white;
  border-radius: 14px;
  overflow: hidden;
}

.fileRow {
  min-height: 54px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  border-bottom: 1px solid #eee;
}

.fileRow:last-child {
  border-bottom: 0;
}

.fileRow.dragging {
  opacity: .5;
}

.fileIcon {
  width: 28px;
  text-align: center;
}

.fileName {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.fileSize {
  color: #888;
  font-size: 12px;
}

.fileActions {
  display: flex;
  gap: 4px;
}

.fileActions button {
  border: 0;
  background: transparent;
  padding: 7px;
}

.folderRow {
  cursor: pointer;
}

.folderRow:hover,
.fileRow:hover {
  background: #fafafa;
}

.pagination {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 20px;
}

.pagination button {
  border: 1px solid #ddd;
  background: white;
  padding: 7px 12px;
  border-radius: 7px;
}

/* NOTES */

.notesComposer {
  max-width: 650px;
  margin: 0 auto 24px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  overflow: hidden;
}

.notesComposer input,
.notesComposer textarea {
  width: 100%;
  border: 0;
  outline: 0;
  padding: 14px 16px;
}

.notesComposer textarea {
  height: 180px;
  min-height: 180px;
  max-height: 420px;
  resize: none;
  overflow-y: auto;
  transition: height .15s ease;
}

.notesComposer.expanded {
  position: fixed;
  inset: 20px;
  max-width: none;
  width: auto;
  height: calc(100vh - 40px);
  margin: 0;
  z-index: 1000;
  display: flex;
  flex-direction: column;
}

.notesComposer.expanded textarea {
  flex: 1;
  height: auto !important;
  max-height: none;
  min-height: 0;
  resize: none;
}

.noteExpandButton {
  border: 0;
  background: transparent;
  padding: 7px 10px;
}

.notesComposer.expanded + .notesGrid {
  display: none;
}

.notesComposer input {
  font-weight: 600;
  font-size: 16px;
}

.noteComposerBottom {
  display: flex;
  align-items: center;
  padding: 8px 12px 12px;
}

.colors {
  display: flex;
  gap: 7px;
}

.colorDot {
  width: 23px;
  height: 23px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
}

.colorDot.selected {
  border-color: #333;
}

.color-yellow {
  background: #fff8b5;
}

.color-green {
  background: #d8f5d0;
}

.color-blue {
  background: #d5e9ff;
}

.color-purple {
  background: #eadcff;
}

.color-pink {
  background: #ffdce8;
}

.color-gray {
  background: #e6e6e6;
}

.noteButtons {
  margin-left: auto;
  display: flex;
  gap: 7px;
}

.noteButtons button {
  border: 0;
  background: transparent;
  padding: 7px 10px;
}

.notesGrid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(230px, 1fr));
  gap: 16px;
}

.noteCard {
  min-height: 150px;
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  position: relative;
  word-break: break-word;
}

.noteCardTitle {
  font-weight: 700;
  margin-bottom: 10px;
}

.noteCardText {
  white-space: pre-wrap;
  color: #444;
  line-height: 1.5;
}

.noteMenu {
  position: absolute;
  right: 8px;
  top: 8px;
}

.noteMenu button {
  border: 0;
  background: transparent;
  font-size: 20px;
}

.noteMenuBox {
  position: absolute;
  right: 0;
  top: 30px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-shadow: 0 5px 20px rgba(0,0,0,.12);
  z-index: 5;
  min-width: 80px;
}

.noteMenuBox button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 12px;
  font-size: 13px;
}



/* CALENDAR */
.calendarToolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}
.calendarToolbar button {
  border: 1px solid #ddd;
  background: white;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}
.calendarTitle {
  font-size: 20px;
  font-weight: 700;
}
.calendarGrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: white;
  border: 1px solid #eee;
  border-radius: 14px;
  overflow: hidden;
}
.calendarWeekday {
  padding: 10px 6px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  background: #fafafa;
  border-right: 1px solid #eee;
  border-bottom: 1px solid #eee;
}
.calendarWeekday:last-child { border-right: 0; }
.calendarDay {
  min-height: 110px;
  padding: 8px;
  border-right: 1px solid #eee;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  vertical-align: top;
}
.calendarDay:nth-child(7n) { border-right: 0; }
.calendarDay:hover { background: #fafafa; }
.calendarDay.otherMonth { background: #fcfcfc; color: #bbb; }
.calendarDay.today { box-shadow: inset 0 0 0 2px #555; }
.calendarDate { font-size: 13px; font-weight: 700; margin-bottom: 5px; }
.calendarDay.sunday .calendarDate,
.calendarHoliday { color: #e34b4b; }
.calendarDay.saturday .calendarDate { color: #4778c7; }
.holidayName { font-size: 11px; line-height: 1.25; margin-bottom: 4px; }
.eventChip {
  display: block;
  width: 100%;
  border: 0;
  text-align: left;
  border-radius: 5px;
  padding: 3px 5px;
  margin-top: 3px;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}
.event-yellow { background: #fff4b8; }
.event-green { background: #d9f4d2; }
.event-blue { background: #d8e9ff; }
.event-purple { background: #eadcff; }
.event-pink { background: #ffdce8; }
.event-gray { background: #e8e8e8; }
.calendarForm {
  background: white;
  border: 1px solid #eee;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
}
.calendarForm.hidden { display: none; }
.calendarFormRow { display: flex; gap: 8px; margin-bottom: 8px; }
.calendarForm input,
.calendarForm textarea {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 9px;
  font: inherit;
}
.calendarForm textarea { min-height: 80px; resize: vertical; }
.calendarFormActions { display: flex; gap: 7px; justify-content: flex-end; }
.calendarFormActions button {
  border: 1px solid #ddd;
  background: white;
  padding: 8px 12px;
  border-radius: 8px;
}
.calendarFormActions .primary { background: #333; color: white; border-color: #333; }
.calendarColors { display: flex; gap: 6px; align-items: center; margin: 5px 0 10px; }
.calendarColor {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
}
.calendarColor.selected { border-color: #333; }

@media (max-width: 650px) {
  .calendarDay { min-height: 82px; padding: 5px; }
  .holidayName { font-size: 9px; }
  .eventChip { font-size: 9px; padding: 2px 3px; }
  .calendarTitle { font-size: 17px; }
}

/* MOBILE */

@media (max-width: 650px) {
  header {
    padding: 0 12px;
    gap: 10px;
  }

  main {
    padding: 14px;
  }

  .fileSize {
    display: none;
  }

  .fileRow {
    padding: 8px 10px;
  }

  .notesGrid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

<!-- APP -->

<div id="app" class="hidden">

<header>

  <div class="tabs">

    >
      📁 파일
    </button>

<!-- NOTES -->

        ></div>

        <div

        <div
          class="colorDot color-blue"

        ></div>

        <div
          class="colorDot color-purple"

        ></div>

        <div
          class="colorDot color-pink"
          data-color="pink"
        ></div>

        <div
          class="colorDot color-gray"

        ></div>

      </div>

      <div class="noteButtons">

  <button

  </button>

</div>

    </div>
  </div>

  <div

<!-- CALENDAR -->
<section
  id="calendarSection"
  class="hidden"
>
  <div class="calendarToolbar">
    <button id="calendarPrev">◀</button>
    <div id="calendarTitle" class="calendarTitle"></div>

  </div>

  ></div>

  <div class="calendarForm hidden" id="calendarForm">
    <div class="calendarFormRow">
      <input id="eventDate" type="date">
      <input id="eventTime" type="time" placeholder="시간">

      <button type="button" class="calendarColor event-blue" data-color="blue"></button>
      <button type="button" class="calendarColor event-purple" data-color="purple"></button>
      <button type="button" class="calendarColor event-pink" data-color="pink"></button>

</main>
</div>

<script>

/*
 * ============================
 * API
 * ============================
 */

const API =
  "https://ikjoo123-github-io.zjaghkf0000.workers.dev";

const TOKEN_KEY =
  "ju_files_token";

function getToken() {
  return localStorage.getItem(
    TOKEN_KEY
  );
}

function authHeaders() {
  const token =
    getToken();

  if (!token) {
    return {};
  }

  return {
    "Authorization":
      "Bearer " + token
  };
}

async function apiFetch(
  path,
  options
) {
  options =
    options || {};

  const headers =
    new Headers(
      options.headers || {}
    );

  const auth =
    authHeaders();

  Object.keys(auth).forEach(
    function(key) {
      headers.set(
        key,
        auth[key]
      );
    }
  );

  options.headers = headers;

  const response =
    await fetch(
      API + path,
      options
    );

  if (
    response.status === 401
  ) {
    localStorage.removeItem(
      TOKEN_KEY
    );

    showLogin();

    throw new Error(
      "로그인이 필요합니다."
    );
  }

  return response;
}

/*
 * ============================
 * ELEMENTS
 * ============================
 */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const app =
  document.getElementById(
    "app"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const username =
  document.getElementById(
    "username"
  );

const password =
  document.getElementById(
    "password"
  );

const filesSection =
  document.getElementById(
    "filesSection"
  );

const notesSection =
  document.getElementById(
    "notesSection"
  );

const calendarSection =
  document.getElementById(
    "calendarSection"
  );

/*
 * ============================
 * LOGIN
 * ============================
 */

function showLogin() {
  loginScreen.classList.remove(
    "hidden"
  );

  app.classList.add(
    "hidden"
  );
}

function showApp() {
  loginScreen.classList.add(
    "hidden"
  );

  app.classList.remove(
    "hidden"
  );
}

function showLoginError(message) {
  loginError.textContent =
    message;

  loginError.classList.remove(
    "hidden"
  );
}

loginButton.onclick =
  async function() {

    loginError.classList.add(
      "hidden"
    );

    const id =
      username.value.trim();

    const pw =
      password.value;

    if (!id || !pw) {
      showLoginError(
        "아이디와 비밀번호를 입력하세요."
      );
      return;
    }

    loginButton.disabled =
      true;

    try {
      const response =
        await fetch(
          API + "/api/login",
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify({
                username: id,
                password: pw
              })
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          "로그인 실패"
        );
      }

      localStorage.setItem(
        TOKEN_KEY,
        data.token
      );

      showApp();

      await loadFiles();

      await loadStorage();

    } catch (error) {
      console.error(error);

      showLoginError(
        "서버에 연결할 수 없습니다."
      );
    } finally {
      loginButton.disabled =
        false;
    }
  };

password.addEventListener(
  "keydown",
  function(event) {
    if (
      event.key === "Enter"
    ) {
      loginButton.click();
    }
  }
);

document.getElementById(
  "logoutButton"
).onclick =
  function() {
    localStorage.removeItem(
      TOKEN_KEY
    );

    showLogin();
  };

/*
 * ============================
 * TABS
 * ============================
 */

document.getElementById(
  "filesTab"
).onclick =
  function() {
    document.getElementById("filesTab").classList.add("active");
    document.getElementById("notesTab").classList.remove("active");
    document.getElementById("calendarTab").classList.remove("active");
    filesSection.classList.remove("hidden");
    notesSection.classList.add("hidden");
    calendarSection.classList.add("hidden");
  };

document.getElementById(
  "notesTab"
).onclick =
  async function() {
    document.getElementById("notesTab").classList.add("active");
    document.getElementById("filesTab").classList.remove("active");
    document.getElementById("calendarTab").classList.remove("active");
    notesSection.classList.remove("hidden");
    filesSection.classList.add("hidden");
    calendarSection.classList.add("hidden");
    await loadNotes();
  };

document.getElementById(
  "calendarTab"
).onclick =
  async function() {
    document.getElementById("calendarTab").classList.add("active");
    document.getElementById("filesTab").classList.remove("active");
    document.getElementById("notesTab").classList.remove("active");
    calendarSection.classList.remove("hidden");
    filesSection.classList.add("hidden");
    notesSection.classList.add("hidden");
    await loadCalendarEvents();
    await loadHolidays(calendarYear);
    renderCalendar();
  };

/*
 * ============================
 * FILES
 * ============================
 */

let currentPrefix = "";
let currentFolders = [];
let currentFiles = [];
let currentPage = 1;

const PAGE_SIZE = 30;

function formatSize(size) {
  if (size < 1024) {
    return size + " B";
  }

  if (
    size <
    1024 * 1024
  ) {
    return (
      (size / 1024)
        .toFixed(1) +
      " KB"
    );
  }

  if (
    size <
    1024 * 1024 * 1024
  ) {
    return (
      (size /
        1024 /
        1024
      ).toFixed(1) +
      " MB"
    );
  }

  return (
    (
      size /
      1024 /
      1024 /
      1024
    ).toFixed(2) +
    " GB"
  );
}

async function loadFiles() {

  const list =
    document.getElementById(
      "fileList"
    );

  list.innerHTML =
    "<div style='padding:30px;text-align:center'>불러오는 중...</div>";

  try {
    const response =
      await apiFetch(
        "/api/files?prefix=" +
        encodeURIComponent(
          currentPrefix
        )
      );

    if (!response.ok) {
      throw new Error(
        "파일 목록 오류"
      );
    }

    const data =
      await response.json();

    currentFolders =
      (Array.isArray(data.folders) ? data.folders : [])
        .map(function(folder) {
          if (typeof folder === "string") {
            const prefix = folder;
            const parts = prefix.split("/").filter(Boolean);
            return {
              type: "folder",
              name: parts.length ? parts[parts.length - 1] : prefix,
              prefix: prefix
            };
          }

          const prefix = String(folder.prefix || folder.name || "");
          const parts = prefix.split("/").filter(Boolean);

          return {
            type: "folder",
            name: folder.name || (parts.length ? parts[parts.length - 1] : ""),
            prefix: prefix.endsWith("/") ? prefix : prefix + "/"
          };
        })
        .filter(function(folder) {
          return folder.name && folder.prefix;
        });

    currentFiles =
      (Array.isArray(data.files) ? data.files : [])
        .map(function(file) {
          const key = String(file.key || "");
          const keyParts = key.split("/").filter(Boolean);
          const fallbackName = keyParts.length ? keyParts[keyParts.length - 1].replace(/^\d+-/, "") : "";

          return {
            type: "file",
            key: key,
            name: file.name || fallbackName,
            size: Number(file.size || 0),
            uploaded: file.uploaded || null
          };
        })
        .filter(function(file) {
          return file.key;
        });

    currentPage = 1;

    renderBreadcrumb();
    renderFiles();

  } catch (error) {
    console.error(error);

    list.innerHTML =
      "<div style='padding:30px;text-align:center'>서버에 연결할 수 없습니다.</div>";
  }
}

function renderBreadcrumb() {

  const box =
    document.getElementById(
      "breadcrumb"
    );

  box.innerHTML = "";

  const root =
    document.createElement(
      "button"
    );

  root.textContent =
    "📁 파일";

  root.onclick =
    function() {
      currentPrefix = "";
      loadFiles();
    };

  box.appendChild(root);

  if (!currentPrefix) {
    return;
  }

  const parts =
    currentPrefix
      .split("/")
      .filter(Boolean);

  let prefix = "";

  parts.forEach(
    function(part) {

      prefix +=
        part + "/";

      const separator =
        document.createTextNode(
          " / "
        );

      box.appendChild(
        separator
      );

      const button =
        document.createElement(
          "button"
        );

      button.textContent =
        part;

      const target =
        prefix;

      button.onclick =
        function() {
          currentPrefix =
            target;

          loadFiles();
        };

      box.appendChild(
        button
      );
    }
  );
}

function renderFiles() {

  const list =
    document.getElementById(
      "fileList"
    );

  list.innerHTML = "";

  const folders =
    currentFolders;

  // 현재 폴더 안에서는 항상 "상위 폴더"를 드롭 대상으로 표시
  if (currentPrefix) {
    const parentRow =
      document.createElement("div");

    parentRow.className =
      "fileRow folderRow parentFolderRow";

    parentRow.innerHTML =
      "<div class='fileIcon'>⬆️</div>" +
      "<div class='fileName'>상위 폴더</div>" +
      "<div class='fileActions'></div>";

    parentRow.addEventListener(
      "dragover",
      function(event) {
        event.preventDefault();
        event.stopPropagation();
        event.dataTransfer.dropEffect = "move";
        parentRow.style.background = "#e8f0fe";
      }
    );

    parentRow.addEventListener(
      "dragleave",
      function() {
        parentRow.style.background = "";
      }
    );

    parentRow.addEventListener(
      "drop",
      async function(event) {
        event.preventDefault();
        event.stopPropagation();
        parentRow.style.background = "";

        const key =
          event.dataTransfer.getData("text/plain");

        if (!key) return;

        const parts =
          currentPrefix.split("/").filter(Boolean);

        parts.pop();

        const parentPrefix =
          parts.length
            ? parts.join("/") + "/"
            : "";

        if (key.startsWith("FOLDER:")) {
          await moveFolder(
            key.substring("FOLDER:".length),
            parentPrefix
          );
        } else {
          await moveFile(
            key,
            parentPrefix
          );
        }
      }
    );

    parentRow.onclick = function() {
      const parts =
        currentPrefix.split("/").filter(Boolean);

      parts.pop();

      currentPrefix =
        parts.length
          ? parts.join("/") + "/"
          : "";

      loadFiles();
    };

    list.appendChild(parentRow);
  }

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        currentFiles.length /
        PAGE_SIZE
      )
    );

  if (
    currentPage >
    totalPages
  ) {
    currentPage =
      totalPages;
  }

  folders.forEach(
    function(folder) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "fileRow folderRow";

      row.innerHTML =
        "<div class='fileIcon'>📁</div>" +
        "<div class='fileName'></div>" +
        "<div class='fileActions'></div>";

      row.querySelector(
        ".fileName"
      ).textContent =
        folder.name;

      const actions =
        row.querySelector(
          ".fileActions"
        );

      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.textContent =
        "🗑️";

      deleteButton.onclick =
        function(event) {

          event.stopPropagation();

          deleteFolder(
            folder.prefix
          );
        };

      actions.appendChild(
        deleteButton
      );

      const renameButton =
        document.createElement("button");

      renameButton.textContent = "✏️";

      renameButton.title = "폴더 이름 변경";

      renameButton.onclick =
        function(event) {
          event.stopPropagation();
          renameFolder(folder.prefix);
        };

      actions.insertBefore(
        renameButton,
        deleteButton
      );

      row.draggable = true;

      row.addEventListener(
        "dragstart",
        function(event) {
          event.stopPropagation();
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData(
            "text/plain",
            "FOLDER:" + folder.prefix
          );
          row.style.opacity = "0.5";
        }
      );

      row.addEventListener(
        "dragend",
        function() {
          row.style.opacity = "";
        }
      );

      row.addEventListener(
        "dragover",
        function(event) {
          const data =
            event.dataTransfer.getData("text/plain");

          if (!data) {
            return;
          }

          // 파일과 폴더 모두 하위 폴더로 드롭 가능
          event.preventDefault();
          event.stopPropagation();
          event.dataTransfer.dropEffect = "move";
          row.style.background = "#e8f0fe";
        }
      );

      row.addEventListener(
        "dragleave",
        function() {
          row.style.background = "";
        }
      );

      row.addEventListener(
        "drop",
        async function(event) {
          event.preventDefault();
          event.stopPropagation();
          row.style.background = "";

          const data =
            event.dataTransfer.getData("text/plain");

          if (!data) {
            return;
          }

          if (data.startsWith("FOLDER:")) {
            const source =
              data.substring("FOLDER:".length);

            await moveFolder(
              source,
              folder.prefix
            );

            return;
          }

          // FOLDER:가 아니면 파일 키로 처리
          await moveFile(
            data,
            folder.prefix
          );
        }
      );

      row.onclick =
        function() {
          currentPrefix =
            folder.prefix;

          loadFiles();
        };

      list.appendChild(row);
    }
  );

  const start =
    (currentPage - 1) *
    PAGE_SIZE;

  const pageFiles =
    currentFiles.slice(
      start,
      start + PAGE_SIZE
    );

  pageFiles.forEach(
    function(file) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "fileRow";

      row.draggable =
        true;

      row.innerHTML =
        "<div class='fileIcon'>📄</div>" +
        "<div class='fileName'></div>" +
        "<div class='fileSize'></div>" +
        "<div class='fileActions'></div>";

      row.querySelector(
        ".fileName"
      ).textContent =
        file.name;

      row.querySelector(
        ".fileSize"
      ).textContent =
        formatSize(
          file.size
        );

      const actions =
        row.querySelector(
          ".fileActions"
        );

      const download =
        document.createElement(
          "button"
        );

      download.textContent =
        "⬇️";

      download.onclick =
        function() {
          downloadFile(
            file.key
          );
        };

      actions.appendChild(
        download
      );

      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.textContent =
        "🗑️";

      deleteButton.onclick =
        function() {
          deleteFile(
            file.key
          );
        };

      actions.appendChild(
        deleteButton
      );

      row.addEventListener(
        "dragstart",
        function(event) {
          event.dataTransfer.setData(
            "text/plain",
            file.key
          );

          row.classList.add(
            "dragging"
          );
        }
      );

      row.addEventListener(
        "dragend",
        function() {
          row.classList.remove(
            "dragging"
          );
        }
      );

      list.appendChild(row);
    }
  );

  renderPagination(
    totalPages
  );
}

function renderPagination(
  totalPages
) {

  const box =
    document.getElementById(
      "pagination"
    );

  box.innerHTML = "";

  if (totalPages <= 1) {
    return;
  }

  const prev =
    document.createElement(
      "button"
    );

  prev.textContent =
    "‹";

  prev.disabled =
    currentPage === 1;

  prev.onclick =
    function() {
      currentPage--;
      renderFiles();
    };

  box.appendChild(prev);

  const info =
    document.createElement(
      "span"
    );

  info.textContent =
    currentPage +
    " / " +
    totalPages;

  info.style.padding =
    "8px";

  box.appendChild(info);

  const next =
    document.createElement(
      "button"
    );

  next.textContent =
    "›";

  next.disabled =
    currentPage ===
    totalPages;

  next.onclick =
    function() {
      currentPage++;
      renderFiles();
    };

  box.appendChild(next);
}

async function uploadFiles(
  files
) {

  for (
    const file of files
  ) {

    let confirmedLarge =
      false;

    if (
      file.size >=
      100 * 1024 * 1024
    ) {
      confirmedLarge =
        confirm(
          file.name +
          "\n\n100MB 이상 파일입니다. 업로드할까요?"
        );

      if (!confirmedLarge) {
        continue;
      }
    }

    const form =
      new FormData();

    form.append(
      "file",
      file
    );

    form.append(
      "folder",
      currentPrefix
    );

    form.append(
      "confirmedLarge",
      confirmedLarge
        ? "true"
        : "false"
    );

    try {

      const response =
        await apiFetch(
          "/api/upload",
          {
            method: "POST",
            body: form
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        alert(
          data.error ||
          "업로드 실패"
        );
        continue;
      }

    } catch (error) {
      console.error(error);

      alert(
        "업로드 중 오류가 발생했습니다."
      );
    }
  }

  await loadFiles();
  await loadStorage();
}

  }

async function moveFolder(
  source,
  destination
) {
  if (!source) return;

  const sourceParts =
    source.replace(/\/+$/, "").split("/").filter(Boolean);
  const sourceName =
    sourceParts[sourceParts.length - 1];
  const sourcePrefix =
    source.replace(/\/+$/, "") + "/";
  const destinationPrefix =
    destination ? destination.replace(/\/+$/, "") + "/" : "";

  if (
    destinationPrefix === sourcePrefix ||
    destinationPrefix.startsWith(sourcePrefix)
  ) {
    alert("폴더 자신 또는 하위 폴더로는 이동할 수 없습니다.");
    return;
  }

  if (!confirm(
    "\"" + sourceName + "\" 폴더를 \"" +
    (destination ? destination.replace(/\/+$/, "") : "최상위 폴더") +
    "\"(으)로 이동할까요?"
  )) {
    return;
  }

  try {
    const response = await apiFetch(
      "/api/move-folder",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          source: source,
          destinationFolder: destination
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "폴더 이동 실패");
      return;
    }

    await loadFiles();
  } catch (error) {
    alert("폴더 이동 중 오류가 발생했습니다.");
  }
}

async function renameFolder(source) {
  const parts = source
    .replace(/\/+$/, "")
    .split("/")
    .filter(Boolean);

  const oldName = parts[parts.length - 1] || "";
  const newName = prompt(
    "새 폴더 이름",
    oldName
  );

  if (newName === null) return;

  const trimmedName = newName.trim();

  if (!trimmedName || trimmedName === oldName) {
    return;
  }

  if (
    trimmedName.includes("/") ||
    trimmedName.includes("\\") ||
    trimmedName === "." ||
    trimmedName === ".."
  ) {
    alert("사용할 수 없는 폴더 이름입니다.");
    return;
  }

  if (!confirm(
    "\"" + oldName + "\" 폴더 이름을 \"" +
    trimmedName + "\"(으)로 변경할까요?"
  )) {
    return;
  }

  try {
    const response = await apiFetch(
      "/api/rename-folder",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          source: source,
          newName: trimmedName
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "폴더 이름 변경 실패");
      return;
    }

    if (currentPrefix === source) {
      const parentParts = parts.slice(0, -1);
      currentPrefix = parentParts.length
        ? parentParts.join("/") + "/" + trimmedName + "/"
        : trimmedName + "/";
    } else if (
      currentPrefix.startsWith(source.replace(/\/+$/, "") + "/")
    ) {
      const parentPath = parts.slice(0, -1);
      const suffix = currentPrefix.substring(
        source.replace(/\/+$/, "").length + 1
      );
      currentPrefix =
        (parentPath.length
          ? parentPath.join("/") + "/"
          : "") +
        trimmedName + "/" +
        suffix;
    }

    await loadFiles();
  } catch (error) {
    alert("폴더 이름 변경 중 오류가 발생했습니다.");
  }
}

/*
 * DOWNLOAD
 */

async function downloadFile(
  key
) {

  try {

    const response =
      await apiFetch(
        "/api/download?key=" +
        encodeURIComponent(key)
      );

    if (!response.ok) {
      throw new Error(
        "다운로드 실패"
      );
    }

    const blob =
      await response.blob();

    const encodedFilename =
      response.headers.get(
        "X-Download-Filename"
      );

    let downloadName = "download";

    if (encodedFilename) {
      try {
        downloadName =
          decodeURIComponent(
            encodedFilename
          );
      } catch (error) {
        downloadName = encodedFilename;
      }
    } else {
      const disposition =
        response.headers.get(
          "Content-Disposition"
        );

      if (disposition) {
        const match =
          disposition.match(
            /filename\*=UTF-8''([^;]+)/i
          );

        if (match && match[1]) {
          try {
            downloadName =
              decodeURIComponent(match[1]);
          } catch (error) {
            downloadName = match[1];
          }
        }
      }
    }

    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement(
        "a"
      );

    a.href = url;
    a.download = downloadName;

    document.body.appendChild(
      a
    );

    a.click();
    a.remove();

    URL.revokeObjectURL(
      url
    );

  } catch (error) {
    alert(
      "다운로드에 실패했습니다."
    );
  }
}

/*

 */

async function loadStorage() {

  try {

    const response =
      await apiFetch(
        "/api/usage"
      );

    const data =
      await response.json();

    const used =
      data.used || 0;

    const max =
      data.max || 0;

    const percent =
      max
        ? Math.min(
            100,
            used / max * 100
          )
        : 0;

    document.getElementById(
      "storage"
    ).innerHTML =
      "저장공간 " +
      formatSize(used) +
      " / " +
      formatSize(max) +
      "<div class='storageBar'>" +
      "<div class='storageFill' style='width:" +
      percent +
      "%'></div>" +
      "</div>";

  } catch (error) {
    console.error(error);
  }
}

/*
 * ============================
 * NOTES
 * ============================
 */

let editingNoteId = null;
let selectedColor = "yellow";

const noteTitle =
  document.getElementById(
    "noteTitle"
  );

const noteText =
  document.getElementById(
    "noteText"
  );

  const notesComposer =
  document.getElementById(
    "notesComposer"
  );

const expandNote =
  document.getElementById(
    "expandNote"
  );

function resizeNoteTextarea() {

  if (
    notesComposer.classList.contains(
      "expanded"
    )
  ) {
    return;
  }

  noteText.style.height =
    "180px";

  const newHeight =
    Math.min(
      noteText.scrollHeight,
      420
    );

  noteText.style.height =
    newHeight + "px";
}

noteText.addEventListener(
  "input",
  resizeNoteTextarea
);

expandNote.onclick =
  function() {

    const expanded =
      notesComposer.classList.toggle(
        "expanded"
      );

    if (expanded) {
      expandNote.textContent =
        "↙ 축소";
    } else {
      expandNote.textContent =
        "↗ 확대";

      resizeNoteTextarea();
    }
  };
  

document.querySelectorAll(
  ".colorDot"
).forEach(
  function(dot) {

    dot.onclick =
      function() {

        document
          .querySelectorAll(
            ".colorDot"
          )
          .forEach(
            function(item) {
              item.classList.remove(
                "selected"
              );
            }
          );

        dot.classList.add(
          "selected"
        );

        selectedColor =
          dot.dataset.color;
      };
  }
);

document.getElementById(
  "saveNote"
).onclick =
  saveNote;

document.getElementById(
  "cancelNote"
).onclick =
  clearNoteComposer;

async function saveNote() {

  const title =
    noteTitle.value.trim();

  const text =
    noteText.value.trim();

  if (!title && !text) {
    return;
  }

  const response =
    await apiFetch(
      "/api/notes",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify({
            id:
              editingNoteId,
            title: title,
            text: text,
            color:
              selectedColor
          })
      }
    );

  const data =
    await response.json();

  if (!response.ok) {
    alert(
      data.error ||
      "메모 저장 실패"
    );
    return;
  }

  clearNoteComposer();

  await loadNotes();
}

function clearNoteComposer() {

  editingNoteId =
    null;

  noteTitle.value = "";
  noteText.value = "";

  notesComposer.classList.remove(
  "expanded"
);

expandNote.textContent =
  "↗ 확대";

noteText.style.height =
  "180px";

  selectedColor =
    "yellow";

  document
    .querySelectorAll(
      ".colorDot"
    )
    .forEach(
      function(dot) {
        dot.classList.remove(
          "selected"
        );

        if (
          dot.dataset.color ===
          "yellow"
        ) {
          dot.classList.add(
            "selected"
          );
        }
      }
    );
}

async function loadNotes() {

  const grid =
    document.getElementById(
      "notesGrid"
    );

  grid.innerHTML =
    "<div>불러오는 중...</div>";

  try {

    const response =
      await apiFetch(
        "/api/notes"
      );

    const data =
      await response.json();

    renderNotes(
      data.notes || []
    );

  } catch (error) {
    console.error(error);

    grid.innerHTML =
      "<div>메모를 불러올 수 없습니다.</div>";
  }
}

function renderNotes(
  notes
) {

  const grid =
    document.getElementById(
      "notesGrid"
    );

  grid.innerHTML = "";

  notes.forEach(
    function(note) {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "noteCard color-" +
        (note.color ||
          "yellow");

      const title =
        document.createElement(
          "div"
        );

      title.className =
        "noteCardTitle";

      title.textContent =
        note.title || "";

      const text =
        document.createElement(
          "div"
        );

      text.className =
        "noteCardText";

      text.textContent =
        note.text || "";

      const menu =
        document.createElement(
          "div"
        );

      menu.className =
        "noteMenu";

      const menuButton =
        document.createElement(
          "button"
        );

      menuButton.textContent =
        "⋮";

      const menuBox =
        document.createElement(
          "div"
        );

      menuBox.className =
        "noteMenuBox hidden";

      const edit =
        document.createElement(
          "button"
        );

      edit.textContent =
        "수정";

      edit.onclick =
        function(event) {

          event.stopPropagation();

          menuBox.classList.add(
            "hidden"
          );

          editNote(note);
          
        };

      const remove =
        document.createElement(
          "button"
        );

      remove.textContent =
        "삭제";

      remove.onclick =
        async function(event) {

          event.stopPropagation();

          menuBox.classList.add(
            "hidden"
          );

          await deleteNote(
            note.id
          );
        };

      menuBox.appendChild(
        edit
      );

      menuBox.appendChild(
        remove
      );

      menuButton.onclick =
        function(event) {

          event.stopPropagation();

          menuBox.classList.toggle(
            "hidden"
          );
        };

      menu.appendChild(
        menuButton
      );

      menu.appendChild(
        menuBox
      );

      card.appendChild(
        title
      );

      card.appendChild(
        text
      );

      card.appendChild(
        menu
      );

      card.onclick =
        function() {
          editNote(note);
        };

      grid.appendChild(card);
    }
  );
}

function editNote(note) {

  editingNoteId =
    note.id;

  noteTitle.value =
    note.title || "";

  noteText.value =
    note.text || "";

  selectedColor =
    note.color ||
    "yellow";

  document
    .querySelectorAll(
      ".colorDot"
    )
    .forEach(
      function(dot) {

        dot.classList.toggle(
          "selected",
          dot.dataset.color ===
          selectedColor
        );
      }
    );

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
notesComposer.classList.remove(
  "expanded"
);

expandNote.textContent =
  "↗ 확대";

noteText.style.height =
  "180px";

resizeNoteTextarea();
  noteTitle.focus();
}

async function deleteNote(
  id
) {

  if (
    !confirm(
      "이 메모를 삭제하시겠습니까?"
    )
  ) {
    return;
  }

  const response =
    await apiFetch(
      "/api/notes?id=" +
      encodeURIComponent(id),
      {
        method: "DELETE"
      }
    );

  const data =
    await response.json();

  if (!response.ok) {
    alert(
      data.error ||
      "메모 삭제 실패"
    );
    return;
  }

  await loadNotes();
}


/*
 * ============================
 * CALENDAR
 * ============================
 */

let calendarDate = new Date();
let calendarYear = calendarDate.getFullYear();
let calendarMonth = calendarDate.getMonth();
let calendarEvents = [];
let calendarHolidays = {};
let editingEventId = null;
let selectedEventColor = "yellow";

function pad2(value) {
  return String(value).padStart(2, "0");
}

function dateKey(year, month, day) {
  return year + "-" + pad2(month + 1) + "-" + pad2(day);
}

function formatCalendarDate(dateString) {
  const parts = dateString.split("-");
  return parts[0] + "년 " + Number(parts[1]) + "월 " + Number(parts[2]) + "일";
}

async function loadCalendarEvents() {
  const status =
    document.getElementById("calendarStatus");

  try {
    if (status) {
      status.textContent = "일정을 불러오는 중...";
      status.style.color = "#666";
    }

    const response =
      await apiFetch("/api/events");

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "일정 불러오기 실패 (" +
        response.status +
        ")"
      );
    }

    calendarEvents =
      Array.isArray(data.events)
        ? data.events
        : [];

    if (status) {
      status.textContent =
        calendarEvents.length +
        "개의 일정이 저장되어 있습니다.";
      status.style.color = "#666";
    }

    return true;

  } catch (error) {

    console.error(
      "calendar load error:",
      error
    );

    calendarEvents = [];

    if (status) {
      status.textContent =
        "일정을 불러오지 못했습니다: " +
        (error.message || error);
      status.style.color = "#d93025";
    }

    return false;
  }
}

async function loadHolidays(year) {
  try {
    const response = await fetch(
      "https://holidays.hyunbin.page/" + year + ".json"
    );
    if (!response.ok) throw new Error("공휴일 데이터 오류");
    calendarHolidays = await response.json();
  } catch (error) {
    console.error("공휴일을 불러오지 못했습니다.", error);
    calendarHolidays = {};
  }
}

function holidayNames(key) {
  const value = calendarHolidays[key];
  if (!value) return [];
  return Array.isArray(value) ? value : [value];
}

function renderCalendar() {
  const title = document.getElementById("calendarTitle");
  const grid = document.getElementById("calendarGrid");

  title.textContent = calendarYear + "년 " + (calendarMonth + 1) + "월";
  grid.innerHTML = "";

  const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
  weekdays.forEach(function(day) {
    const el = document.createElement("div");
    el.className = "calendarWeekday";
    el.textContent = day;
    grid.appendChild(el);
  });

  const first = new Date(calendarYear, calendarMonth, 1);
  const last = new Date(calendarYear, calendarMonth + 1, 0);
  const startDay = first.getDay();
  const daysInMonth = last.getDate();
  const prevDays = new Date(calendarYear, calendarMonth, 0).getDate();
  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

  for (let i = 0; i < 42; i++) {
    const cell = document.createElement("div");
    cell.className = "calendarDay";

    let dayNumber;
    let cellYear = calendarYear;
    let cellMonth = calendarMonth;

    if (i < startDay) {
      dayNumber = prevDays - startDay + i + 1;
      cellMonth--;
      if (cellMonth < 0) {
        cellMonth = 11;
        cellYear--;
      }
      cell.classList.add("otherMonth");
    } else if (i >= startDay + daysInMonth) {
      dayNumber = i - startDay - daysInMonth + 1;
      cellMonth++;
      if (cellMonth > 11) {
        cellMonth = 0;
        cellYear++;
      }
      cell.classList.add("otherMonth");
    } else {
      dayNumber = i - startDay + 1;
    }

    if (i % 7 === 0) cell.classList.add("sunday");
    if (i % 7 === 6) cell.classList.add("saturday");

    const key = dateKey(cellYear, cellMonth, dayNumber);
    if (key === todayKey) cell.classList.add("today");

    const dateEl = document.createElement("div");
    dateEl.className = "calendarDate";
    dateEl.textContent = dayNumber;
    cell.appendChild(dateEl);

    const holidays = holidayNames(key);
    holidays.forEach(function(name) {
      const holiday = document.createElement("div");
      holiday.className = "holidayName calendarHoliday";
      holiday.textContent = name;
      cell.appendChild(holiday);
    });

    const dayEvents = calendarEvents
      .filter(function(event) { return event.date === key; })
      .sort(function(a, b) { return (a.time || "").localeCompare(b.time || ""); });

    dayEvents.forEach(function(event) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "eventChip event-" + (event.color || "yellow");
      chip.textContent = (event.time ? event.time + " " : "") + event.title;
      chip.title = event.text || event.title;
      chip.onclick = function(e) {
        e.stopPropagation();
        openEventForm(event);
      };
      cell.appendChild(chip);
    });

    cell.onclick = function() {
      openEventForm({ date: key });
    };

    grid.appendChild(cell);
  }
}

async function changeCalendarMonth(delta) {
  calendarMonth += delta;
  if (calendarMonth < 0) {
    calendarMonth = 11;
    calendarYear--;
  }
  if (calendarMonth > 11) {
    calendarMonth = 0;
    calendarYear++;
  }
  await loadHolidays(calendarYear);
  renderCalendar();
}

document.getElementById("calendarPrev").onclick = function() {
  changeCalendarMonth(-1);
};

document.getElementById("calendarNext").onclick = function() {
  changeCalendarMonth(1);
};

function openEventForm(event) {
  editingEventId = event.id || null;
  document.getElementById("eventDate").value = event.date || "";
  document.getElementById("eventTime").value = event.time || "";
  document.getElementById("eventTitle").value = event.title || "";
  document.getElementById("eventText").value = event.text || "";
  selectedEventColor = event.color || "yellow";

  document.querySelectorAll(".calendarColor").forEach(function(dot) {
    dot.classList.toggle("selected", dot.dataset.color === selectedEventColor);
  });

  const deleteButton = document.getElementById("eventDelete");
  deleteButton.classList.toggle("hidden", !editingEventId);
  document.getElementById("calendarForm").classList.remove("hidden");
  document.getElementById("eventTitle").focus();
}

function closeEventForm() {
  editingEventId = null;
  document.getElementById("calendarForm").classList.add("hidden");
  document.getElementById("eventDate").value = "";
  document.getElementById("eventTime").value = "";
  document.getElementById("eventTitle").value = "";
  document.getElementById("eventText").value = "";
}

document.querySelectorAll(".calendarColor").forEach(function(dot) {
  dot.onclick = function() {
    selectedEventColor = dot.dataset.color;
    document.querySelectorAll(".calendarColor").forEach(function(item) {
      item.classList.remove("selected");
    });
    dot.classList.add("selected");
  };
});

document.getElementById("eventCancel").onclick = closeEventForm;

document.getElementById("eventSave").onclick = async function() {
  const saveButton =
    document.getElementById("eventSave");

  const date =
    document.getElementById("eventDate").value;

  const title =
    document.getElementById("eventTitle").value.trim();

  const time =
    document.getElementById("eventTime").value;

  const text =
    document.getElementById("eventText").value.trim();

  if (!date) {
    alert("날짜를 선택하세요.");
    return;
  }

  if (!title) {
    alert("일정 제목을 입력하세요.");
    return;
  }

  try {
    saveButton.disabled = true;
    saveButton.textContent = "저장 중...";

    const response =
      await apiFetch("/api/events", {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          id:
            editingEventId,
          date:
            date,
          time:
            time,
          title:
            title,
          text:
            text,
          color:
            selectedEventColor
        })
      });

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "일정 저장 실패 (" +
        response.status +
        ")"
      );
    }

    closeEventForm();

    const loaded =
      await loadCalendarEvents();

    if (loaded) {
      renderCalendar();
    }

    alert("일정이 저장되었습니다.");

  } catch (error) {

    console.error(
      "calendar save error:",
      error
    );

    alert(
      "일정 저장 실패\n" +
      (error.message || error)
    );

  } finally {
    saveButton.disabled = false;
    saveButton.textContent = "저장";
  }
};

document.getElementById("eventDelete").onclick = async function() {
  if (!editingEventId) return;
  if (!confirm("이 일정을 삭제하시겠습니까?")) return;

  const response = await apiFetch(
    "/api/events?id=" + encodeURIComponent(editingEventId),
    { method: "DELETE" }
  );
  const data = await response.json();

  if (!response.ok) {
    alert(data.error || "일정 삭제 실패");
    return;
  }

  closeEventForm();
  await loadCalendarEvents();
  renderCalendar();
};
