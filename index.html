<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익주의 공간</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         sans-serif;
            background: #f7f7f5;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 50px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
            transition: 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .card p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        /* 파일 보관함 */
        #fileSection {
            display: none;
            margin-top: 35px;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        #fileSection h2 {
            margin-top: 0;
        }

        /* 현재 경로 */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .breadcrumb button {
            border: none;
            background: none;
            padding: 0;
            color: #555;
            cursor: pointer;
            font-size: 14px;
        }

        .breadcrumb button:hover {
            color: #000;
            text-decoration: underline;
        }

        /* 상단 버튼 */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .toolbar button {
            border: 1px solid #ddd;
            background: white;
            color: #333;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .toolbar button:hover {
            background: #f5f5f5;
        }

        /* 드래그 영역 */
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 14px;
            padding: 38px 20px;
            text-align: center;
            color: #777;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            border-color: #999;
            background: #fafafa;
        }

        .drop-zone.dragover {
            border-color: #222;
            background: #f3f3f3;
        }

        .drop-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .drop-text {
            font-size: 15px;
        }

        .drop-subtext {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
        }

        #fileInput {
            display: none;
        }

        #status {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* 파일 / 폴더 목록 */
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .item-icon {
            font-size: 23px;
            flex-shrink: 0;
        }

        .item-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .item-actions button {
            border: none;
            background: #eee;
            color: #333;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
        }

        .item-actions button:hover {
            background: #ddd;
        }

        .delete-btn {
            color: #b00020 !important;
        }

        /* 페이지 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .pagination button {
            min-width: 34px;
            height: 34px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 7px;
            cursor: pointer;
        }

        .pagination button:hover {
            background: #f2f2f2;
        }

        .pagination button.active {
            background: #222;
            color: white;
            border-color: #222;
        }

        .empty {
            color: #888;
            text-align: center;
            padding: 30px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>👋 익주의 공간</h1>

    <p class="subtitle">
        나만의 개인 홈페이지
    </p>

    <div class="cards">

        <div class="card" onclick="toggleFiles()">
            <div class="icon">📁</div>
            <h2>파일 보관함</h2>
            <p>Excel · PowerPoint · PDF</p>
        </div>

        <a class="card" href="#">
            <div class="icon">📝</div>
            <h2>Notes</h2>
            <p>메모와 기록</p>
        </a>

        <a class="card" href="#">
            <div class="icon">🔗</div>
            <h2>Links</h2>
            <p>자주 사용하는 사이트</p>
        </a>

        <a class="card" href="#">
            <div class="icon">📌</div>
            <h2>Projects</h2>
            <p>진행 중인 프로젝트</p>
        </a>

    </div>


    <!-- 파일 보관함 -->
    <div id="fileSection">

        <h2>📁 파일 보관함</h2>

        <!-- 현재 위치 -->
        <div id="breadcrumb" class="breadcrumb"></div>

        <!-- 버튼 -->
        <div class="toolbar">
            <button onclick="goParent()">
                ⬅️ 상위 폴더
            </button>

            <button onclick="createFolder()">
                📁 새 폴더
            </button>
        </div>

        <!-- 드래그 영역 -->
        <div id="dropZone" class="drop-zone">

            <div class="drop-icon">📂</div>

            <div class="drop-text">
                파일을 이곳으로 끌어다 놓으세요
            </div>

            <div class="drop-subtext">
                또는 클릭해서 파일 선택
            </div>

            <input
                type="file"
                id="fileInput"
            >

        </div>

        <div id="status"></div>

        <!-- 목록 -->
        <div id="fileList"></div>

        <!-- 페이지 -->
        <div id="pagination" class="pagination"></div>

    </div>

</div>


<script>

const API =
    "https://ikjoo123-github-io.zjaghkf0000.workers.dev";

const PAGE_SIZE = 30;

let currentFolder = "";
let currentPage = 1;

let allFiles = [];
let allFolders = [];

const dropZone =
    document.getElementById("dropZone");

const fileInput =
    document.getElementById("fileInput");


// ==========================================
// 파일 보관함 열기
// ==========================================

function toggleFiles() {

    const section =
        document.getElementById("fileSection");

    if (
        section.style.display === "none" ||
        section.style.display === ""
    ) {

        section.style.display = "block";

        currentFolder = "";
        currentPage = 1;

        loadFiles();

        section.scrollIntoView({
            behavior: "smooth"
        });

    } else {

        section.style.display = "none";

    }
}


// ==========================================
// 드롭 영역 클릭
// ==========================================

dropZone.addEventListener(
    "click",
    function() {
        fileInput.click();
    }
);


// ==========================================
// 파일 선택
// ==========================================

fileInput.addEventListener(
    "change",
    function() {

        if (fileInput.files.length) {

            for (
                const file of fileInput.files
            ) {
                uploadFile(file);
            }

        }

    }
);


// ==========================================
// 드래그
// ==========================================

dropZone.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();

        dropZone.classList.add("dragover");

    }
);


dropZone.addEventListener(
    "dragleave",
    function() {

        dropZone.classList.remove("dragover");

    }
);


dropZone.addEventListener(
    "drop",
    function(event) {

        event.preventDefault();

        dropZone.classList.remove("dragover");

        const files =
            event.dataTransfer.files;

        for (
            const file of files
        ) {
            uploadFile(file);
        }

    }
);


// ==========================================
// 파일 업로드
// ==========================================

async function uploadFile(file) {

    const status =
        document.getElementById("status");

    status.textContent =
        `"${file.name}" 업로드 중...`;


    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "folder",
        currentFolder
    );


    try {

        const response =
            await fetch(
                API + "/api/upload",
                {
                    method: "POST",
                    body: formData
                }
            );


        if (!response.ok) {
            throw new Error(
                "업로드 실패"
            );
        }


        status.textContent =
            `"${file.name}" 업로드 완료!`;


        fileInput.value = "";

        loadFiles();


    } catch (error) {

        console.error(error);

        status.textContent =
            `"${file.name}" 업로드 실패`;

    }
}


// ==========================================
// 파일 / 폴더 목록
// ==========================================

async function loadFiles() {

    const list =
        document.getElementById("fileList");

    list.innerHTML =
        "불러오는 중...";


    try {

        const response =
            await fetch(
                API +
                "/api/files?prefix=" +
                encodeURIComponent(currentFolder)
            );


        if (!response.ok) {
            throw new Error(
                "목록 불러오기 실패"
            );
        }


        const data =
            await response.json();


        allFiles =
            data.files || [];

        allFolders =
            data.folders || [];


        currentPage = 1;

        renderBreadcrumb();

        renderList();

    } catch (error) {

        console.error(error);

        list.innerHTML =
            '<div class="empty">파일 목록을 불러오지 못했습니다.</div>';

    }
}


// ==========================================
// 경로 표시
// ==========================================

function renderBreadcrumb() {

    const breadcrumb =
        document.getElementById("breadcrumb");

    breadcrumb.innerHTML = "";


    const homeButton =
        document.createElement("button");

    homeButton.textContent =
        "🏠 홈";

    homeButton.onclick =
        function() {

            currentFolder = "";

            currentPage = 1;

            loadFiles();

        };


    breadcrumb.appendChild(
        homeButton
    );


    if (!currentFolder) {
        return;
    }


    const parts =
        currentFolder
            .replace(/\/$/, "")
            .split("/");


    let path = "";


    parts.forEach(
        (part, index) => {

            const separator =
                document.createElement("span");

            separator.textContent =
                " / ";

            breadcrumb.appendChild(
                separator
            );


            path += part + "/";


            const button =
                document.createElement("button");

            button.textContent =
                part;


            const target =
                path;


            button.onclick =
                function() {

                    currentFolder =
                        target;

                    currentPage = 1;

                    loadFiles();

                };


            breadcrumb.appendChild(
                button
            );

        }
    );
}


// ==========================================
// 목록 표시
// ==========================================

function renderList() {

    const list =
        document.getElementById("fileList");

    list.innerHTML = "";


    // 폴더 먼저
    allFolders.forEach(
        folder => {

            const item =
                document.createElement("div");

            item.className =
                "item";


            const left =
                document.createElement("div");

            left.className =
                "item-left";


            const icon =
                document.createElement("div");

            icon.className =
                "item-icon";

            icon.textContent =
                "📁";


            const name =
                document.createElement("div");

            name.className =
                "item-name";

            name.textContent =
                folder.name;


            left.appendChild(icon);

            left.appendChild(name);


            const actions =
                document.createElement("div");

            actions.className =
                "item-actions";


            const openButton =
                document.createElement("button");

            openButton.textContent =
                "열기";


            openButton.onclick =
                function() {

                    currentFolder =
                        folder.key;

                    currentPage = 1;

                    loadFiles();

                };


            const deleteButton =
                document.createElement("button");

            deleteButton.textContent =
                "삭제";

            deleteButton.className =
                "delete-btn";


            deleteButton.onclick =
                function() {

                    deleteFolder(
                        folder.key,
                        folder.name
                    );

                };


            actions.appendChild(
                openButton
            );

            actions.appendChild(
                deleteButton
            );


            item.appendChild(left);

            item.appendChild(actions);

            list.appendChild(item);

        }
    );


    // 파일 30개씩
    const start =
        (currentPage - 1) * PAGE_SIZE;

    const end =
        start + PAGE_SIZE;

    const pageFiles =
        allFiles.slice(
            start,
            end
        );


    pageFiles.forEach(
        file => {

            const item =
                document.createElement("div");

            item.className =
                "item";


            const left =
                document.createElement("div");

            left.className =
                "item-left";


            const icon =
                document.createElement("div");

            icon.className =
                "item-icon";

            icon.textContent =
                "📄";


            const name =
                document.createElement("div");

            name.className =
                "item-name";

            name.textContent =
                file.name;


            left.appendChild(icon);

            left.appendChild(name);


            const actions =
                document.createElement("div");

            actions.className =
                "item-actions";


            const downloadButton =
                document.createElement("button");

            downloadButton.textContent =
                "다운로드";


            downloadButton.onclick =
                function() {

                    window.open(
                        API +
                        "/api/download?key=" +
                        encodeURIComponent(
                            file.key
                        ),
                        "_blank"
                    );

                };


            const deleteButton =
                document.createElement("button");

            deleteButton.textContent =
                "삭제";

            deleteButton.className =
                "delete-btn";


            deleteButton.onclick =
                function() {

                    deleteFile(
                        file.key,
                        file.name
                    );

                };


            actions.appendChild(
                downloadButton
            );

            actions.appendChild(
                deleteButton
            );


            item.appendChild(left);

            item.appendChild(actions);

            list.appendChild(item);

        }
    );


    if (
        !allFiles.length &&
        !allFolders.length
    ) {

        list.innerHTML =
            '<div class="empty">이 폴더는 비어 있습니다.</div>';

    }


    renderPagination();
}


// ==========================================
// 페이지
// ==========================================

function renderPagination() {

    const pagination =
        document.getElementById(
            "pagination"
        );

    pagination.innerHTML = "";


    const totalPages =
        Math.ceil(
            allFiles.length / PAGE_SIZE
        );


    if (totalPages <= 1) {
        return;
    }


    for (
        let page = 1;
        page <= totalPages;
        page++
    ) {

        const button =
            document.createElement("button");

        button.textContent =
            page;


        if (
            page === currentPage
        ) {

            button.classList.add(
                "active"
            );

        }


        button.onclick =
            function() {

                currentPage =
                    page;

                renderList();

                document
                    .getElementById(
                        "fileSection"
                    )
                    .scrollIntoView({
                        behavior: "smooth"
                    });

            };


        pagination.appendChild(
            button
        );

    }
}


// ==========================================
// 상위 폴더
// ==========================================

function goParent() {

    if (!currentFolder) {
        return;
    }


    const clean =
        currentFolder.replace(
            /\/$/,
            ""
        );


    const parts =
        clean.split("/");


    parts.pop();


    currentFolder =
        parts.length
            ? parts.join("/") + "/"
            : "";


    currentPage = 1;

    loadFiles();
}


// ==========================================
// 새 폴더
// ==========================================

async function createFolder() {

    const name =
        prompt(
            "새 폴더 이름을 입력하세요."
        );


    if (!name) {
        return;
    }


    try {

        const response =
            await fetch(
                API + "/api/folder",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        parent:
                            currentFolder,

                        name:
                            name
                    })
                }
            );


        if (!response.ok) {

            const message =
                await response.text();

            alert(message);

            return;

        }


        loadFiles();


    } catch (error) {

        console.error(error);

        alert(
            "폴더 생성에 실패했습니다."
        );

    }
}


// ==========================================
// 파일 삭제
// ==========================================

async function deleteFile(
    key,
    name
) {

    if (
        !confirm(
            `"${name}" 파일을 삭제할까요?`
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                API +
                "/api/file?key=" +
                encodeURIComponent(key),
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            alert(
                "파일 삭제에 실패했습니다."
            );

            return;

        }


        loadFiles();


    } catch (error) {

        console.error(error);

        alert(
            "파일 삭제에 실패했습니다."
        );

    }
}


// ==========================================
// 폴더 삭제
// ==========================================

async function deleteFolder(
    key,
    name
) {

    if (
        !confirm(
            `"${name}" 폴더와 그 안의 모든 파일을 삭제할까요?\n\n이 작업은 되돌릴 수 없습니다.`
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                API +
                "/api/folder?prefix=" +
                encodeURIComponent(key),
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            alert(
                "폴더 삭제에 실패했습니다."
            );

            return;

        }


        loadFiles();


    } catch (error) {

        console.error(error);

        alert(
            "폴더 삭제에 실패했습니다."
        );

    }
}

</script>

</body>
</html>
