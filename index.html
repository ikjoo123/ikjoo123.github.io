<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>익주</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #222;
}

.container {
    width: 100%;
    max-width: 700px;
    padding: 30px;
    text-align: center;
}

.logo {
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 10px;
}

.subtitle {
    color: #777;
    margin-bottom: 40px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    padding: 45px 20px;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.title {
    font-size: 21px;
    font-weight: 700;
}

.description {
    margin-top: 8px;
    color: #888;
    font-size: 14px;
}

@media (max-width: 600px) {
    .menu {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">익주</div>

    <div class="subtitle">
        나만의 공간
    </div>

    <div class="menu">

        <div class="card" onclick="location.href='work.html'">
            <div class="icon">📁</div>
            <div class="title">업무</div>
            <div class="description">
                업무 자료 · 메모 · 달력
            </div>
        </div>

        <div class="card" onclick="location.href='hobby.html'">
            <div class="icon">🎨</div>
            <div class="title">취미</div>
            <div class="description">
                음악 · 여행 · 사진 · 꿈
            </div>
        </div>

    </div>

</div>

</body>
</html>
