<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익주의 공간</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         sans-serif;
            background: #f7f7f5;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 50px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
            transition: 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .card p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        /* 파일 보관함 */
        #fileSection {
            display: none;
            margin-top: 35px;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        #fileSection h2 {
            margin-top: 0;
        }

        /* 드래그 영역 */
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            color: #777;
            cursor: pointer;
            transition: 0.2s;
        }

        .drop-zone:hover {
            border-color: #999;
            background: #fafafa;
        }

        .drop-zone.dragover {
            border-color: #222;
            background: #f3f3f3;
        }

        .drop-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .drop-text {
            font-size: 15px;
        }

        .drop-subtext {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
        }

        #fileInput {
            display: none;
        }

        #status {
            color: #777;
            font-size: 14px;
            margin: 18px 0;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .download-btn {
            flex-shrink: 0;
            border: none;
            background: #222;
            color: white;
            padding: 7px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
        }

        .download-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>👋 익주의 공간</h1>

    <p class="subtitle">
        나만의 개인 홈페이지
    </p>

    <div class="cards">

        <div class="card" onclick="toggleFiles()">
            <div class="icon">📁</div>
            <h2>파일 보관함</h2>
            <p>Excel · PowerPoint · PDF</p>
        </div>

        <a class="card" href="#">
            <div class="icon">📝</div>
            <h2>Notes</h2>
            <p>메모와 기록</p>
        </a>

        <a class="card" href="#">
            <div class="icon">🔗</div>
            <h2>Links</h2>
            <p>자주 사용하는 사이트</p>
        </a>

        <a class="card" href="#">
            <div class="icon">📌</div>
            <h2>Projects</h2>
            <p>진행 중인 프로젝트</p>
        </a>

    </div>


    <!-- 파일 보관함 -->
    <div id="fileSection">

        <h2>📁 파일 보관함</h2>

        <div
            id="dropZone"
            class="drop-zone"
        >

            <div class="drop-icon">📂</div>

            <div class="drop-text">
                파일을 이곳으로 끌어다 놓으세요
            </div>

            <div class="drop-subtext">
                또는 클릭해서 파일 선택
            </div>

            <input
                type="file"
                id="fileInput"
            >

        </div>

        <div id="status"></div>

        <div id="fileList"></div>

    </div>

</div>


<script>

const API =
    "https://ikjoo123-github-io.zjaghkf0000.workers.dev";


const dropZone =
    document.getElementById("dropZone");

const fileInput =
    document.getElementById("fileInput");


// 파일 보관함 열기
function toggleFiles() {

    const section =
        document.getElementById("fileSection");

    if (
        section.style.display === "none" ||
        section.style.display === ""
    ) {

        section.style.display = "block";

        loadFiles();

        section.scrollIntoView({
            behavior: "smooth"
        });

    } else {

        section.style.display = "none";

    }
}


// 드롭 영역 클릭
dropZone.addEventListener(
    "click",
    function() {
        fileInput.click();
    }
);


// 파일 선택
fileInput.addEventListener(
    "change",
    function() {

        if (fileInput.files.length) {
            uploadFile(fileInput.files[0]);
        }

    }
);


// 드래그 들어옴
dropZone.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();

        dropZone.classList.add("dragover");

    }
);


// 드래그 나감
dropZone.addEventListener(
    "dragleave",
    function() {

        dropZone.classList.remove("dragover");

    }
);


// 파일 놓기
dropZone.addEventListener(
    "drop",
    function(event) {

        event.preventDefault();

        dropZone.classList.remove("dragover");

        const files =
            event.dataTransfer.files;

        if (files.length) {
            uploadFile(files[0]);
        }

    }
);


// 파일 업로드
async function uploadFile(file) {

    const status =
        document.getElementById("status");

    status.textContent =
        `"${file.name}" 업로드 중...`;


    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );


    try {

        const response =
            await fetch(
                API + "/api/upload",
                {
                    method: "POST",
                    body: formData
                }
            );


        if (!response.ok) {
            throw new Error("업로드 실패");
        }


        status.textContent =
            `"${file.name}" 업로드 완료!`;


        fileInput.value = "";

        loadFiles();


    } catch (error) {

        console.error(error);

        status.textContent =
            "업로드에 실패했습니다.";

    }
}


// 파일 목록 불러오기
async function loadFiles() {

    const list =
        document.getElementById("fileList");

    list.innerHTML =
        "파일 목록 불러오는 중...";


    try {

        const response =
            await fetch(
                API + "/api/files"
            );


        const data =
            await response.json();


        if (!data.files.length) {

            list.innerHTML = `
                <p style="color:#777;">
                    저장된 파일이 없습니다.
                </p>
            `;

            return;
        }


        list.innerHTML = "";


        data.files.forEach(
            file => {

                const item =
                    document.createElement("div");

                item.className =
                    "file-item";


                const name =
                    document.createElement("div");

                name.className =
                    "file-name";

                name.textContent =
                    file.name;


                const button =
                    document.createElement("button");

                button.className =
                    "download-btn";

                button.textContent =
                    "다운로드";


                button.onclick =
                    function() {

                        window.open(
                            API +
                            "/api/download?key=" +
                            encodeURIComponent(file.key),
                            "_blank"
                        );

                    };


                item.appendChild(name);

                item.appendChild(button);

                list.appendChild(item);

            }
        );


    } catch (error) {

        console.error(error);

        list.innerHTML =
            "파일 목록을 불러오지 못했습니다.";

    }
}

</script>

</body>
</html>
